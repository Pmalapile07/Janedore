<style>
  /* Same type, inputs and buttons as Track your order and My account. */
  .login-page-container {
    display: flex;
    justify-content: center;
    padding: 40px 16px 64px;
  }
  .login-box {
    background: #fff;
    width: 100%;
    max-width: 560px;
    font-family: 'Inter', sans-serif;
  }
  .login-title {
    font-size: var(--heading-size);
    font-weight: 600;
    color: #111;
    margin-bottom: 24px;
  }
  .login-form-group {
    margin-bottom: 14px;
  }
  .login-form-group input {
    width: 100%;
    height: 46px;
    box-sizing: border-box;
    padding: 0 14px;
    border: 1px solid #d5d5d5;
    border-radius: 0;
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    outline: none;
    background: #fff;
    color: #111;
  }
  .login-form-group input:focus {
    border-color: #111;
  }
  .login-form-group input::placeholder {
    color: #999;
  }
  .login-btn {
    width: 100%;
    height: 46px;
    background: #111;
    color: #fff;
    border: none;
    font-family: 'Inter', sans-serif;
    font-size: calc(var(--ui-font-size, 9px) + 1px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: 500;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 6px;
  }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { background: #888; cursor: not-allowed; }
  .login-error {
    color: #c0392b;
    font-size: 12px;
    line-height: 1.5;
    margin-bottom: 14px;
    display: none;
    font-family: 'Inter', sans-serif;
  }
  /* Same type as the wishlist's sign-in line (wishlist.css). */
  .login-switch {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #666;
    line-height: 1.5;
    margin: -12px 0 24px;
  }
  .login-remember {
    display: flex;
    align-items: center;
    gap: 10px;
    margin: 4px 0 16px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    color: #111;
    cursor: pointer;
    user-select: none;
  }
  .login-remember input {
    appearance: none;
    -webkit-appearance: none;
    width: 16px;
    height: 16px;
    margin: 0;
    border: 1px solid #111;
    border-radius: 0;
    background: #fff;
    display: grid;
    place-content: center;
    cursor: pointer;
    flex-shrink: 0;
  }
  .login-remember input:checked { background: #111; }
  .login-remember input:checked::after {
    content: '';
    width: 4px;
    height: 8px;
    border: solid #fff;
    border-width: 0 1.5px 1.5px 0;
    transform: translateY(-1px) rotate(45deg);
  }
  .login-link {
    font: inherit;
    font-weight: 500;
    color: #111;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  /* Same grey box as "How exchanges work" (track-order.css .track-notice). */
  .login-legal {
    background: #f4f4f4;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.6;
    color: #444;
    padding: 14px 16px;
    margin-top: 24px;
  }
  .login-legal a { color: #111; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; }
  .login-form-group#password-group { position: relative; }
  .login-forgot {
    display: block;
    margin: 20px auto 0;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #888;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .login-forgot:hover { color: #111; }
  .login-notice {
    display: none;
    background: #809ADD;
    color: #111;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #aaa;
  }
  .login-divider::before,
  .login-divider::after { content: ''; flex: 1; height: 0.5px; background: #ddd; }
  .login-google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    color: #111;
    border: 0.8px solid #111;
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-google-btn:hover { background: #f4f4f4; }
  .login-google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

</style>

<!-- LOGIN / REGISTER VIEW -->
<div id="login-view">
  <div class="login-page-container">
    <div class="login-box">
      <div class="login-title" id="login-mode-title">Sign in</div>
      <p class="login-switch"><span id="login-switch-text">New customer?</span> <button type="button" class="login-link" id="toggle-mode-btn" onclick="toggleLoginMode()">Create an account</button></p>
      <div class="login-error" id="login-error"></div>
      
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="login-form-group" id="name-group" style="display:none;">
          <input type="text" id="login-name" placeholder="Full name">
        </div>
        <div class="login-form-group">
          <input type="email" id="login-email" required placeholder="Email">
        </div>
        <div class="login-form-group" id="password-group">
          <input type="password" id="login-password" required placeholder="Password" minlength="6">
        </div>
        <label class="login-remember" id="login-remember">
          <input type="checkbox" id="login-remember-input" checked>
          <span>Keep me signed in</span>
        </label>
        <div class="login-notice" id="login-notice"></div>
        <button type="submit" class="login-btn" id="login-submit-btn">Sign in</button>
      </form>

      <div id="login-social">
        <div class="login-divider"><span>or</span></div>
        <button type="button" class="login-google-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <button type="button" class="login-forgot" id="forgot-password-btn" onclick="setLoginMode('reset')">Forgot your password?</button>
      <div class="login-legal" id="login-legal">
        <span id="login-legal-lead">By signing in</span>, you agree to our <a onclick="navigateToContentPage('terms-conditions')">Terms &amp; Conditions</a> and acknowledge that your personal information will be processed in accordance with our <a onclick="navigateToContentPage('privacy-policy')">Privacy Policy</a> and the Protection of Personal Information Act (POPIA).
      </div>

    </div>
  </div>
</div>
