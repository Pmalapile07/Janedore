<style>
  .login-page-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 40px 16px;
  }
  .login-box {
    background: #fff;
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
  }
  .login-title {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #111;
    margin-bottom: 32px;
    text-align: center;
  }
  .login-form-group {
    margin-bottom: 24px;
  }
  .login-form-group input {
    width: 100%;
    padding: 10px 0;
    border: none;
    border-bottom: 0.5px solid #ccc;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    font-weight: 300;
    outline: none;
    background: transparent;
    color: #111;
    letter-spacing: 0.04em;
  }
  .login-form-group input:focus {
    border-bottom-color: #111;
  }
  .login-form-group input::placeholder {
    color: #aaa;
  }
  .login-btn {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    padding: 15px;
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { background: #888; cursor: not-allowed; }
  .login-error {
    color: #c00;
    font-size: 10px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
    font-family: 'Inter', sans-serif;
  }
  .login-link-wrap {
    text-align: center;
    margin-top: 20px;
  }
  .login-link {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #888;
    border-bottom: 0.8px solid #888;
    background: none;
    padding-bottom: 2px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-block;
    border: none;
    border-bottom: 0.8px solid #888;
  }
  .login-link:hover { color: #111; border-color: #111; }
  .login-form-group#password-group { position: relative; }
  .login-forgot {
    display: block;
    margin: 10px 0 0 auto;
    background: none;
    border: none;
    padding: 0;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #888;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .login-forgot:hover { color: #111; }
  .login-notice {
    display: none;
    background: #e6edd5;
    color: #111;
    font-family: 'Inter', sans-serif;
    font-size: 12px;
    line-height: 1.5;
    padding: 12px 14px;
    margin-bottom: 16px;
  }
  .login-divider {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 24px 0;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    color: #aaa;
  }
  .login-divider::before,
  .login-divider::after { content: ''; flex: 1; height: 0.5px; background: #ddd; }
  .login-google-btn {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    background: #fff;
    color: #111;
    border: 0.8px solid #111;
    padding: 13px;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.2s;
  }
  .login-google-btn:hover { background: #f4f4f4; }
  .login-google-btn:disabled { opacity: 0.6; cursor: not-allowed; }

  /* Account Dashboard */
  .account-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 16px;
  }
  .account-title {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .account-section {
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 0.5px solid #e5e5e5;
  }
  .account-section:last-child { border-bottom: none; }
  .account-section-title {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
  }
  .account-info {
    font-size: 13px;
    color: #111;
    margin-bottom: 4px;
  }
  .account-muted {
    font-size: 10px;
    color: #aaa;
  }
  .account-logout-btn {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #c00;
    border-bottom: 0.8px solid #c00;
    background: none;
    padding-bottom: 2px;
    cursor: pointer;
    transition: all 0.2s;
    display: inline-block;
    border: none;
    border-bottom: 0.8px solid #c00;
  }
  .account-logout-btn:hover { opacity: 0.7; }
  .account-order-card {
    padding: 12px 0;
    border-bottom: 0.5px solid #e5e5e5;
    font-size: 11px;
  }
  .account-order-card:last-child { border-bottom: none; }
  .account-order-number {
    font-family: 'Inter', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    text-transform: uppercase;
    color: #888;
  }
  .account-order-status {
    font-size: 10px;
    text-transform: uppercase;
  }
  @media (max-width: 480px) {
    .login-box { padding: 24px 16px; }
    .account-container { padding: 24px 12px; }
  }
</style>

<!-- LOGIN / REGISTER VIEW -->
<div id="login-view">
  <div class="login-page-container">
    <div class="login-box">
      <div class="login-title" id="login-mode-title">Sign In</div>
      <div class="login-error" id="login-error"></div>
      
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="login-form-group" id="name-group" style="display:none;">
          <input type="text" id="login-name" placeholder="Full name">
        </div>
        <div class="login-form-group">
          <input type="email" id="login-email" required placeholder="Email">
        </div>
        <div class="login-form-group" id="password-group">
          <input type="password" id="login-password" required placeholder="Password" minlength="6">
          <button type="button" class="login-forgot" id="forgot-password-btn" onclick="setLoginMode('reset')">Forgot password?</button>
        </div>
        <div class="login-notice" id="login-notice"></div>
        <button type="submit" class="login-btn" id="login-submit-btn">Sign In</button>
      </form>

      <div id="login-social">
        <div class="login-divider"><span>or</span></div>
        <button type="button" class="login-google-btn" id="google-signin-btn" onclick="handleGoogleSignIn()">
          <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
          <span>Continue with Google</span>
        </button>
      </div>

      <div class="login-link-wrap">
        <button class="login-link" id="toggle-mode-btn" onclick="toggleLoginMode()">Create an account</button>
      </div>
    </div>
  </div>
</div>

<!-- ACCOUNT DASHBOARD VIEW -->
<div id="account-view" style="display:none;">
  <div class="account-container">
    <div class="account-title">My Account</div>
    
    <div class="account-section">
      <div class="account-section-title">Profile</div>
      <div class="account-info" id="account-name">-</div>
      <div class="account-muted" id="account-email">-</div>
    </div>
    
    <div class="account-section">
      <div class="account-section-title">My Orders</div>
      <div id="account-orders">
        <p class="account-muted">Loading orders...</p>
      </div>
    </div>
    
    <div class="account-section">
      <div class="account-section-title">My Reviews</div>
      <div id="account-reviews">
        <p class="account-muted">Loading reviews...</p>
      </div>
    </div>
    
    <button class="account-logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>
</div>

<script>
// ==================== LOGIN SYSTEM ====================

let loginMode = 'signin';

function navigateToLogin() {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const loginPage = document.getElementById("page-login");
  if (loginPage) {
    loginPage.classList.add("active");
    S.currentPage = "login";
    updateHash('login');
    window.scrollTo({ top: 0, behavior: "smooth" });
    ensureNavScrolled();
    
    const user = firebase.auth().currentUser;
    if (user) {
      showAccountView();
    } else {
      showLoginView();
    }
  }
}

function navigateToAccount() {
  document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
  const accountPage = document.getElementById("page-account");
  if (accountPage) {
    accountPage.classList.add("active");
    S.currentPage = "account";
    updateHash('account');
    window.scrollTo({ top: 0, behavior: "smooth" });
    ensureNavScrolled();
    
    const user = firebase.auth().currentUser;
    if (user) {
      showAccountView();
      loadAccountData();
    } else {
      navigateToLogin();
    }
  }
}

function showLoginView() {
  const loginView = document.getElementById('login-view');
  const accountView = document.getElementById('account-view');
  if (loginView) loginView.style.display = 'block';
  if (accountView) accountView.style.display = 'none';
  loginMode = 'signin';
  updateLoginModeUI();
}

function showAccountView() {
  const loginView = document.getElementById('login-view');
  const accountView = document.getElementById('account-view');
  if (loginView) loginView.style.display = 'none';
  if (accountView) accountView.style.display = 'block';
  loadAccountData();
}

function toggleLoginMode() {
  loginMode = loginMode === 'signin' ? 'signup' : 'signin';
  updateLoginModeUI();
}

function updateLoginModeUI() {
  const title = document.getElementById('login-mode-title');
  const submitBtn = document.getElementById('login-submit-btn');
  const toggleBtn = document.getElementById('toggle-mode-btn');
  const nameGroup = document.getElementById('name-group');
  const errorEl = document.getElementById('login-error');
  
  if (errorEl) errorEl.style.display = 'none';
  
  if (loginMode === 'signin') {
    if (title) title.textContent = 'Sign In';
    if (submitBtn) submitBtn.textContent = 'Sign In';
    if (toggleBtn) toggleBtn.textContent = 'Create an account';
    if (nameGroup) nameGroup.style.display = 'none';
  } else {
    if (title) title.textContent = 'Create Account';
    if (submitBtn) submitBtn.textContent = 'Create Account';
    if (toggleBtn) toggleBtn.textContent = 'Already have an account? Sign in';
    if (nameGroup) nameGroup.style.display = 'block';
  }
}

async function handleLoginSubmit(e) {
  e.preventDefault();
  
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  const name = document.getElementById('login-name').value.trim();
  const errorEl = document.getElementById('login-error');
  const submitBtn = document.getElementById('login-submit-btn');
  
  if (errorEl) errorEl.style.display = 'none';
  if (submitBtn) {
    submitBtn.disabled = true;
    submitBtn.textContent = 'Please wait...';
  }
  
  try {
    if (loginMode === 'signup') {
      if (!name) {
        throw new Error('Please enter your full name.');
      }
      const userCredential = await firebase.auth().createUserWithEmailAndPassword(email, password);
      await userCredential.user.updateProfile({ displayName: name });
      await db.collection('customers').doc(userCredential.user.uid).set({
        name: name,
        email: email,
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }, { merge: true });
    } else {
      await firebase.auth().signInWithEmailAndPassword(email, password);
    }
    
    showAccountView();
    updateHash('account');
    
  } catch (error) {
    if (errorEl) {
      errorEl.textContent = error.message;
      errorEl.style.display = 'block';
    }
  } finally {
    if (submitBtn) {
      submitBtn.disabled = false;
      submitBtn.textContent = loginMode === 'signin' ? 'Sign In' : 'Create Account';
    }
  }
}

async function handleLogout() {
  try {
    await firebase.auth().signOut();
    showLoginView();
    updateHash('login');
  } catch (e) {
    console.warn('Logout error:', e);
  }
}

async function loadAccountData() {
  const user = firebase.auth().currentUser;
  if (!user) return;
  
  const nameEl = document.getElementById('account-name');
  const emailEl = document.getElementById('account-email');
  if (nameEl) nameEl.textContent = user.displayName || 'Customer';
  if (emailEl) emailEl.textContent = user.email;
  
  // Load orders (no composite index required)
  try {
    const ordersSnap = await db.collection('orders')
      .where('customerEmail', '==', user.email)
      .limit(50)
      .get();
    
    const ordersContainer = document.getElementById('account-orders');
    if (!ordersContainer) return;
    
    if (ordersSnap.empty) {
      ordersContainer.innerHTML = '<p class="account-muted">No orders yet.</p>';
    } else {
      // Sort manually instead of using orderBy
      const orders = ordersSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      orders.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      
      let ordersHTML = '';
      orders.forEach(o => {
        const date = o.createdAt ? new Date(o.createdAt.seconds * 1000).toLocaleDateString() : 'N/A';
        ordersHTML += `<div class="account-order-card">
          <div class="account-order-number">Order #${o.orderNumber || o.id.substring(0, 12)}</div>
          <div style="margin-top:4px;">${o.itemCount || 0} items · ${formatPrice(o.total || o.subtotal || 0)}</div>
          <div style="margin-top:2px;display:flex;justify-content:space-between;">
            <span class="account-order-status" style="color:${o.status === 'pending' ? '#e65100' : '#0a0'};">${o.status || 'pending'}</span>
            <span style="font-size:10px;color:#aaa;">${date}</span>
          </div>
        </div>`;
      });
      ordersContainer.innerHTML = ordersHTML;
    }
  } catch (e) {
    console.warn('Orders load error:', e);
    const ordersContainer = document.getElementById('account-orders');
    if (ordersContainer) ordersContainer.innerHTML = '<p class="account-muted">Unable to load orders.</p>';
  }
  
  // Load reviews (no composite index required)
  try {
    const reviewsSnap = await db.collection('reviews')
      .where('name', '==', user.displayName || '')
      .limit(20)
      .get();
    
    const reviewsContainer = document.getElementById('account-reviews');
    if (!reviewsContainer) return;
    
    if (reviewsSnap.empty) {
      reviewsContainer.innerHTML = '<p class="account-muted">No reviews yet.</p>';
    } else {
      const reviews = reviewsSnap.docs.map(d => ({ id: d.id, ...d.data() }));
      reviews.sort((a, b) => (b.createdAt?.seconds || 0) - (a.createdAt?.seconds || 0));
      
      let reviewsHTML = '';
      reviews.forEach(r => {
        const date = r.createdAt ? new Date(r.createdAt.seconds * 1000).toLocaleDateString() : 'N/A';
        reviewsHTML += `<div class="account-order-card">
          <div>${'★'.repeat(r.rating || 0)}${'☆'.repeat(5 - (r.rating || 0))}</div>
          <div style="margin-top:2px;font-size:12px;">${r.text || 'No comment'}</div>
          <div style="margin-top:2px;font-size:10px;color:#aaa;">${date}</div>
        </div>`;
      });
      reviewsContainer.innerHTML = reviewsHTML;
    }
  } catch (e) {
    console.warn('Reviews load error:', e);
    const reviewsContainer = document.getElementById('account-reviews');
    if (reviewsContainer) reviewsContainer.innerHTML = '<p class="account-muted">Unable to load reviews.</p>';
  }
}

// Auth state listener
firebase.auth().onAuthStateChanged(user => {
  if (user) {
    if (S.currentPage === 'login') {
      showAccountView();
      updateHash('account');
    }
    if (S.currentPage === 'account') {
      showAccountView();
      loadAccountData();
    }
  } else {
    if (S.currentPage === 'login') {
      showLoginView();
    }
    if (S.currentPage === 'account') {
      navigateToLogin();
    }
  }
});
</script>
