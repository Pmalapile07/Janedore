<style>
  .login-page-container {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 80vh;
    padding: 40px 16px;
  }
  .login-box {
    background: #fff;
    padding: 40px 32px;
    width: 100%;
    max-width: 400px;
    border: 0.5px solid #e5e5e5;
  }
  .login-logo {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 300;
    text-align: center;
    margin-bottom: 4px;
  }
  .login-subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    text-transform: uppercase;
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    color: #888;
    text-align: center;
    margin-bottom: 32px;
  }
  .login-form-group {
    margin-bottom: 18px;
  }
  .login-form-group label {
    display: block;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 400;
    color: #111;
    margin-bottom: 8px;
    letter-spacing: 0.02em;
  }
  .login-form-group input {
    width: 100%;
    padding: 14px 16px;
    border: 0.5px solid #ccc;
    font-family: 'Manrope', sans-serif;
    font-size: 14px;
    font-weight: 300;
    outline: none;
    transition: border 0.2s;
    background: #fff;
    color: #111;
    letter-spacing: 0.01em;
  }
  .login-form-group input:focus {
    border-color: #111;
  }
  .login-form-group input::placeholder {
    color: #bbb;
    font-size: 14px;
  }
  .login-btn {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    padding: 16px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.1em;
    font-weight: 400;
    text-transform: uppercase;
    cursor: pointer;
    transition: background 0.2s;
    margin-top: 8px;
  }
  .login-btn:hover { background: #333; }
  .login-btn:disabled { background: #888; cursor: not-allowed; }
  .login-error {
    color: #c00;
    font-size: 10px;
    text-align: center;
    margin-bottom: 12px;
    display: none;
    font-family: 'Manrope', sans-serif;
  }
  .login-link {
    display: block;
    text-align: center;
    margin-top: 20px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #888;
    border-bottom: 0.8px solid #888;
    background: none;
    padding-bottom: 2px;
    cursor: pointer;
    transition: all 0.2s;
    width: auto;
    display: inline-block;
  }
  .login-link:hover { color: #111; border-color: #111; }
  .login-link-wrap {
    text-align: center;
    margin-top: 20px;
  }
  .login-divider {
    text-align: center;
    margin: 24px 0;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    color: #ccc;
    text-transform: uppercase;
  }
  .login-back-btn {
    display: inline-block;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #888;
    border-bottom: 0.8px solid #888;
    background: none;
    padding-bottom: 2px;
    cursor: pointer;
    transition: all 0.2s;
    margin-bottom: 24px;
  }
  .login-back-btn:hover { color: #111; border-color: #111; }

  /* Account Dashboard */
  .account-container {
    max-width: 600px;
    margin: 0 auto;
    padding: 40px 16px;
  }
  .account-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    margin-bottom: 32px;
  }
  .account-section {
    margin-bottom: 32px;
    padding-bottom: 32px;
    border-bottom: 0.5px solid #e5e5e5;
  }
  .account-section:last-child { border-bottom: none; }
  .account-section-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #888;
    margin-bottom: 12px;
  }
  .account-info {
    font-size: 13px;
    color: #111;
    margin-bottom: 4px;
  }
  .account-muted {
    font-size: 10px;
    color: #aaa;
  }
  .account-logout-btn {
    display: inline-block;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #c00;
    border-bottom: 0.8px solid #c00;
    background: none;
    padding-bottom: 2px;
    cursor: pointer;
    transition: all 0.2s;
    margin-top: 16px;
  }
  .account-logout-btn:hover { opacity: 0.7; }
  .account-order-card {
    padding: 12px 0;
    border-bottom: 0.5px solid #e5e5e5;
    font-size: 11px;
  }
  .account-order-card:last-child { border-bottom: none; }
  .account-order-number {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    text-transform: uppercase;
    color: #888;
  }
  .account-order-status {
    font-size: 10px;
    text-transform: uppercase;
  }
  @media (max-width: 480px) {
    .login-box { padding: 24px 16px; }
    .account-container { padding: 24px 12px; }
  }
</style>

<!-- LOGIN / REGISTER VIEW -->
<div id="login-view">
  <div class="login-page-container">
    <div class="login-box">
      <button class="login-back-btn" onclick="navigateTo('home')">← Back</button>
      <div class="login-logo">JANEDORE</div>
      <div class="login-subtitle" id="login-mode-title">Sign In</div>
      <div class="login-error" id="login-error"></div>
      
      <form id="login-form" onsubmit="handleLoginSubmit(event)">
        <div class="login-form-group" id="name-group" style="display:none;">
          <label>Full Name</label>
          <input type="text" id="login-name" placeholder="First and last name">
        </div>
        <div class="login-form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="your@email.com">
        </div>
        <div class="login-form-group">
          <label>Password</label>
          <input type="password" id="login-password" required placeholder="••••••••" minlength="6">
        </div>
        <button type="submit" class="login-btn" id="login-submit-btn">Sign In</button>
      </form>
      
      <div class="login-link-wrap">
        <button class="login-link" id="toggle-mode-btn" onclick="toggleLoginMode()">Create an account</button>
      </div>
    </div>
  </div>
</div>

<!-- ACCOUNT DASHBOARD VIEW -->
<div id="account-view" style="display:none;">
  <div class="account-container">
    <button class="login-back-btn" onclick="navigateTo('home')">← Back to Store</button>
    <div class="account-title">My Account</div>
    
    <div class="account-section">
      <div class="account-section-title">Profile</div>
      <div class="account-info" id="account-name">—</div>
      <div class="account-muted" id="account-email">—</div>
    </div>
    
    <div class="account-section">
      <div class="account-section-title">My Orders</div>
      <div id="account-orders">
        <p class="account-muted">Loading orders...</p>
      </div>
    </div>
    
    <div class="account-section">
      <div class="account-section-title">My Reviews</div>
      <div id="account-reviews">
        <p class="account-muted">Loading reviews...</p>
      </div>
    </div>
    
    <button class="account-logout-btn" onclick="handleLogout()">Sign Out</button>
  </div>
</div>
