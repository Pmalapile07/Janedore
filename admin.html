<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<title>Janedore Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/light/style.css">
<!-- Regular (plain "ph" prefix) and fill ("ph-fill" prefix) weights —
     every existing icon here still uses ph-light, these two are just
     for the handful that need a bolder look (Create Order's
     plus-circle, the filled three-dot "more" glyph). -->
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/fill/style.css">
<link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/bold/style.css">
<link rel="stylesheet" href="admin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-brand"><span class="login-logo">JANEDORE</span><span class="login-sub">Studio Admin</span></div>
  <div class="login-card">
    <div class="login-card-title">Sign in</div>
    <form onsubmit="handleLogin(event)">
      <div class="login-field"><label>Email</label><input type="email" id="login-email" placeholder="admin@janedore.co.za" autocomplete="email"></div>
      <div class="login-field"><label>Password</label><div class="login-field-wrap"><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="pw-toggle" onclick="togglePw()">SHOW</button></div></div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>

<div id="admin-panel">
  <nav id="top-nav">
    <span class="nav-brand-wrap">
      <span class="nav-brand" id="top-nav-title">Dashboard</span>
      <i class="ph ph-caret-down nav-brand-caret"></i>
    </span>
    <!-- Per-tab action buttons (Create Order + its own order-actions
         menu, etc) render here — see switchTab() in admin.js, which
         clears this on every tab change, and _renderOrdersTab() in
         admin-orders.js, which is the only one that currently fills
         it. No account/profile icon here on purpose — this header is
         just the page title + per-tab actions now. -->
    <div id="top-nav-actions" class="top-nav-actions"></div>
  </nav>

  <nav id="desktop-sidebar">
    <div class="sidebar-section-label">Main</div>
    <button class="sidebar-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="sidebar-icon"><i class="ph-light ph-chart-line"></i></span>Home</button>
    <button class="sidebar-btn" data-tab="orders" onclick="switchTab('orders')"><span class="sidebar-icon"><i class="ph-light ph-folders"></i></span>Orders</button>

    <div class="sidebar-section-label">Products</div>
    <button class="sidebar-btn" data-tab="products" onclick="switchTab('products')"><span class="sidebar-icon"><i class="ph-light ph-barcode"></i></span>Products</button>
    <button class="sidebar-btn" data-tab="reviews" onclick="switchTab('reviews')"><span class="sidebar-icon"><i class="ph-light ph-star"></i></span>Reviews</button>

    <div class="sidebar-section-label">Customers</div>
    <button class="sidebar-btn" data-tab="customers" onclick="switchTab('customers')"><span class="sidebar-icon"><i class="ph-light ph-folder-simple-user"></i></span>Customers</button>
    <button class="sidebar-btn" data-tab="messages" onclick="switchTab('messages')"><span class="sidebar-icon"><i class="ph-light ph-chat"></i></span>Inbox</button>

    <button class="sidebar-btn" id="vendors-tab-btn" data-tab="vendors" onclick="switchTab('vendors')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-handshake"></i></span>Vendors</button>
    <button class="sidebar-btn" id="admins-tab-btn" data-tab="admins" onclick="switchTab('admins')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-users-three"></i></span>Admins</button>

    <div class="sidebar-section-label">Growth</div>
    <button class="sidebar-btn" data-tab="discounts" onclick="switchTab('discounts')"><span class="sidebar-icon"><i class="ph-light ph-tag"></i></span>Discounts</button>
    <button class="sidebar-btn" data-tab="newsletter" onclick="switchTab('newsletter')"><span class="sidebar-icon"><i class="ph-light ph-mailbox"></i></span>Newsletter</button>

    <div class="sidebar-section-label">Content</div>
    <button class="sidebar-btn" id="homepage-tab-btn" data-tab="homepage" onclick="switchTab('homepage')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-browser"></i></span>Homepage</button>
    <button class="sidebar-btn" id="pages-tab-btn" data-tab="pages" onclick="switchTab('pages')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-file-text"></i></span>Pages</button>
    <button class="sidebar-btn" id="online-store-tab-btn" data-tab="onlineStore" onclick="switchTab('onlineStore')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-storefront"></i></span>Online Store</button>

    <button class="sidebar-btn" data-tab="analytics" onclick="switchTab('analytics')"><span class="sidebar-icon"><i class="ph-light ph-chart-bar"></i></span>Analytics</button>
    <button class="sidebar-btn" id="settings-tab-btn" data-tab="settings" onclick="switchTab('settings')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-gear"></i></span>Settings</button>

    <div class="sidebar-section-label">Developer Tools</div>
    <button class="sidebar-btn" id="devtools-tab-btn" data-tab="devtools" onclick="switchTab('devtools')" style="display:none;"><span class="sidebar-icon"><i class="ph-light ph-wrench"></i></span>Developer Tools</button>

    <div style="flex:1;"></div>
    <div class="sidebar-section-label">Account</div>
    <div style="padding:8px 12px 4px;"><div style="font-size:11px;color:var(--muted);" id="admin-email">—</div><span class="role-badge" id="admin-role-badge" style="display:none;margin-top:5px;"></span></div>
    <button class="sidebar-btn" onclick="handleLogout()" style="color:var(--danger);"><span class="sidebar-icon"><i class="ph-light ph-sign-out"></i></span>Sign Out</button>
  </nav>

  <div id="app-body"><main id="main-content"></main></div>

  <div id="bottom-nav">
    <button class="bnav-search-btn" onclick="window._openAdminSearch()" aria-label="Search"><i class="ph-bold ph-magnifying-glass"></i></button>
    <div class="bottom-nav-pill">
      <button class="bnav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')" aria-label="Home"><i class="ph-fill ph-house"></i></button>
      <button class="bnav-btn" data-tab="orders" onclick="switchTab('orders')" aria-label="Orders"><i class="ph-bold ph-cardholder"></i></button>
      <button class="bnav-btn" data-tab="products" onclick="switchTab('products')" aria-label="Products"><i class="ph-bold ph-tag" style="display:inline-block;transform:scaleX(-1);"></i></button>
      <button class="bnav-btn" onclick="openMoreMenu()" aria-label="More"><i class="ph-bold ph-list"></i><span class="bnav-badge" id="bnav-msg-badge"></span></button>
    </div>
    <button class="bnav-jai-btn" onclick="window._showToast('Jai is coming soon')" aria-label="Jai"><i class="ph-bold ph-robot"></i></button>
  </div>

  <div id="admin-search-overlay">
    <div class="admin-search-header">
      <button class="admin-search-close" onclick="window._closeAdminSearch()" aria-label="Close search"><i class="ph ph-x"></i></button>
      <div class="admin-search-input-wrap">
        <i class="ph ph-magnifying-glass"></i>
        <input type="text" id="admin-search-input" placeholder="Search" autocomplete="off" oninput="window._runAdminSearch()">
      </div>
    </div>
    <div class="admin-search-tabs" id="admin-search-tabs">
      <button class="admin-search-tab active" data-scope="all" onclick="window._setAdminSearchScope('all')">All<span class="admin-search-tab-count" id="search-count-all"></span></button>
      <button class="admin-search-tab" data-scope="orders" onclick="window._setAdminSearchScope('orders')">Orders<span class="admin-search-tab-count" id="search-count-orders"></span></button>
      <button class="admin-search-tab" data-scope="products" onclick="window._setAdminSearchScope('products')">Products<span class="admin-search-tab-count" id="search-count-products"></span></button>
      <button class="admin-search-tab" data-scope="customers" onclick="window._setAdminSearchScope('customers')">Customers<span class="admin-search-tab-count" id="search-count-customers"></span></button>
      <button class="admin-search-tab admin-search-tab-filters" onclick="window._showToast('Filters coming soon')"><i class="ph ph-funnel-simple"></i> All filters</button>
    </div>
    <div class="admin-search-body" id="admin-search-body"></div>
  </div>

  <div id="more-menu-overlay" onclick="closeMoreMenu()"></div>
  <div id="more-menu-panel">
    <button class="more-menu-item mmi-teal" onclick="closeMoreMenu();switchTab('dashboard')"><div class="more-menu-icon"><i class="ph-light ph-house"></i></div><div style="flex:1"><div class="more-menu-item-label">Home</div><div class="more-menu-item-desc">Dashboard overview</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-teal" onclick="closeMoreMenu();switchTab('messages')"><div class="more-menu-icon"><i class="ph-light ph-chat"></i></div><div style="flex:1"><div class="more-menu-item-label">Inbox</div><div class="more-menu-item-desc">Customer messages</div></div><span class="bnav-badge" id="more-msg-badge" style="position:static;border:none;margin-right:2px;"></span><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-blue" onclick="closeMoreMenu();switchTab('customers')"><div class="more-menu-icon"><i class="ph-light ph-folder-simple-user"></i></div><div style="flex:1"><div class="more-menu-item-label">Customers</div><div class="more-menu-item-desc">View &amp; manage customers</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-orange" onclick="closeMoreMenu();switchTab('reviews')"><div class="more-menu-icon"><i class="ph-light ph-star"></i></div><div style="flex:1"><div class="more-menu-item-label">Reviews</div><div class="more-menu-item-desc">Moderate product reviews</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-purple" id="vendors-more-item" onclick="closeMoreMenu();switchTab('vendors')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-handshake"></i></div><div style="flex:1"><div class="more-menu-item-label">Vendors</div><div class="more-menu-item-desc">Manage brand partners</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="admins-more-item" onclick="closeMoreMenu();switchTab('admins')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-users-three"></i></div><div style="flex:1"><div class="more-menu-item-label">Admins</div><div class="more-menu-item-desc">Manage staff accounts</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-teal" onclick="closeMoreMenu();switchTab('discounts')"><div class="more-menu-icon"><i class="ph-light ph-tag"></i></div><div style="flex:1"><div class="more-menu-item-label">Discounts</div><div class="more-menu-item-desc">Create &amp; manage discount codes</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-green" onclick="closeMoreMenu();switchTab('newsletter')"><div class="more-menu-icon"><i class="ph-light ph-mailbox"></i></div><div style="flex:1"><div class="more-menu-item-label">Newsletter</div><div class="more-menu-item-desc">Subscriber management</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-gray" id="homepage-more-item" onclick="closeMoreMenu();switchTab('homepage')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-browser"></i></div><div style="flex:1"><div class="more-menu-item-label">Homepage</div><div class="more-menu-item-desc">Edit hero, sections &amp; collection pages</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="pages-more-item" onclick="closeMoreMenu();switchTab('pages')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-file-text"></i></div><div style="flex:1"><div class="more-menu-item-label">Pages</div><div class="more-menu-item-desc">Edit policy &amp; help pages</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="online-store-more-item" onclick="closeMoreMenu();switchTab('onlineStore')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-storefront"></i></div><div style="flex:1"><div class="more-menu-item-label">Online Store</div><div class="more-menu-item-desc">Coming Soon page on/off</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-blue" onclick="closeMoreMenu();switchTab('analytics')"><div class="more-menu-icon"><i class="ph-light ph-chart-bar"></i></div><div style="flex:1"><div class="more-menu-item-label">Analytics</div><div class="more-menu-item-desc">Reports &amp; insights</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="settings-more-item" onclick="closeMoreMenu();switchTab('settings')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-gear"></i></div><div style="flex:1"><div class="more-menu-item-label">Settings</div><div class="more-menu-item-desc">Platform configuration</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="devtools-more-item" onclick="closeMoreMenu();switchTab('devtools')" style="display:none;"><div class="more-menu-icon"><i class="ph-light ph-wrench"></i></div><div style="flex:1"><div class="more-menu-item-label">Developer Tools</div><div class="more-menu-item-desc">Diagnostics &amp; utilities</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-red" onclick="closeMoreMenu();handleLogout()"><div class="more-menu-icon"><i class="ph-light ph-sign-out"></i></div><div style="flex:1"><div class="more-menu-item-label">Sign Out</div><div class="more-menu-item-desc" id="admin-email-more">—</div></div></button>
  </div>
</div>

<div id="modal-container"></div>
<div id="panel-container"></div>
<div id="toast-container"></div>

<script>
function togglePw(){
  var i=document.getElementById('login-password'),b=document.querySelector('.pw-toggle');
  if(i.type==='password'){i.type='text';b.textContent='HIDE';}else{i.type='password';b.textContent='SHOW';}
}
function openMoreMenu(){if(window._closeAdminSearch)window._closeAdminSearch();document.getElementById('more-menu-overlay').classList.add('open');document.getElementById('more-menu-panel').classList.add('open');if(window._setBottomNavActive)window._setBottomNavActive('more');}
function closeMoreMenu(){document.getElementById('more-menu-overlay').classList.remove('open');document.getElementById('more-menu-panel').classList.remove('open');if(window._revertBottomNavActive)window._revertBottomNavActive();}

// No manual theme toggle anymore — the admin now just follows the
// device's own light/dark setting automatically, via the
// prefers-color-scheme CSS in admin.css. No JS needed for that.
</script>

<script>
fetch('/api/cloudinary-config')
  .then(function(res) { return res.json(); })
  .then(function(config) {
    window.CLOUDINARY_CLOUD_NAME = config.cloudName;
    window.CLOUDINARY_UPLOAD_PRESET = config.uploadPreset;
  })
  .catch(function(err) {
    console.error('Cloudinary config failed to load', err);
  });
</script>
  
<script src="permissions.js"></script>
<script src="admin.js"></script>
<script src="admin-inbox.js"></script>

<script src="admin-dashboard.js"></script>
<script src="admin-products.js"></script>
<script src="admin-orders.js"></script>
<script src="admin-customers.js"></script>
<script src="admin-reviews.js"></script>
<script src="admin-newsletter.js"></script>
<script src="admin-vendors.js"></script>
<script src="admin-admins.js"></script>
<script src="admin-pages.js"></script>
<script src="admin-homepage.js"></script>
<script src="admin-launch.js"></script>
<script src="admin-settings.js"></script>
<script src="admin-online-store.js"></script>
<script src="admin-discounts.js"></script>
<script src="admin-devtools.js"></script>

</body>
</html>
