<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/apple-touch-icon.png">
<title>Janedore Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="admin.css">
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://upload-widget.cloudinary.com/global/all.js" type="text/javascript"></script>
</head>
<body>

<div id="login-screen">
  <div class="login-brand"><span class="login-logo">JANEDORE</span><span class="login-sub">Studio Admin</span></div>
  <div class="login-card">
    <div class="login-card-title">Sign in</div>
    <form onsubmit="handleLogin(event)">
      <div class="login-field"><label>Email</label><input type="email" id="login-email" placeholder="admin@janedore.co.za" autocomplete="email"></div>
      <div class="login-field"><label>Password</label><div class="login-field-wrap"><input type="password" id="login-password" placeholder="••••••••" autocomplete="current-password"><button type="button" class="pw-toggle" onclick="togglePw()">SHOW</button></div></div>
      <div class="login-error" id="login-error"></div>
      <button type="submit" class="login-btn">Sign In</button>
    </form>
  </div>
</div>

<div id="admin-panel">
  <nav id="top-nav">
    <span class="nav-brand">JANEDORE</span>
    <div class="nav-status-area"><div class="status-dot" id="status-dot"></div><span id="product-count" style="font-size:10px;color:rgba(255,255,255,0.35);">—</span></div>
    <button class="nav-icon-btn" onclick="switchTab('messages')" title="Messages" aria-label="Messages"><span>✉</span><span id="messages-unread-badge" style="display:none;align-items:center;"></span></button>
    <div class="nav-avatar" id="admin-avatar" title="Account"><span id="admin-initials">A</span></div>
  </nav>
  <nav id="desktop-sidebar">
    <div class="sidebar-section-label">Main</div>
    <button class="sidebar-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="sidebar-icon">⊞</span>Dashboard</button>
    <button class="sidebar-btn" data-tab="orders" onclick="switchTab('orders')"><span class="sidebar-icon">◫</span>Orders</button>
    <button class="sidebar-btn" data-tab="products" onclick="switchTab('products')"><span class="sidebar-icon">⊟</span>Products</button>
    <button class="sidebar-btn" data-tab="messages" onclick="switchTab('messages')"><span class="sidebar-icon">✉</span>Inbox</button>
    <div class="sidebar-section-label">Store</div>
    <button class="sidebar-btn" data-tab="customers" onclick="switchTab('customers')"><span class="sidebar-icon">◯</span>Customers</button>
    <button class="sidebar-btn" data-tab="reviews" onclick="switchTab('reviews')"><span class="sidebar-icon">★</span>Reviews</button>
    <button class="sidebar-btn" data-tab="newsletter" onclick="switchTab('newsletter')"><span class="sidebar-icon">◎</span>Newsletter</button>
    <button class="sidebar-btn" id="vendors-tab-btn" data-tab="vendors" onclick="switchTab('vendors')" style="display:none;"><span class="sidebar-icon">⬡</span>Vendors</button>
    <div style="flex:1;"></div>
    <div class="sidebar-section-label">Account</div>
    <div style="padding:8px 12px 4px;"><div style="font-size:11px;color:var(--muted);" id="admin-email">—</div><span class="role-badge" id="admin-role-badge" style="display:none;margin-top:5px;"></span></div>
    <button class="sidebar-btn" onclick="handleLogout()" style="color:var(--danger);"><span class="sidebar-icon">⏏</span>Sign Out</button>
    <button class="sidebar-btn btn-sm" id="btn-seed" onclick="seedDefaultData()" style="display:none;font-size:11px;color:var(--muted);"><span class="sidebar-icon">⬆</span>Seed Data</button>
  </nav>
  <div id="app-body"><main id="main-content"></main></div>
  <div id="bottom-nav">
    <div class="bottom-nav-pill">
      <button class="bnav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')"><span class="bnav-icon">⊞</span><span class="bnav-label">Home</span></button>
      <button class="bnav-btn" data-tab="orders" onclick="switchTab('orders')"><span class="bnav-icon">◫</span><span class="bnav-label">Orders</span></button>
      <button class="bnav-btn" data-tab="products" onclick="switchTab('products')"><span class="bnav-icon">⊟</span><span class="bnav-label">Products</span></button>
      <button class="bnav-btn" data-tab="messages" onclick="switchTab('messages')"><span class="bnav-icon">✉</span><span class="bnav-label">Inbox</span><span class="bnav-badge" id="bnav-msg-badge"></span></button>
      <button class="bnav-btn" onclick="openMoreMenu()"><span class="bnav-icon">···</span><span class="bnav-label">More</span></button>
    </div>
  </div>
  <div id="more-menu-overlay" onclick="closeMoreMenu()"></div>
  <div id="more-menu-panel">
    <div class="more-menu-handle"></div><div class="more-menu-title">More</div>
    <button class="more-menu-item mmi-blue" onclick="closeMoreMenu();switchTab('customers')"><div class="more-menu-icon">◯</div><div style="flex:1"><div class="more-menu-item-label">Customers</div><div class="more-menu-item-desc">View &amp; manage customers</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-orange" onclick="closeMoreMenu();switchTab('reviews')"><div class="more-menu-icon">★</div><div style="flex:1"><div class="more-menu-item-label">Reviews</div><div class="more-menu-item-desc">Moderate product reviews</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-green" onclick="closeMoreMenu();switchTab('newsletter')"><div class="more-menu-icon">◎</div><div style="flex:1"><div class="more-menu-item-label">Newsletter</div><div class="more-menu-item-desc">Subscriber management</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-purple" id="vendors-more-item" onclick="closeMoreMenu();switchTab('vendors')" style="display:none;"><div class="more-menu-icon">⬡</div><div style="flex:1"><div class="more-menu-item-label">Vendors</div><div class="more-menu-item-desc">Manage brand partners</div></div><span class="more-menu-arrow">›</span></button>
    <button class="more-menu-item mmi-gray" id="btn-seed-more" onclick="closeMoreMenu();seedDefaultData()" style="display:none;"><div class="more-menu-icon">⬆</div><div style="flex:1"><div class="more-menu-item-label">Seed Data</div><div class="more-menu-item-desc">Load default vendors + products</div></div><span class="more-menu-arrow">›</span></button>
    <div class="more-divider"></div>
    <button class="more-menu-item mmi-red" onclick="closeMoreMenu();handleLogout()"><div class="more-menu-icon">⏏</div><div style="flex:1"><div class="more-menu-item-label">Sign Out</div><div class="more-menu-item-desc" id="admin-email-more">—</div></div></button>
  </div>
</div>

<div id="modal-container"></div>
<div id="panel-container"></div>
<div id="toast-container"></div>

<script>
function togglePw(){
  var i=document.getElementById('login-password'),b=document.querySelector('.pw-toggle');
  if(i.type==='password'){i.type='text';b.textContent='HIDE';}else{i.type='password';b.textContent='SHOW';}
}
function openMoreMenu(){document.getElementById('more-menu-overlay').classList.add('open');document.getElementById('more-menu-panel').classList.add('open');}
function closeMoreMenu(){document.getElementById('more-menu-overlay').classList.remove('open');document.getElementById('more-menu-panel').classList.remove('open');}
</script>

<script>
fetch('/api/cloudinary-config')
  .then(function(res) { return res.json(); })
  .then(function(config) {
    window.CLOUDINARY_CLOUD_NAME = config.cloudName;
    window.CLOUDINARY_UPLOAD_PRESET = config.uploadPreset;
  })
  .catch(function(err) {
    console.error('Cloudinary config failed to load', err);
  });
</script>

<script src="admin.js"></script>

<script src="admin-dashboard.js"></script>
<script src="admin-products.js"></script>
<script src="admin-orders.js"></script>
<script src="admin-customers.js"></script>
<script src="admin-reviews.js"></script>
<script src="admin-newsletter.js"></script>
<script src="admin-inbox.js"></script>
<script src="admin-vendors.js"></script>
</body>
</html>
