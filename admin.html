<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>JANEDORE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --card: #fff;
      --border: #e5e5e5;
      --text: #111;
      --muted: #888;
      --accent: #111;
      --danger: #c00;
      --success: #0a0;
      --ui-font-size: 9px;
      --ui-letter-spacing: 0.2em;
      --ui-font-weight: 400;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-weight: 300;
    }
    .admin-header {
      background: var(--card);
      border-bottom: 0.5px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }
    .admin-header h1 {
      font-family: 'Manrope', sans-serif;
      font-size: var(--ui-font-size);
      text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .admin-grid { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 57px); }
    .sidebar { background: var(--card); border-right: 0.5px solid var(--border); padding: 16px; }
    .sidebar-btn {
      display: block; width: 100%; padding: 10px 12px; margin-bottom: 2px; border: none;
      background: transparent; text-align: left; cursor: pointer;
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); transition: all 0.2s;
    }
    .sidebar-btn:hover, .sidebar-btn.active { background: #f5f5f5; color: var(--text); }
    .sidebar-divider { border: 0; border-top: 0.5px solid var(--border); margin: 10px 0; }
    .main-content { padding: 20px 16px; overflow-y: auto; }
    .section-title {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-bottom: 16px;
    }
    .card { background: var(--card); border: 0.5px solid var(--border); padding: 16px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      font-weight: var(--ui-font-weight); text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
    }
    .product-list { display: flex; flex-direction: column; gap: 6px; }
    .product-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: #fafaf9; border: 0.5px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .product-row:hover { border-color: var(--text); }
    .product-row .pi-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 400; }
    .product-row .pi-meta {
      font-size: var(--ui-font-size); color: var(--muted); text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
    }
    .badge { font-size: 8px; padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.14em; display: inline-block; }
    .badge-active { background: #e8f5e9; color: var(--success); }
    .badge-draft { background: #fff3e0; color: #e65100; }
    .btn {
      padding: 8px 14px; border: 0.8px solid var(--border); background: var(--card);
      cursor: pointer; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); transition: all 0.2s; color: var(--text);
    }
    .btn:hover { border-color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 8px; }
    .btn-underline {
      background: none; border: none; border-bottom: 0.8px solid var(--text);
      padding: 6px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--text); cursor: pointer; transition: all 0.2s;
    }
    .btn-underline:hover { color: var(--muted); border-color: var(--muted); }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 12px; border: 0.5px solid var(--border);
      font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300;
      outline: none; transition: border 0.2s; background: #fafaf9; color: var(--text);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--text); background: #fff; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .variant-block { background: #fafaf9; padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
    .variant-block h4 {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); margin-bottom: 10px;
    }
    .image-url-inputs { display: flex; flex-direction: column; gap: 6px; }
    .image-url-row { display: flex; gap: 6px; align-items: center; }
    .image-url-row input { flex: 1; }
    .image-preview { width: 48px; height: 48px; object-fit: cover; border: 0.5px solid var(--border); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card); width: 100%; max-width: 700px; max-height: 85vh;
      overflow-y: auto; padding: 24px; position: relative;
    }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
    .modal-close:hover { color: var(--text); }
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 0;
      color: #fff; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; z-index: 300;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 0.5px solid var(--border); padding: 14px; text-align: center; }
    .stat-number { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }
    .stat-label {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-top: 4px;
    }
    .chat-sessions-list { display: flex; flex-direction: column; gap: 6px; }
    .chat-session-card {
      background: #fafaf9; border: 0.5px solid var(--border); padding: 12px 14px;
      cursor: pointer; transition: all 0.2s;
    }
    .chat-session-card:hover { border-color: var(--text); }
    .chat-session-card .session-id {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--muted);
    }
    .chat-session-card .session-preview { font-size: 12px; font-weight: 300; color: var(--text); margin-top: 4px; }
    .chat-messages-panel { max-height: 400px; overflow-y: auto; margin-top: 12px; }
    .chat-msg-admin { padding: 10px 14px; margin-bottom: 8px; font-size: 12px; font-weight: 300; line-height: 1.5; }
    .chat-msg-admin.customer-msg { background: #111; color: #fff; }
    .chat-msg-admin .msg-meta {
      font-size: 8px; opacity: 0.5; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .reply-box { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
    .reply-box input {
      flex: 1; border: none; border-bottom: 0.5px solid #ccc; padding: 8px 0;
      font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300;
      outline: none; background: transparent;
    }
    .reply-box input:focus { border-color: var(--text); }
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fafaf9; }
    .login-box { background: #fff; padding: 40px 32px; width: 100%; max-width: 380px; border: 0.5px solid var(--border); }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; text-align: center; margin-bottom: 8px; }
    .login-subtitle {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size); text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      color: var(--muted); text-align: center; margin-bottom: 28px;
    }
    .login-error { color: var(--danger); font-size: 10px; text-align: center; margin-bottom: 12px; display: none; }
    .logout-btn {
      background: none; border: none; border-bottom: 0.8px solid var(--danger);
      padding: 6px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--danger); cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { opacity: 0.7; }
    @media (max-width: 768px) {
      .admin-grid { grid-template-columns: 1fr; }
      .sidebar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-right: none; border-bottom: 0.5px solid var(--border); overflow-x: auto; }
      .sidebar-btn { padding: 8px 10px; margin-bottom: 0; white-space: nowrap; font-size: 8px; }
      .sidebar-divider { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; }
      .modal { padding: 16px; max-width: 100%; }
      .product-row { flex-direction: column; align-items: flex-start; gap: 6px; }
      .login-box { margin: 16px; }
    }
  </style>
</head>
<body>

<div id="login-screen" class="login-container" style="display:none;">
  <div class="login-box">
    <div class="login-title">JANEDORE</div>
    <div class="login-subtitle">Admin Panel</div>
    <div class="login-error" id="login-error">Invalid email or password</div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required placeholder="admin@janedore.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required placeholder="••••••••"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In</button>
    </form>
  </div>
</div>

<div id="admin-panel" style="display:none;">
  <div class="admin-header">
    <h1><span class="status-dot online" id="status-dot"></span>JANEDORE Admin</h1>
    <div class="header-actions">
      <span style="font-size:var(--ui-font-size);color:var(--muted);" id="admin-email"></span>
      <span style="font-size:var(--ui-font-size);color:var(--muted);" id="product-count">0 products</span>
      <button class="btn-underline" onclick="openNewProductModal()">+ New Product</button>
      <button class="btn-underline" onclick="seedDefaultProducts()">Seed Default</button>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>
  <div class="admin-grid">
    <div class="sidebar">
      <button class="sidebar-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="sidebar-btn" onclick="switchTab('products')">Products</button>
      <button class="sidebar-btn" onclick="switchTab('messages')">Messages</button>
      <button class="sidebar-btn" onclick="switchTab('reviews')">Reviews</button>
      <button class="sidebar-btn" onclick="switchTab('newsletter')">Newsletter</button>
      <button class="sidebar-btn" onclick="switchTab('orders')">Orders</button>
      <hr class="sidebar-divider">
      <button class="sidebar-btn" onclick="window.open('index.html','_blank')">🏪 View Store</button>
    </div>
    <div class="main-content" id="main-content"></div>
  </div>
</div>

<div id="modal-container"></div>
<div id="toast-container"></div>

  firebase.initializeApp(firebaseConfig);
  const db = firebase.firestore();
  const auth = firebase.auth();
  const productsRef = db.collection('products');
  const reviewsRef = db.collection('reviews');
  const newsletterRef = db.collection('newsletter');
  const ordersRef = db.collection('orders');
  const chatRef = db.collection('live_chat');

  let currentTab = 'dashboard';
  let allProducts = [];

  auth.onAuthStateChanged(async (user) => {
    if (user) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('admin-panel').style.display = 'block';
      document.getElementById('admin-email').textContent = user.email;
      await loadProducts();
    } else {
      document.getElementById('login-screen').style.display = 'flex';
      document.getElementById('admin-panel').style.display = 'none';
    }
  });

  async function handleLogin(e) {
    e.preventDefault();
    const email = document.getElementById('login-email').value;
    const password = document.getElementById('login-password').value;
    const errorEl = document.getElementById('login-error');
    try {
      errorEl.style.display = 'none';
      await auth.signInWithEmailAndPassword(email, password);
    } catch (error) {
      errorEl.textContent = error.message;
      errorEl.style.display = 'block';
    }
  }

  async function handleLogout() { await auth.signOut(); }

  function showToast(msg, type = 'success') {
    const toast = document.createElement('div');
    toast.className = `toast toast-${type}`;
    toast.textContent = msg;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(() => toast.remove(), 3000);
  }

  async function loadProducts() {
    try {
      const snapshot = await productsRef.get();
      allProducts = snapshot.docs.map(d => ({ id: d.id, ...d.data() }));
      document.getElementById('product-count').textContent = `${allProducts.length} products`;
      document.getElementById('status-dot').className = 'status-dot online';
    } catch (e) {
      document.getElementById('status-dot').className = 'status-dot offline';
      showToast('Firebase connection failed: ' + e.message, 'error');
    }
    renderCurrentTab();
  }

  async function saveProduct(productData) {
    try {
      if (productData.id) {
        await productsRef.doc(productData.id).set(productData, { merge: true });
      } else {
        productData.id = productData.sku || ('prod-' + Date.now());
        await productsRef.doc(productData.id).set(productData);
      }
      showToast('Product saved! ✅');
      loadProducts();
      closeModal();
    } catch (e) { showToast('Error saving: ' + e.message, 'error'); }
  }

  async function deleteProduct(productId) {
    if (!confirm('Delete this product?')) return;
    try { await productsRef.doc(productId).delete(); showToast('Product deleted'); loadProducts(); }
    catch (e) { showToast('Error deleting: ' + e.message, 'error'); }
  }

  async function seedDefaultProducts() {
    if (!confirm('Seed all 7 default products to Firebase?')) return;
    try {
      const batch = db.batch();
      DEFAULT_PRODUCTS.forEach(p => { const ref = productsRef.doc(p.id); batch.set(ref, p); });
      await batch.commit();
      showToast('7 products seeded!');
      loadProducts();
    } catch (e) { showToast('Error seeding: ' + e.message, 'error'); }

  // ==================== CHAT (FIXED - no index needed) ====================

  async function sendAdminReply(sessionId) {
    const input = document.getElementById(`reply-input-${sessionId}`);
    const text = input?.value?.trim();
    if (!text) return;
    try {
      await chatRef.add({
        sessionId: sessionId, text: text, sender: 'admin',
        createdAt: firebase.firestore.FieldValue.serverTimestamp(), read: false
      });
      input.value = '';
      loadChatMessages(sessionId);
    } catch (e) { showToast('Error sending reply: ' + e.message, 'error'); }
  }

  async function loadChatMessages(sessionId) {
    try {
      const snapshot = await chatRef.where('sessionId', '==', sessionId).get();
      const messages = [];
      snapshot.docs.forEach(d => messages.push(d.data()));
      // Sort in JavaScript instead of orderBy (avoids composite index)
      messages.sort((a, b) => (a.createdAt?.seconds || 0) - (b.createdAt?.seconds || 0));
      
      const mc = document.getElementById('main-content');
      const msgHTML = messages.map(m => {
        const time = m.createdAt ? new Date(m.createdAt.seconds * 1000).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}) : '';
        return `<div class="chat-msg-admin ${m.sender === 'customer' ? 'customer-msg' : ''}" style="${m.sender === 'customer' ? '' : 'border:0.5px solid var(--border);'}">
          <div>${m.text}</div>
          <div class="msg-meta">${m.sender} · ${time}</div>
        </div>`;
      }).join('');
      
      mc.innerHTML = `
        <button class="btn-underline" onclick="switchTab('messages')" style="margin-bottom:12px;">← Back to Sessions</button>
        <div class="section-title">Chat Session: ${sessionId}</div>
        <div class="chat-messages-panel">${msgHTML || '<p style="font-size:12px;color:var(--muted);">No messages yet.</p>'}</div>
        <div class="reply-box">
          <input id="reply-input-${sessionId}" placeholder="Type your reply..." onkeypress="if(event.key==='Enter')sendAdminReply('${sessionId}')">
          <button class="btn-underline" onclick="sendAdminReply('${sessionId}')">Send</button>
        </div>`;
    } catch (e) { showToast('Error loading messages: ' + e.message, 'error'); }
  }

  async function renderMessagesTab() {
    const mc = document.getElementById('main-content');
    try {
      const snapshot = await chatRef.get();
      const sessions = {};
      snapshot.docs.forEach(d => {
        const data = d.data();
        if (!sessions[data.sessionId]) sessions[data.sessionId] = { messages: [], lastTime: null };
        sessions[data.sessionId].messages.push(data);
        if (data.createdAt && (!sessions[data.sessionId].lastTime || data.createdAt.seconds > sessions[data.sessionId].lastTime.seconds)) {
          sessions[data.sessionId].lastTime = data.createdAt;
        }
      });
      const sessionIds = Object.keys(sessions).sort((a, b) => (sessions[b].lastTime?.seconds || 0) - (sessions[a].lastTime?.seconds || 0));

      mc.innerHTML = `<div class="section-title">Customer Messages (${sessionIds.length} sessions)</div>
        <div class="chat-sessions-list">
          ${sessionIds.length === 0 ? '<p style="font-size:12px;color:var(--muted);">No messages yet.</p>' : ''}
          ${sessionIds.map(sid => {
            const msgs = sessions[sid].messages;
            const lastMsg = msgs[msgs.length - 1];
            const preview = (lastMsg?.text || '').substring(0, 80);
            const time = lastMsg?.createdAt ? new Date(lastMsg.createdAt.seconds * 1000).toLocaleDateString() : '';
            const customerMsgs = msgs.filter(m => m.sender === 'customer');
            return `<div class="chat-session-card" onclick="loadChatMessages('${sid}')">
              <div class="session-id">Session: ${sid.substring(0, 20)}... · ${customerMsgs.length} messages</div>
              <div class="session-preview">${preview}${preview.length >= 80 ? '…' : ''}</div>
              <div style="font-size:8px;color:var(--muted);margin-top:4px;">${time}</div>
            </div>`;
          }).join('')}
        </div>`;
    } catch (e) { mc.innerHTML = `<p style="color:var(--danger);">Error loading messages: ${e.message}</p>`; }
  }

              <div class="form-group"><label>Category</label><select name="category"><option value="dresses" ${p.category=='dresses'?'selected':''}>Dresses</option><option value="tops" ${p.category=='tops'?'selected':''}>Tops</option><option value="bottoms" ${p.category=='bottoms'?'selected':''}>Bottoms</option><option value="jackets" ${p.category=='jackets'?'selected':''}>Jackets</option><option value="sets" ${p.category=='sets'?'selected':''}>Sets</option><option value="sunglasses" ${p.category=='sunglasses'?'selected':''}>Sunglasses</option><option value="jewelry" ${p.category=='jewelry'?'selected':''}>Jewelry</option><option value="bags" ${p.category=='bags'?'selected':''}>Bags</option><option value="parfum" ${p.category=='parfum'?'selected':''}>Parfum</option></select></div>
              <div class="form-group"><label>Status</label><select name="status"><option value="active" ${p.status=='active'?'selected':''}>Active</option><option value="draft" ${p.status=='draft'?'selected':''}>Draft</option></select></div>
            </div>
            <div class="form-row-3">
              <div class="form-group"><label>Price (R)</label><input name="price" type="number" value="${p.price}" required></div>
              <div class="form-group"><label>Sale Price</label><input name="salePrice" type="number" value="${p.salePrice||''}"></div>
              <div class="form-group"><label>Stock</label><input name="stock" type="number" value="${p.stock}"></div>
            </div>
            <div class="form-row-3">
              <div class="form-group"><label>Badge</label><select name="badge"><option value="">None</option><option value="new" ${p.badge=='new'?'selected':''}>New</option><option value="sale" ${p.badge=='sale'?'selected':''}>Sale</option><option value="sold" ${p.badge=='sold'?'selected':''}>Sold Out</option></select></div>
              <div class="form-group"><label>Sizes (comma separated)</label><input name="sizes" value="${(p.sizes||[]).join(',')}"></div>
              <div class="form-group"><label>Featured</label><select name="featured"><option value="false" ${!p.featured?'selected':''}>No</option><option value="true" ${p.featured?'selected':''}>Yes</option></select></div>
            </div>
            <div class="form-group"><label>Description</label><textarea name="description">${escapeHtml(p.description||'')}</textarea></div>
            <div class="form-row">
              <div class="form-group"><label>Product Features</label><textarea name="productFeatures">${escapeHtml(p.productFeatures||'')}</textarea></div>
              <div class="form-group"><label>Composition & Care</label><textarea name="compositionCare">${escapeHtml(p.compositionCare||'')}</textarea></div>
            </div>
            <div class="form-group"><label>Shipping & Returns</label><input name="shippingReturns" value="${escapeHtml(p.shippingReturns||'')}"></div>
            <h3 style="font-family:'Manrope',sans-serif;font-size:var(--ui-font-size);text-transform:uppercase;letter-spacing:var(--ui-letter-spacing);font-weight:var(--ui-font-weight);margin:20px 0 12px;">Variants</h3>
            <div id="variants-container">${(p.variants||[]).map((v, i) => buildVariantBlock(v, i)).join('')}</div>
            <button type="button" class="btn-underline" onclick="addVariant()" style="margin-top:8px;">+ Add Variant</button>
            <div style="margin-top:24px;display:flex;gap:12px;">
              <button type="submit" class="btn-underline">Save Product</button>
              ${p.id ? `<button type="button" class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">Delete</button>` : ''}
            </div>
          </form>
        </div>
      </div>`;
    document.getElementById('modal-container').innerHTML = html;
  }

  function buildVariantBlock(v = {}, index) {
    return `<div class="chat-session-card" onclick="loadChatMessages('${sid}')">
  <div class="session-id">Session: ${sid.substring(0, 20)}... · ${customerMsgs.length} messages</div>
  <div class="session-preview">${preview}${preview.length >= 80 ? '…' : ''}</div>
  <div style="font-size:8px;color:var(--muted);margin-top:4px;">${time}</div>
</div>`;
  }

  function buildImageUrlRow(type, variantIndex, url) {
    return `<div class="image-url-row">
      <input name="variant-${type}-${variantIndex}[]" value="${escapeHtml(url||'')}" placeholder="https://...">
      <img class="image-preview" src="${url || 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect fill=%22%23f0ede8%22 width=%2248%22 height=%2248%22/></svg>'}" onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect fill=%22%23f0ede8%22 width=%2248%22 height=%2248%22/></svg>'">
    </div>`;
  }

  function addVariant() { const c = document.getElementById('variants-container'); c.insertAdjacentHTML('beforeend', buildVariantBlock({}, c.children.length)); }
  function addImageUrl(type, vi) { document.getElementById(`variant-${type}-${vi}`).insertAdjacentHTML('beforeend', buildImageUrlRow(type, vi, '')); }

  function handleProductSubmit(e, existingId) {
    e.preventDefault();
    const form = e.target;
    const data = {
      id: existingId || form.sku.value || ('prod-' + Date.now()),
      sku: form.sku.value, name: form.name.value, brand: form.brand.value,
      category: form.category.value, price: parseFloat(form.price.value),
      salePrice: form.salePrice.value ? parseFloat(form.salePrice.value) : null,
      badge: form.badge.value || null,
      sizes: form.sizes.value.split(',').map(s => s.trim()).filter(Boolean),
      stock: parseInt(form.stock.value), status: form.status.value,
      featured: form.featured.value === 'true', description: form.description.value,
      productFeatures: form.productFeatures.value, compositionCare: form.compositionCare.value,
      shippingReturns: form.shippingReturns.value,
      createdAt: existingId ? (allProducts.find(p => p.id === existingId)?.createdAt || new Date().toISOString()) : new Date().toISOString(),
      updatedAt: new Date().toISOString(), variants: []
    };
    let vi = 0;
    while (form[`variant-color-${vi}`]) {
      const mI = form.querySelectorAll(`[name="variant-model-${vi}[]"]`);
      const gI = form.querySelectorAll(`[name="variant-ghost-${vi}[]"]`);
      const dI = form.querySelectorAll(`[name="variant-detail-${vi}[]"]`);
      data.variants.push({
        color: form[`variant-color-${vi}`].value,
        swatch: form[`variant-swatch-${vi}`].value,
        images: { model: Array.from(mI).map(i => i.value).filter(Boolean), ghost: Array.from(gI).map(i => i.value).filter(Boolean), detail: Array.from(dI).map(i => i.value).filter(Boolean) }
      });
      vi++;
    }
    saveProduct(data);
  }

  function closeModal() { document.getElementById('modal-container').innerHTML = ''; }
  function escapeHtml(str) { return (str||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  function switchTab(tab) {
    currentTab = tab;
    document.querySelectorAll('.sidebar-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`[onclick="switchTab('${tab}')"]`)?.classList.add('active');
    renderCurrentTab();
  }

  async function renderCurrentTab() {
    const mc = document.getElementById('main-content');
    switch (currentTab) {
      case 'dashboard':
        const [pS, rS, nS, oS] = await Promise.all([productsRef.get(), reviewsRef.get(), newsletterRef.get(), ordersRef.get()]);
        mc.innerHTML = `<div class="stats-grid">
          <div class="stat-card"><div class="stat-number">${pS.size}</div><div class="stat-label">Products</div></div>
          <div class="stat-card"><div class="stat-number">${rS.size}</div><div class="stat-label">Reviews</div></div>
          <div class="stat-card"><div class="stat-number">${nS.size}</div><div class="stat-label">Subscribers</div></div>
          <div class="stat-card"><div class="stat-number">${oS.size}</div><div class="stat-label">Orders</div></div>
        </div>
        <div class="card"><div class="card-title">Firebase Status</div><p style="margin-top:8px;color:var(--success);font-size:12px;">✅ Connected</p></div>`;
        break;
      case 'products':
        mc.innerHTML = `<div class="section-title">All Products (${allProducts.length})</div>
          <div class="product-list">${allProducts.map(p => `<div class="product-row" onclick="openProductModal(${JSON.stringify(p).replace(/"/g,'&quot;')})">
            <div><div class="pi-name">${escapeHtml(p.name)}</div><div class="pi-meta">${p.brand} · ${p.category} · R${p.price}</div></div>
            <span class="badge badge-${p.status==='active'?'active':'draft'}">${p.status}</span>
          </div>`).join('')}</div>`;
        break;
      case 'messages': await renderMessagesTab(); break;
      case 'reviews':
        const revs = await reviewsRef.orderBy('createdAt','desc').limit(50).get();
        mc.innerHTML = `<div class="section-title">Recent Reviews</div>${revs.docs.map(d => `<div class="card"><div class="card-header"><span>${'★'.repeat(d.data().rating||0)}</span><span style="font-size:var(--ui-font-size);color:var(--muted);">${d.data().name||'Anonymous'}</span></div><p style="font-size:12px;">${d.data().text||''}</p></div>`).join('')}`;
        break;
      case 'newsletter':
        const subs = await newsletterRef.orderBy('subscribedAt','desc').limit(50).get();
        mc.innerHTML = `<div class="section-title">Newsletter (${subs.size})</div>${subs.docs.map(d => `<div class="card"><span style="font-size:12px;">${d.data().email}</span></div>`).join('')}`;
        break;
      case 'orders':
        const ords = await ordersRef.orderBy('createdAt','desc').limit(50).get();
        mc.innerHTML = `<div class="section-title">Orders (${ords.size})</div>${ords.docs.map(d => `<div class="card"><div class="card-header"><span style="font-size:var(--ui-font-size);">Order</span><span class="badge badge-active">${d.data().status||'pending'}</span></div><p style="font-size:12px;">${d.data().itemCount||0} items · R${d.data().subtotal||0}</p></div>`).join('')}`;
        break;
    }
  }
