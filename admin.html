<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>JANEDORE Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    /* ── DESIGN TOKENS ───────────────────────────────────────── */
    :root {
      --bg:        #fafaf9;
      --card:      #ffffff;
      --border:    #e5e5e5;
      --border-2:  #d0d0d0;
      --text:      #111111;
      --muted:     #888888;
      --muted-2:   #bbbbbb;
      --accent:    #111111;
      --danger:    #b91c1c;
      --success:   #15803d;
      --warning:   #b45309;
      --info:      #1d4ed8;
      --sidebar-w: 220px;
      --header-h:  52px;
      --ui-fs:     9px;
      --ui-ls:     0.18em;
      --ui-fw:     400;
    }

    /* ── RESET ───────────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Manrope', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-weight: 300;
      font-size: 13px;
    }

    /* ── SCROLLBARS ──────────────────────────────────────────── */
    ::-webkit-scrollbar { width: 4px; height: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-2); }
    ::-webkit-scrollbar-thumb:hover { background: var(--muted); }

    /* ── TYPOGRAPHY UTILITIES ────────────────────────────────── */
    .ui-label {
      font-family: 'Manrope', sans-serif;
      font-size: var(--ui-fs);
      text-transform: uppercase;
      letter-spacing: var(--ui-ls);
      font-weight: var(--ui-fw);
      color: var(--muted);
    }
    .serif { font-family: 'Cormorant Garamond', serif; font-weight: 300; }

    /* ── LOGIN ───────────────────────────────────────────────── */
    .login-container {
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; background: var(--bg);
    }
    .login-box {
      background: var(--card); padding: 48px 40px;
      width: 100%; max-width: 400px; border: 0.5px solid var(--border);
    }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 36px; font-weight: 300; text-align: center; letter-spacing: 0.12em; margin-bottom: 6px; }
    .login-subtitle { text-align: center; margin-bottom: 32px; }
    .login-role-badge { display: inline-block; padding: 3px 10px; background: #111; color: #fff; font-size: 8px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 20px; }
    .login-error { color: var(--danger); font-size: 10px; text-align: center; margin-bottom: 12px; display: none; }

    /* ── HEADER ──────────────────────────────────────────────── */
    .admin-header {
      background: var(--card); border-bottom: 0.5px solid var(--border);
      padding: 0 20px; height: var(--header-h);
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 100; gap: 12px; flex-wrap: wrap;
    }
    .header-brand { display: flex; align-items: center; gap: 10px; }
    .header-brand h1 { font-family: 'Manrope', sans-serif; font-size: var(--ui-fs); text-transform: uppercase; letter-spacing: var(--ui-ls); font-weight: var(--ui-fw); }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; flex-shrink: 0; }
    .status-dot.online  { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    .header-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
    .role-badge {
      padding: 3px 8px; font-size: 8px; letter-spacing: 0.15em; text-transform: uppercase;
      background: var(--text); color: #fff; font-family: 'Manrope', sans-serif;
    }
    .role-badge.vendor-badge { background: #6b21a8; }

    /* ── LAYOUT ──────────────────────────────────────────────── */
    .admin-grid {
      display: grid;
      grid-template-columns: var(--sidebar-w) 1fr;
      min-height: calc(100vh - var(--header-h));
    }

    /* ── SIDEBAR ─────────────────────────────────────────────── */
    .sidebar {
      background: var(--card); border-right: 0.5px solid var(--border);
      padding: 16px 0; position: sticky; top: var(--header-h);
      height: calc(100vh - var(--header-h)); overflow-y: auto;
    }
    .sidebar-section-label {
      padding: 10px 16px 4px; font-family: 'Manrope', sans-serif;
      font-size: 8px; text-transform: uppercase; letter-spacing: 0.2em;
      color: var(--muted-2); font-weight: 400;
    }
    .sidebar-btn {
      display: flex; align-items: center; width: 100%; padding: 9px 16px;
      border: none; background: transparent; text-align: left; cursor: pointer;
      font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      text-transform: uppercase; letter-spacing: var(--ui-ls);
      font-weight: var(--ui-fw); color: var(--muted); transition: all 0.15s;
      position: relative; gap: 8px; white-space: nowrap;
    }
    .sidebar-btn:hover  { background: #f5f5f4; color: var(--text); }
    .sidebar-btn.active { background: #f0ede8; color: var(--text); }
    .sidebar-btn.active::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: var(--text);
    }
    .sidebar-icon { font-size: 11px; opacity: 0.7; width: 14px; text-align: center; flex-shrink: 0; }
    .unread-badge {
      margin-left: auto; background: var(--danger); color: #fff;
      font-size: 7px; padding: 2px 5px; letter-spacing: 0; display: none;
    }
    .sidebar-divider { border: 0; border-top: 0.5px solid var(--border); margin: 8px 0; }

    /* ── MAIN CONTENT ────────────────────────────────────────── */
    .main-content { padding: 24px 20px; overflow-y: auto; background: var(--bg); }

    /* ── SECTION HEADER ──────────────────────────────────────── */
    .section-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
    }
    .section-title {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      text-transform: uppercase; letter-spacing: var(--ui-ls);
      font-weight: var(--ui-fw); color: var(--muted);
    }
    .section-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

    /* ── STATS GRID ──────────────────────────────────────────── */
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 24px; }
    .stats-grid-6 { grid-template-columns: repeat(6, 1fr); }
    .stat-card {
      background: var(--card); border: 0.5px solid var(--border);
      padding: 16px 14px; position: relative; overflow: hidden;
    }
    .stat-card::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 2px; background: transparent; transition: background 0.2s;
    }
    .stat-card:hover::after { background: var(--border-2); }
    .stat-number { font-family: 'Cormorant Garamond', serif; font-size: 30px; font-weight: 300; line-height: 1; margin-bottom: 6px; }
    .stat-number.sm { font-size: 22px; }
    .stat-label  { font-size: 8px; text-transform: uppercase; letter-spacing: 0.16em; color: var(--muted); font-weight: 400; }
    .stat-delta  { font-size: 8px; margin-top: 4px; }
    .stat-delta.up   { color: var(--success); }
    .stat-delta.down { color: var(--danger); }

    /* ── CARDS ───────────────────────────────────────────────── */
    .card { background: var(--card); border: 0.5px solid var(--border); padding: 18px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
    .card-title { font-family: 'Manrope', sans-serif; font-size: var(--ui-fs); font-weight: var(--ui-fw); text-transform: uppercase; letter-spacing: var(--ui-ls); }

    /* ── TABLES ──────────────────────────────────────────────── */
    .data-table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .data-table th {
      text-align: left; padding: 8px 12px;
      font-size: 8px; text-transform: uppercase; letter-spacing: 0.15em;
      font-weight: 500; color: var(--muted); border-bottom: 0.5px solid var(--border);
      white-space: nowrap; background: var(--card);
      position: sticky; top: 0; z-index: 1;
    }
    .data-table td {
      padding: 11px 12px; border-bottom: 0.5px solid var(--border);
      vertical-align: middle; font-weight: 300;
    }
    .data-table tr:last-child td { border-bottom: none; }
    .data-table tbody tr { transition: background 0.1s; cursor: pointer; }
    .data-table tbody tr:hover { background: #fafaf8; }
    .data-table .cell-serif { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 400; }
    .data-table .cell-muted { color: var(--muted); font-size: 11px; }
    .table-wrap { overflow-x: auto; border: 0.5px solid var(--border); background: var(--card); }

    /* ── BADGES ──────────────────────────────────────────────── */
    .badge { font-size: 8px; padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.12em; display: inline-flex; align-items: center; gap: 4px; font-weight: 500; white-space: nowrap; }
    .badge-active     { background: #dcfce7; color: #166534; }
    .badge-draft      { background: #fff7ed; color: #9a3412; }
    .badge-pending    { background: #fef9c3; color: #713f12; }
    .badge-paid       { background: #dcfce7; color: #166534; }
    .badge-processing { background: #dbeafe; color: #1e3a8a; }
    .badge-packed     { background: #ede9fe; color: #4c1d95; }
    .badge-shipped    { background: #ccfbf1; color: #134e4a; }
    .badge-delivered  { background: #dcfce7; color: #166534; }
    .badge-cancelled  { background: #fee2e2; color: #991b1b; }
    .badge-refunded   { background: #fce7f3; color: #9d174d; }
    .badge-unread     { background: #fee2e2; color: #991b1b; }
    .badge-super      { background: #111; color: #fff; }
    .badge-vendor     { background: #ede9fe; color: #4c1d95; }

    /* ── BUTTONS ─────────────────────────────────────────────── */
    .btn {
      padding: 8px 14px; border: 0.8px solid var(--border); background: var(--card);
      cursor: pointer; font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      text-transform: uppercase; letter-spacing: var(--ui-ls); font-weight: var(--ui-fw);
      transition: all 0.15s; color: var(--text); white-space: nowrap; display: inline-flex; align-items: center; gap: 5px;
    }
    .btn:hover { border-color: var(--text); }
    .btn:active { transform: translateY(1px); }
    .btn-primary  { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-danger   { color: var(--danger); border-color: #fca5a5; }
    .btn-danger:hover   { background: var(--danger); color: #fff; border-color: var(--danger); }
    .btn-success  { color: var(--success); border-color: #86efac; }
    .btn-success:hover  { background: var(--success); color: #fff; border-color: var(--success); }
    .btn-ghost    { border-color: transparent; }
    .btn-ghost:hover    { border-color: var(--border); background: #f5f5f4; }
    .btn-sm { padding: 5px 10px; font-size: 8px; }
    .btn-xs { padding: 3px 7px; font-size: 7px; }
    .btn-underline {
      background: none; border: none; border-bottom: 0.8px solid var(--text);
      padding: 5px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      letter-spacing: var(--ui-ls); font-weight: var(--ui-fw);
      text-transform: uppercase; color: var(--text); cursor: pointer; transition: all 0.15s;
    }
    .btn-underline:hover { color: var(--muted); border-color: var(--muted); }
    .btn-underline.danger { color: var(--danger); border-color: var(--danger); }
    .btn-icon { padding: 6px 8px; font-size: 12px; line-height: 1; }

    /* ── TOOLBAR ─────────────────────────────────────────────── */
    .toolbar {
      display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
      padding: 12px 0; margin-bottom: 16px;
      border-bottom: 0.5px solid var(--border);
      position: sticky; top: 0; background: var(--bg); z-index: 5;
    }
    .toolbar-spacer { flex: 1; }

    /* ── SEARCH ──────────────────────────────────────────────── */
    .search-input {
      padding: 7px 12px; border: 0.5px solid var(--border);
      font-family: 'Manrope', sans-serif; font-size: 11px; font-weight: 300;
      outline: none; transition: border 0.15s; background: var(--card);
      color: var(--text); min-width: 200px;
    }
    .search-input:focus { border-color: var(--text); }
    .search-input::placeholder { color: var(--muted-2); }

    /* ── SELECT / FILTER ─────────────────────────────────────── */
    .filter-select {
      padding: 7px 12px; border: 0.5px solid var(--border);
      font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      text-transform: uppercase; letter-spacing: var(--ui-ls);
      outline: none; background: var(--card); color: var(--text); cursor: pointer;
      transition: border 0.15s;
    }
    .filter-select:focus { border-color: var(--text); }

    /* ── FORMS ───────────────────────────────────────────────── */
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      text-transform: uppercase; letter-spacing: var(--ui-ls); font-weight: var(--ui-fw);
      color: var(--muted); margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 9px 12px; border: 0.5px solid var(--border);
      font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300;
      outline: none; transition: border 0.15s; background: #fafaf9; color: var(--text);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--text); background: #fff; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row   { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .form-row-4 { display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; gap: 14px; }

    /* ── VARIANTS / IMAGES ───────────────────────────────────── */
    .variant-block { background: #fafaf9; padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
    .variant-block h4 { font-family: 'Manrope', sans-serif; font-size: var(--ui-fs); text-transform: uppercase; letter-spacing: var(--ui-ls); font-weight: var(--ui-fw); margin-bottom: 10px; }
    .image-url-inputs { display: flex; flex-direction: column; gap: 6px; }
    .image-url-row { display: flex; gap: 6px; align-items: center; }
    .image-url-row input { flex: 1; }
    .image-preview { width: 48px; height: 48px; object-fit: cover; border: 0.5px solid var(--border); flex-shrink: 0; }

    /* ── MODAL ───────────────────────────────────────────────── */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.45); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 16px;
      animation: fadeIn 0.15s ease;
    }
    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    .modal {
      background: var(--card); width: 100%; max-width: 720px; max-height: 90vh;
      overflow-y: auto; padding: 28px; position: relative;
      animation: slideUp 0.18s ease;
    }
    @keyframes slideUp { from { transform: translateY(12px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
    .modal-lg { max-width: 900px; }
    .modal-sm { max-width: 480px; }
    .modal-close { position: absolute; top: 14px; right: 14px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--muted); padding: 4px; }
    .modal-close:hover { color: var(--text); }
    .modal-title { font-family: 'Manrope', sans-serif; font-size: var(--ui-fs); text-transform: uppercase; letter-spacing: var(--ui-ls); font-weight: var(--ui-fw); margin-bottom: 24px; }

    /* ── SLIDE PANEL ─────────────────────────────────────────── */
    .slide-panel-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 190; animation: fadeIn 0.15s;
    }
    .slide-panel {
      position: fixed; right: 0; top: 0; bottom: 0; width: 440px; max-width: 100vw;
      background: var(--card); border-left: 0.5px solid var(--border);
      z-index: 191; overflow-y: auto; padding: 24px;
      animation: slideIn 0.2s ease;
    }
    @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
    .slide-panel-close { position: absolute; top: 14px; right: 16px; background: none; border: none; font-size: 16px; cursor: pointer; color: var(--muted); }

    /* ── PRODUCT ROW ─────────────────────────────────────────── */
    .product-list { display: flex; flex-direction: column; gap: 1px; }
    .product-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: var(--card); border: 0.5px solid var(--border);
      cursor: pointer; transition: all 0.15s; gap: 12px;
    }
    .product-row:hover { border-color: var(--border-2); background: #fafaf8; }
    .product-row .pi-name { font-family: 'Cormorant Garamond', serif; font-size: 16px; font-weight: 400; }
    .product-row .pi-meta { font-size: 10px; color: var(--muted); margin-top: 2px; }
    .product-row .pi-actions { display: flex; gap: 4px; opacity: 0; transition: opacity 0.15s; flex-shrink: 0; }
    .product-row:hover .pi-actions { opacity: 1; }

    /* ── CHAT ────────────────────────────────────────────────── */
    .chat-sessions-list { display: flex; flex-direction: column; gap: 4px; }
    .chat-session-card {
      background: var(--card); border: 0.5px solid var(--border); padding: 12px 14px;
      cursor: pointer; transition: all 0.15s; position: relative;
    }
    .chat-session-card:hover { border-color: var(--border-2); background: #fafaf8; }
    .chat-session-card.unread { border-left: 2px solid var(--danger); }
    .chat-session-card.pinned { border-left: 2px solid var(--info); }
    .chat-session-card .session-id { font-size: var(--ui-fs); letter-spacing: var(--ui-ls); text-transform: uppercase; color: var(--muted); }
    .chat-session-card .session-preview { font-size: 12px; font-weight: 300; color: var(--text); margin-top: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 380px; }
    .session-meta { display: flex; align-items: center; gap: 8px; margin-top: 6px; }
    .chat-messages-panel { max-height: 380px; overflow-y: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; padding-right: 4px; }
    .chat-msg-admin { padding: 10px 14px; font-size: 12px; font-weight: 300; line-height: 1.5; max-width: 78%; }
    .chat-msg-admin.customer-msg { background: #111; color: #fff; align-self: flex-start; }
    .chat-msg-admin.admin-msg    { background: #f5f5f4; border: 0.5px solid var(--border); align-self: flex-end; }
    .chat-msg-admin .msg-meta    { font-size: 8px; opacity: 0.5; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.1em; }
    .typing-indicator { font-size: 9px; color: var(--muted); font-style: italic; padding: 4px 14px; text-transform: uppercase; letter-spacing: 0.1em; display: none; }
    .reply-box { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); align-items: flex-start; }
    .reply-box input { flex: 1; border: none; border-bottom: 0.5px solid var(--border); padding: 8px 0; font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300; outline: none; background: transparent; }
    .reply-box input:focus { border-color: var(--text); }
    .quick-replies { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .quick-reply-btn { padding: 4px 10px; border: 0.5px solid var(--border); background: var(--card); font-family: 'Manrope', sans-serif; font-size: 9px; cursor: pointer; transition: all 0.15s; font-weight: 300; }
    .quick-reply-btn:hover { border-color: var(--text); background: #fafaf9; }

    /* ── CUSTOMER INFO PANEL ─────────────────────────────────── */
    .info-panel { background: #fafaf9; border: 0.5px solid var(--border); padding: 14px; margin-top: 12px; }
    .info-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 0.5px solid var(--border); font-size: 11px; }
    .info-row:last-child { border-bottom: none; }
    .info-row .label { color: var(--muted); font-size: 9px; text-transform: uppercase; letter-spacing: 0.12em; }

    /* ── ORDER STATUS TIMELINE ───────────────────────────────── */
    .order-timeline { display: flex; flex-direction: column; gap: 0; }
    .timeline-item { display: flex; gap: 12px; padding: 10px 0; position: relative; }
    .timeline-item::before { content: ''; position: absolute; left: 8px; top: 22px; bottom: -10px; width: 1px; background: var(--border); }
    .timeline-item:last-child::before { display: none; }
    .timeline-dot { width: 18px; height: 18px; border-radius: 50%; border: 2px solid var(--border); background: var(--card); flex-shrink: 0; margin-top: 2px; }
    .timeline-dot.active { border-color: var(--text); background: var(--text); }
    .timeline-dot.done   { border-color: var(--success); background: var(--success); }
    .timeline-content { flex: 1; }
    .timeline-label  { font-size: 11px; font-weight: 400; }
    .timeline-time   { font-size: 9px; color: var(--muted); margin-top: 2px; }

    /* ── ANALYTICS CHART PLACEHOLDER ────────────────────────── */
    .chart-wrap { position: relative; width: 100%; }
    .chart-canvas { width: 100% !important; max-height: 180px; }

    /* ── TOAST ───────────────────────────────────────────────── */
    #toast-container { position: fixed; bottom: 20px; right: 20px; z-index: 400; display: flex; flex-direction: column; gap: 6px; }
    .toast {
      padding: 10px 18px; color: #fff; font-family: 'Manrope', sans-serif;
      font-size: var(--ui-fs); letter-spacing: var(--ui-ls); font-weight: var(--ui-fw);
      text-transform: uppercase; animation: slideToast 0.2s ease;
    }
    @keyframes slideToast { from { transform: translateX(80px); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
    .toast-success { background: var(--success); }
    .toast-error   { background: var(--danger); }
    .toast-info    { background: var(--info); }

    /* ── EMPTY STATE ─────────────────────────────────────────── */
    .empty-state { text-align: center; padding: 60px 20px; }
    .empty-state-icon { font-size: 28px; margin-bottom: 12px; opacity: 0.3; }
    .empty-state-text { font-size: 12px; color: var(--muted); }

    /* ── UTILITY ─────────────────────────────────────────────── */
    .flex  { display: flex; }
    .flex-col { flex-direction: column; }
    .items-center { align-items: center; }
    .justify-between { justify-content: space-between; }
    .gap-2 { gap: 8px; }
    .gap-3 { gap: 12px; }
    .mt-2 { margin-top: 8px; }
    .mt-3 { margin-top: 12px; }
    .mt-4 { margin-top: 16px; }
    .mb-2 { margin-bottom: 8px; }
    .mb-3 { margin-bottom: 12px; }
    .text-danger  { color: var(--danger); }
    .text-success { color: var(--success); }
    .text-muted   { color: var(--muted); }
    .text-sm      { font-size: 11px; }
    .text-xs      { font-size: 9px; }
    .fw-400       { font-weight: 400; }
    .hidden { display: none !important; }
    .divider { border: 0; border-top: 0.5px solid var(--border); margin: 16px 0; }

    /* ── VENDOR PERMISSIONS NOTICE ───────────────────────────── */
    .vendor-scope-bar {
      background: #f5f0ff; border: 0.5px solid #c4b5fd; padding: 8px 14px;
      margin-bottom: 20px; display: flex; align-items: center; gap: 8px;
      font-size: 10px; color: #4c1d95;
    }

    /* ── LOGOUT ──────────────────────────────────────────────── */
    .logout-btn {
      background: none; border: none; border-bottom: 0.8px solid var(--danger);
      padding: 5px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-fs);
      letter-spacing: var(--ui-ls); font-weight: var(--ui-fw);
      text-transform: uppercase; color: var(--danger); cursor: pointer; transition: all 0.15s;
    }
    .logout-btn:hover { opacity: 0.7; }

    /* ── RESPONSIVE ──────────────────────────────────────────── */
    @media (max-width: 900px) {
      .stats-grid   { grid-template-columns: repeat(2, 1fr); }
      .stats-grid-6 { grid-template-columns: repeat(3, 1fr); }
    }
    @media (max-width: 768px) {
      :root { --sidebar-w: 0px; }
      .admin-grid { grid-template-columns: 1fr; }
      .sidebar {
        display: flex; flex-wrap: nowrap; gap: 0; padding: 0;
        border-right: none; border-bottom: 0.5px solid var(--border);
        height: auto; position: sticky; top: var(--header-h);
        overflow-x: auto; overflow-y: hidden; z-index: 99;
      }
      .sidebar-section-label { display: none; }
      .sidebar-divider { display: none; }
      .sidebar-btn { padding: 10px 12px; white-space: nowrap; font-size: 8px; flex-shrink: 0; }
      .sidebar-btn.active::before { top: auto; left: 0; right: 0; bottom: 0; width: auto; height: 2px; }
      .sidebar-icon { display: none; }
      .unread-badge { position: relative; top: auto; right: auto; margin-left: 4px; }
      .form-row, .form-row-3, .form-row-4 { grid-template-columns: 1fr; }
      .stats-grid   { grid-template-columns: repeat(2, 1fr); }
      .stats-grid-6 { grid-template-columns: repeat(2, 1fr); }
      .main-content { padding: 16px 12px; }
      .modal { padding: 16px; max-width: 100%; }
      .slide-panel { width: 100%; border-left: none; border-top: 0.5px solid var(--border); top: auto; height: 80vh; animation: slideUp 0.2s ease; }
      .admin-header { height: auto; padding: 10px 14px; }
      .data-table { font-size: 11px; }
      .chat-session-card .session-preview { max-width: 200px; }
      .product-row .pi-actions { opacity: 1; }
    }
    @media (max-width: 480px) {
      .stats-grid, .stats-grid-6 { grid-template-columns: 1fr 1fr; }
      .section-header { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>

<!-- ── LOGIN SCREEN ──────────────────────────────────────────── -->
<div id="login-screen" class="login-container" style="display:none;">
  <div class="login-box">
    <div class="login-title">JANEDORE</div>
    <div class="login-subtitle ui-label">Admin · Studio</div>
    <div class="login-error" id="login-error">Invalid credentials</div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required placeholder="admin@janedore.com" autocomplete="email"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required placeholder="••••••••" autocomplete="current-password"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:10px;padding:11px;">Sign In</button>
    </form>
  </div>
</div>

<!-- ── ADMIN PANEL ────────────────────────────────────────────── -->
<div id="admin-panel" style="display:none;">

  <!-- Header -->
  <div class="admin-header">
    <div class="header-brand">
      <span class="status-dot online" id="status-dot"></span>
      <h1>JANEDORE Studio</h1>
      <span id="admin-role-badge" class="role-badge badge-super" style="display:none;"></span>
    </div>
    <div class="header-actions">
      <span class="ui-label" id="admin-email" style="color:var(--muted);"></span>
      <span class="ui-label" id="product-count" style="color:var(--muted);"></span>
      <button class="btn-underline" onclick="openNewProductModal()" id="btn-new-product">+ Product</button>
      <button class="btn-underline" onclick="seedDefaultProducts()" id="btn-seed" style="display:none;">Seed</button>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>

  <!-- Grid: sidebar + main -->
  <div class="admin-grid">

    <!-- Sidebar -->
    <div class="sidebar" id="admin-sidebar">
      <div class="sidebar-section-label">Overview</div>
      <button class="sidebar-btn active" onclick="switchTab('dashboard')" data-tab="dashboard">
        <span class="sidebar-icon">◈</span>Dashboard
      </button>

      <div class="sidebar-section-label">Commerce</div>
      <button class="sidebar-btn" onclick="switchTab('products')" data-tab="products">
        <span class="sidebar-icon">◻</span>Products
      </button>
      <button class="sidebar-btn" onclick="switchTab('orders')" data-tab="orders">
        <span class="sidebar-icon">◫</span>Orders
        <span class="unread-badge" id="orders-badge" style="display:none;"></span>
      </button>
      <button class="sidebar-btn" onclick="switchTab('customers')" data-tab="customers">
        <span class="sidebar-icon">◯</span>Customers
      </button>

      <div class="sidebar-section-label">Content</div>
      <button class="sidebar-btn" onclick="switchTab('reviews')" data-tab="reviews">
        <span class="sidebar-icon">★</span>Reviews
      </button>
      <button class="sidebar-btn" onclick="switchTab('newsletter')" data-tab="newsletter">
        <span class="sidebar-icon">◉</span>Newsletter
      </button>

      <div class="sidebar-section-label">Support</div>
      <button class="sidebar-btn" onclick="switchTab('messages')" data-tab="messages" id="messages-tab-btn">
        <span class="sidebar-icon">◌</span>Messages
        <span class="unread-badge" id="messages-unread-badge">0</span>
      </button>

      <div class="sidebar-section-label" id="vendor-section-label">Marketplace</div>
      <button class="sidebar-btn" onclick="switchTab('vendors')" data-tab="vendors" id="vendors-tab-btn">
        <span class="sidebar-icon">⬡</span>Vendors
      </button>

      <hr class="sidebar-divider">
      <button class="sidebar-btn" onclick="window.open('index.html','_blank')">
        <span class="sidebar-icon">↗</span>View Store
      </button>
    </div>

    <!-- Main Content -->
    <div class="main-content" id="main-content"></div>
  </div>
</div>

<!-- ── CONTAINERS ─────────────────────────────────────────────── -->
<div id="modal-container"></div>
<div id="panel-container"></div>
<div id="toast-container"></div>

<!-- ── FIREBASE SDK ───────────────────────────────────────────── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
<!-- Chart.js for analytics -->
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>

<!-- ── APP SCRIPT ─────────────────────────────────────────────── -->
<script src="admin.js"></script>

</body>
</html>
