<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
  <title>JANEDORE Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Manrope:wght@300;400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #fff;
      --card: #fff;
      --border: #e5e5e5;
      --text: #111;
      --muted: #888;
      --accent: #111;
      --danger: #c00;
      --success: #0a0;
      --ui-font-size: 9px;
      --ui-letter-spacing: 0.2em;
      --ui-font-weight: 400;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Manrope', -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      font-weight: 300;
    }
    .admin-header {
      background: var(--card);
      border-bottom: 0.5px solid var(--border);
      padding: 14px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 100;
      flex-wrap: wrap;
      gap: 8px;
    }
    .admin-header h1 {
      font-family: 'Manrope', sans-serif;
      font-size: var(--ui-font-size);
      text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight);
    }
    .status-dot { width: 6px; height: 6px; border-radius: 50%; display: inline-block; margin-right: 6px; }
    .status-dot.online { background: var(--success); }
    .status-dot.offline { background: var(--danger); }
    .header-actions { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
    .admin-grid { display: grid; grid-template-columns: 220px 1fr; min-height: calc(100vh - 57px); }
    .sidebar { background: var(--card); border-right: 0.5px solid var(--border); padding: 16px; }
    .sidebar-btn {
      display: block; width: 100%; padding: 10px 12px; margin-bottom: 2px; border: none;
      background: transparent; text-align: left; cursor: pointer;
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); transition: all 0.2s;
      position: relative;
    }
    .sidebar-btn:hover, .sidebar-btn.active { background: #f5f5f5; color: var(--text); }
    .sidebar-btn .unread-badge {
      position: absolute; top: 6px; right: 8px; background: var(--danger); color: #fff;
      font-size: 7px; padding: 2px 5px; border-radius: 0; display: none;
    }
    .sidebar-divider { border: 0; border-top: 0.5px solid var(--border); margin: 10px 0; }
    .main-content { padding: 20px 16px; overflow-y: auto; }
    .section-title {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-bottom: 16px;
    }
    .card { background: var(--card); border: 0.5px solid var(--border); padding: 16px; margin-bottom: 12px; }
    .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .card-title {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      font-weight: var(--ui-font-weight); text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
    }
    .product-list { display: flex; flex-direction: column; gap: 6px; }
    .product-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 12px 14px; background: #fafaf9; border: 0.5px solid var(--border);
      cursor: pointer; transition: all 0.2s;
    }
    .product-row:hover { border-color: var(--text); }
    .product-row .pi-name { font-family: 'Cormorant Garamond', serif; font-size: 15px; font-weight: 400; }
    .product-row .pi-meta {
      font-size: var(--ui-font-size); color: var(--muted); text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
    }
    .badge { font-size: 8px; padding: 3px 8px; text-transform: uppercase; letter-spacing: 0.14em; display: inline-block; }
    .badge-active { background: #e8f5e9; color: var(--success); }
    .badge-draft { background: #fff3e0; color: #e65100; }
    .badge-unread { background: #ffebee; color: var(--danger); }
    .btn {
      padding: 8px 14px; border: 0.8px solid var(--border); background: var(--card);
      cursor: pointer; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); transition: all 0.2s; color: var(--text);
    }
    .btn:hover { border-color: var(--text); }
    .btn-primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn-primary:hover { background: #333; border-color: #333; }
    .btn-danger { color: var(--danger); border-color: var(--danger); }
    .btn-danger:hover { background: var(--danger); color: #fff; }
    .btn-sm { padding: 5px 10px; font-size: 8px; }
    .btn-underline {
      background: none; border: none; border-bottom: 0.8px solid var(--text);
      padding: 6px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--text); cursor: pointer; transition: all 0.2s;
    }
    .btn-underline:hover { color: var(--muted); border-color: var(--muted); }
    .form-group { margin-bottom: 14px; }
    .form-group label {
      display: block; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-bottom: 6px;
    }
    .form-group input, .form-group textarea, .form-group select {
      width: 100%; padding: 10px 12px; border: 0.5px solid var(--border);
      font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300;
      outline: none; transition: border 0.2s; background: #fafaf9; color: var(--text);
    }
    .form-group input:focus, .form-group textarea:focus, .form-group select:focus { border-color: var(--text); background: #fff; }
    .form-group textarea { min-height: 80px; resize: vertical; }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 14px; }
    .variant-block { background: #fafaf9; padding: 14px; margin-bottom: 10px; border: 0.5px solid var(--border); }
    .variant-block h4 {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); margin-bottom: 10px;
    }
    .image-url-inputs { display: flex; flex-direction: column; gap: 6px; }
    .image-url-row { display: flex; gap: 6px; align-items: center; }
    .image-url-row input { flex: 1; }
    .image-preview { width: 48px; height: 48px; object-fit: cover; border: 0.5px solid var(--border); }
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 200;
      display: flex; align-items: center; justify-content: center; padding: 16px;
    }
    .modal {
      background: var(--card); width: 100%; max-width: 700px; max-height: 85vh;
      overflow-y: auto; padding: 24px; position: relative;
    }
    .modal-close { position: absolute; top: 12px; right: 12px; background: none; border: none; font-size: 18px; cursor: pointer; color: var(--muted); }
    .modal-close:hover { color: var(--text); }
    .toast {
      position: fixed; bottom: 20px; right: 20px; padding: 10px 16px; border-radius: 0;
      color: #fff; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; z-index: 300;
    }
    .toast-success { background: var(--success); }
    .toast-error { background: var(--danger); }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 20px; }
    .stat-card { background: var(--card); border: 0.5px solid var(--border); padding: 14px; text-align: center; }
    .stat-number { font-family: 'Cormorant Garamond', serif; font-size: 28px; font-weight: 300; }
    .stat-label {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      text-transform: uppercase; letter-spacing: var(--ui-letter-spacing);
      font-weight: var(--ui-font-weight); color: var(--muted); margin-top: 4px;
    }
    .chat-sessions-list { display: flex; flex-direction: column; gap: 6px; }
    .chat-session-card {
      background: #fafaf9; border: 0.5px solid var(--border); padding: 12px 14px;
      cursor: pointer; transition: all 0.2s; position: relative;
    }
    .chat-session-card:hover { border-color: var(--text); }
    .chat-session-card.unread { border-left: 2px solid var(--danger); }
    .chat-session-card .session-id {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--muted);
    }
    .chat-session-card .session-preview { font-size: 12px; font-weight: 300; color: var(--text); margin-top: 4px; }
    .chat-session-card .unread-count {
      position: absolute; top: 8px; right: 8px; background: var(--danger); color: #fff;
      font-size: 7px; padding: 2px 5px; border-radius: 0; display: none;
    }
    .chat-messages-panel { max-height: 350px; overflow-y: auto; margin-top: 12px; display: flex; flex-direction: column; gap: 8px; }
    .chat-msg-admin { padding: 10px 14px; font-size: 12px; font-weight: 300; line-height: 1.5; max-width: 80%; }
    .chat-msg-admin.customer-msg { background: #111; color: #fff; align-self: flex-start; }
    .chat-msg-admin.admin-msg { background: #f5f5f5; border: 0.5px solid var(--border); align-self: flex-end; }
    .chat-msg-admin .msg-meta {
      font-size: 8px; opacity: 0.5; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .typing-indicator {
      font-size: 9px; color: var(--muted); font-style: italic; padding: 4px 14px;
      text-transform: uppercase; letter-spacing: 0.1em; display: none;
    }
    .reply-box { display: flex; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 0.5px solid var(--border); }
    .reply-box input {
      flex: 1; border: none; border-bottom: 0.5px solid #ccc; padding: 8px 0;
      font-family: 'Manrope', sans-serif; font-size: 12px; font-weight: 300;
      outline: none; background: transparent;
    }
    .reply-box input:focus { border-color: var(--text); }
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: #fafaf9; }
    .login-box { background: #fff; padding: 40px 32px; width: 100%; max-width: 380px; border: 0.5px solid var(--border); }
    .login-title { font-family: 'Cormorant Garamond', serif; font-size: 32px; font-weight: 300; text-align: center; margin-bottom: 8px; }
    .login-subtitle {
      font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size); text-transform: uppercase;
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      color: var(--muted); text-align: center; margin-bottom: 28px;
    }
    .login-error { color: var(--danger); font-size: 10px; text-align: center; margin-bottom: 12px; display: none; }
    .logout-btn {
      background: none; border: none; border-bottom: 0.8px solid var(--danger);
      padding: 6px 2px; font-family: 'Manrope', sans-serif; font-size: var(--ui-font-size);
      letter-spacing: var(--ui-letter-spacing); font-weight: var(--ui-font-weight);
      text-transform: uppercase; color: var(--danger); cursor: pointer; transition: all 0.2s;
    }
    .logout-btn:hover { opacity: 0.7; }
    @media (max-width: 768px) {
      .admin-grid { grid-template-columns: 1fr; }
      .sidebar { display: flex; flex-wrap: wrap; gap: 4px; padding: 8px; border-right: none; border-bottom: 0.5px solid var(--border); overflow-x: auto; }
      .sidebar-btn { padding: 8px 10px; margin-bottom: 0; white-space: nowrap; font-size: 8px; }
      .sidebar-divider { display: none; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .form-row, .form-row-3 { grid-template-columns: 1fr; }
      .admin-header { flex-direction: column; align-items: flex-start; }
      .header-actions { width: 100%; }
      .modal { padding: 16px; max-width: 100%; }
      .product-row { flex-direction: column; align-items: flex-start; gap: 6px; }
      .login-box { margin: 16px; }
      .chat-msg-admin { max-width: 90%; }
    }
  </style>
</head>
<body>

<!-- ── Login Screen ─────────────────────────────────────────────── -->
<div id="login-screen" class="login-container" style="display:none;">
  <div class="login-box">
    <div class="login-title">JANEDORE</div>
    <div class="login-subtitle">Admin Panel</div>
    <div class="login-error" id="login-error">Invalid email or password</div>
    <form onsubmit="handleLogin(event)">
      <div class="form-group"><label>Email</label><input type="email" id="login-email" required placeholder="admin@janedore.com"></div>
      <div class="form-group"><label>Password</label><input type="password" id="login-password" required placeholder="••••••••"></div>
      <button type="submit" class="btn btn-primary" style="width:100%;margin-top:8px;">Sign In</button>
    </form>
  </div>
</div>

<!-- ── Admin Panel ──────────────────────────────────────────────── -->
<div id="admin-panel" style="display:none;">
  <div class="admin-header">
    <h1><span class="status-dot online" id="status-dot"></span>JANEDORE Admin</h1>
    <div class="header-actions">
      <span style="font-size:var(--ui-font-size);color:var(--muted);" id="admin-email"></span>
      <span style="font-size:var(--ui-font-size);color:var(--muted);" id="product-count">0 products</span>
      <button class="btn-underline" onclick="openNewProductModal()">+ New Product</button>
      <button class="btn-underline" onclick="seedDefaultProducts()">Seed Default</button>
      <button class="logout-btn" onclick="handleLogout()">Logout</button>
    </div>
  </div>
  <div class="admin-grid">
    <div class="sidebar">
      <button class="sidebar-btn active" onclick="switchTab('dashboard')">Dashboard</button>
      <button class="sidebar-btn" onclick="switchTab('products')">Products</button>
      <button class="sidebar-btn" id="messages-tab-btn" onclick="switchTab('messages')">
        Messages <span class="unread-badge" id="messages-unread-badge">0</span>
      </button>
      <button class="sidebar-btn" onclick="switchTab('reviews')">Reviews</button>
      <button class="sidebar-btn" onclick="switchTab('newsletter')">Newsletter</button>
      <button class="sidebar-btn" onclick="switchTab('orders')">Orders</button>
      <hr class="sidebar-divider">
      <button class="sidebar-btn" onclick="window.open('index.html','_blank')">View Store</button>
    </div>
    <div class="main-content" id="main-content"></div>
  </div>
</div>

<div id="modal-container"></div>
<div id="toast-container"></div>

<!-- ── Firebase SDKs (compat) — load in exact dependency order ──── -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<script>

  };

  if (!firebase.apps.length) {
    firebase.initializeApp(firebaseConfig);
  }

  var db           = firebase.firestore();
  var rtdb         = firebase.database();
  var auth         = firebase.auth();
  var productsRef  = db.collection('products');
  var reviewsRef   = db.collection('reviews');
  var newsletterRef= db.collection('newsletter');

  // ── App state ───────────────────────────────────────────────────
  var currentTab          = 'dashboard';

  // ── Helpers ─────────────────────────────────────────────────────
  function escapeHtml(str) {
    if (str === null || str === undefined) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function showToast(msg, type) {
    type = type || 'success';
    var toast = document.createElement('div');
    toast.className = 'toast toast-' + type;
    toast.textContent = msg;
    document.getElementById('toast-container').appendChild(toast);
    setTimeout(function () { if (toast.parentNode) toast.parentNode.removeChild(toast); }, 3000);
  }

  function safeEl(id) { return document.getElementById(id) || null; }

  // ── Auth ────────────────────────────────────────────────────────
  auth.onAuthStateChanged(function (user) {
    if (user) {
      safeEl('login-screen').style.display  = 'none';
      safeEl('admin-panel').style.display   = 'block';
      safeEl('admin-email').textContent     = user.email;
      loadProducts();
      startChatMonitoring();
    } else {
      safeEl('login-screen').style.display  = 'flex';
      safeEl('admin-panel').style.display   = 'none';
      stopChatMonitoring();
    }
  });

  window.handleLogin = function (e) {
    e.preventDefault();
    var email    = safeEl('login-email').value;
    var password = safeEl('login-password').value;
    var errorEl  = safeEl('login-error');
    errorEl.style.display = 'none';
    auth.signInWithEmailAndPassword(email, password).catch(function (err) {
      errorEl.textContent   = err.message;
      errorEl.style.display = 'block';
    });
  };

  window.handleLogout = function () { auth.signOut(); };

  // ── Products ────────────────────────────────────────────────────
  function loadProducts() {
    productsRef.get().then(function (snapshot) {
      allProducts = snapshot.docs.map(function (d) { return Object.assign({ id: d.id }, d.data()); });
      safeEl('product-count').textContent = allProducts.length + ' products';
      safeEl('status-dot').className = 'status-dot online';
      renderCurrentTab();
    }).catch(function (e) {
      safeEl('status-dot').className = 'status-dot offline';
      showToast('Firebase connection failed: ' + e.message, 'error');
    });
  }

  function saveProduct(productData) {
    var ref = productData.id ? productsRef.doc(productData.id) : productsRef.doc(productData.sku || ('prod-' + Date.now()));

    ref.set(productData, { merge: true }).then(function () {
      showToast('Product saved!');
      loadProducts();
      closeModal();
    }).catch(function (e) { showToast('Error saving: ' + e.message, 'error'); });
  }

  window.deleteProduct = function (productId) {
    if (!confirm('Delete this product?')) return;
    productsRef.doc(productId).delete().then(function () {
      showToast('Product deleted');
      loadProducts();
      closeModal();
    }).catch(function (e) { showToast('Error deleting: ' + e.message, 'error'); });
  };

  // ── Default seed data ────────────────────────────────────────────
  var DEFAULT_PRODUCTS = [

  // ── Chat monitoring (unread badge) ───────────────────────────────
  function startChatMonitoring() {
    stopChatMonitoring(); // ensure clean state
    chatsMonitorRef = rtdb.ref('chats');
    chatsMonitorCallback = function (snapshot) {
      var unread = 0;
      snapshot.forEach(function (sessionSnap) {
        var messages = sessionSnap.child('messages');
        if (messages.exists()) {
          messages.forEach(function (msgSnap) {
            var msg = msgSnap.val();
            if (msg && msg.sender === 'customer' && msg.read === false) {
              unread++;
            }
          });
        }
      });
      totalUnreadMessages = unread;
      updateUnreadBadge();
    };
    chatsMonitorRef.on('value', chatsMonitorCallback, function (err) {
      console.warn('[ADMIN CHAT] monitor error:', err.message);
    });
  }

  function stopChatMonitoring() {
    if (chatsMonitorRef && chatsMonitorCallback) {
      chatsMonitorRef.off('value', chatsMonitorCallback);
      chatsMonitorRef     = null;
      chatsMonitorCallback= null;
    }
    detachActiveChatListeners();
  }

  function updateUnreadBadge() {
    var badge = safeEl('messages-unread-badge');
    if (badge) {
      badge.textContent    = totalUnreadMessages;
      badge.style.display  = totalUnreadMessages > 0 ? 'inline-block' : 'none';
    }
  }

  // ── Active chat session listeners ────────────────────────────────
  function detachActiveChatListeners() {
    if (chatMsgRef && chatMsgCallback) {
      chatMsgRef.off('value', chatMsgCallback);
      chatMsgRef = null; chatMsgCallback = null;
    }
    if (chatTypingRef && chatTypingCallback) {
      chatTypingRef.off('value', chatTypingCallback);
      chatTypingRef = null; chatTypingCallback = null;
    }
  }

  // ── Send admin reply ─────────────────────────────────────────────
  window.sendAdminReply = function (sessionId) {
    var input = safeEl('reply-input-' + sessionId);
    var text  = input && input.value && input.value.trim();
    if (!text || !sessionId) return;

    // Clear typing first
    rtdb.ref('chats/' + sessionId + '/typing').set({ admin: false }).catch(function () {});

    rtdb.ref('chats/' + sessionId + '/messages').push({
      text:      text,
      sender:    'admin',
      timestamp: firebase.database.ServerValue.TIMESTAMP,
      read:      true
    }).then(function () {
      if (input) input.value = '';
    }).catch(function (e) {
      showToast('Error sending reply: ' + e.message, 'error');
    });
  };

  function markSessionAsRead(sessionId) {
    rtdb.ref('chats/' + sessionId + '/messages').once('value').then(function (snap) {
      var updates = {};
      snap.forEach(function (child) {
        var msg = child.val();
        if (msg && msg.sender === 'customer' && msg.read === false) {
          updates[child.key + '/read'] = true;
        }
      });
      if (Object.keys(updates).length > 0) {
        rtdb.ref('chats/' + sessionId + '/messages').update(updates).catch(function (e) {
          console.warn('[ADMIN] mark-read error:', e.message);
        });
      }
    }).catch(function (e) { console.warn('[ADMIN] mark-read fetch error:', e.message); });
  }

  window.handleAdminTyping = function (sessionId) {
    rtdb.ref('chats/' + sessionId + '/typing').set({ admin: true }).catch(function () {});
    clearTimeout(window._adminTypingTimeout);
    window._adminTypingTimeout = setTimeout(function () {
      rtdb.ref('chats/' + sessionId + '/typing').set({ admin: false }).catch(function () {});
    }, 3000);
  };

  // ── Open individual chat session ─────────────────────────────────
  window.openChatSession = function (sessionId) {
    activeChatSession = sessionId;
    detachActiveChatListeners();
    markSessionAsRead(sessionId);

    var mc = safeEl('main-content');
    mc.innerHTML =
      '<button class="btn-underline" onclick="switchTab(\'messages\')" style="margin-bottom:12px;">Back to Sessions</button>' +
      '<div class="section-title">Chat: ' + escapeHtml(sessionId.substring(0, 30)) + '...</div>' +
      '<div class="chat-messages-panel" id="chat-messages-panel">' +
        '<div style="text-align:center;color:var(--muted);font-size:11px;padding:20px;">Loading messages...</div>' +
      '</div>' +
      '<div class="typing-indicator" id="typing-indicator">Customer is typing...</div>' +
      '<div class="reply-box">' +
        '<input id="reply-input-' + escapeHtml(sessionId) + '" placeholder="Type your reply..." ' +
          'onkeypress="if(event.key===\'Enter\')sendAdminReply(\'' + escapeHtml(sessionId) + '\')" ' +
          'oninput="handleAdminTyping(\'' + escapeHtml(sessionId) + '\')">' +
        '<button class="btn-underline" onclick="sendAdminReply(\'' + escapeHtml(sessionId) + '\')">Send</button>' +
      '</div>';

    // Attach messages listener
    chatMsgRef = rtdb.ref('chats/' + sessionId + '/messages');
    chatMsgCallback = function (snapshot) {
      var messages = [];
      snapshot.forEach(function (child) {
        messages.push(Object.assign({ _key: child.key }, child.val()));
      });
      messages.sort(function (a, b) { return (a.timestamp || 0) - (b.timestamp || 0); });
      renderChatMessages(messages);
    };
    chatMsgRef.on('value', chatMsgCallback, function (err) {
      console.warn('[ADMIN CHAT] message listener error:', err.message);
    });

    // Attach typing listener
    chatTypingRef = rtdb.ref('chats/' + sessionId + '/typing');
    chatTypingCallback = function (snapshot) {
      var data = snapshot.val();
      var indicator = safeEl('typing-indicator');
      if (indicator) {
        indicator.style.display = (data && data.customer) ? 'block' : 'none';
      }
    };
    chatTypingRef.on('value', chatTypingCallback, function (err) {
      console.warn('[ADMIN CHAT] typing listener error:', err.message);
    });
  };

  function renderChatMessages(messages) {
    var panel = safeEl('chat-messages-panel');
    if (!panel) return;
    var wasAtBottom = panel.scrollTop + panel.clientHeight >= panel.scrollHeight - 40;
    panel.innerHTML = '';

    if (!messages || messages.length === 0) {
      panel.innerHTML = '<div style="text-align:center;color:var(--muted);font-size:11px;padding:20px;">No messages yet.</div>';
      return;
    }

    messages.forEach(function (m) {
      var time = m.timestamp
        ? new Date(m.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })
        : '';
      var div = document.createElement('div');
      div.className = 'chat-msg-admin ' + (m.sender === 'customer' ? 'customer-msg' : 'admin-msg');
      div.innerHTML =
        '<div>' + escapeHtml(m.text) + '</div>' +
        '<div class="msg-meta">' + escapeHtml(m.sender || '') + ' · ' + time + '</div>';
      panel.appendChild(div);
    });

    if (wasAtBottom) panel.scrollTop = panel.scrollHeight;
  }

  // ── Messages tab ─────────────────────────────────────────────────
  function renderMessagesTab() {
    var mc = safeEl('main-content');
    activeChatSession = null;
    detachActiveChatListeners();

    mc.innerHTML = '<div class="section-title">Loading sessions...</div>';

    rtdb.ref('chats').once('value').then(function (snap) {
      var sessions = {};

      snap.forEach(function (sessionSnap) {
        var sessionId    = sessionSnap.key;
        var messagesSnap = sessionSnap.child('messages');
        if (!messagesSnap.exists()) return;

        sessions[sessionId] = { messages: [], lastTime: 0, unreadCount: 0 };

        messagesSnap.forEach(function (msgSnap) {
          var msg = msgSnap.val();
          if (!msg) return;
          sessions[sessionId].messages.push(msg);
          if (msg.timestamp > sessions[sessionId].lastTime) {
            sessions[sessionId].lastTime = msg.timestamp;
          }
          if (msg.sender === 'customer' && msg.read === false) {
            sessions[sessionId].unreadCount++;
          }
        });
      });

      var sessionIds = Object.keys(sessions).sort(function (a, b) {
        return (sessions[b].lastTime || 0) - (sessions[a].lastTime || 0);
      });

      var cardsHtml = sessionIds.map(function (sid) {
        var s       = sessions[sid];
        var msgs    = s.messages;
        var lastMsg = msgs[msgs.length - 1];
        var preview = ((lastMsg && lastMsg.text) || '').substring(0, 80);
        var time    = s.lastTime ? new Date(s.lastTime).toLocaleDateString() : '';
        return '<div class="chat-session-card ' + (s.unreadCount > 0 ? 'unread' : '') + '" onclick="openChatSession(\'' + escapeHtml(sid) + '\')">' +
          '<div class="session-id">' + escapeHtml(sid.substring(0, 25)) + '...</div>' +
          '<div class="session-preview">' + escapeHtml(preview) + (preview.length >= 80 ? '...' : '') + '</div>' +
          '<div style="font-size:8px;color:var(--muted);margin-top:4px;">' + msgs.length + ' messages · ' + time + '</div>' +
          (s.unreadCount > 0 ? '<div class="unread-count" style="display:inline-block;">' + s.unreadCount + ' new</div>' : '') +
          '</div>';
      }).join('');

      mc.innerHTML =
        '<div class="section-title">Customer Messages (' + sessionIds.length + ' sessions)</div>' +
        '<div class="chat-sessions-list">' +
          (sessionIds.length === 0
            ? '<p style="font-size:12px;color:var(--muted);">No messages yet.</p>'
            : cardsHtml) +
        '</div>';
    }).catch(function (e) {
      mc.innerHTML = '<p style="color:var(--danger);">Error loading messages: ' + escapeHtml(e.message) + '</p>';
    });
  }

      '<div class="form-group"><label>Model Images</label><div class="image-url-inputs" id="variant-model-' + index + '">' + modelRows + '</div><button type="button" class="btn-underline" onclick="addImageUrl(\'model\',' + index + ')" style="margin-top:6px;font-size:8px;">+ Add Model Image</button></div>' +
      '<div class="form-group"><label>Ghost / Flat Lay Images</label><div class="image-url-inputs" id="variant-ghost-' + index + '">' + ghostRows + '</div><button type="button" class="btn-underline" onclick="addImageUrl(\'ghost\',' + index + ')" style="margin-top:6px;font-size:8px;">+ Add Ghost Image</button></div>' +
      '<div class="form-group"><label>Detail Images</label><div class="image-url-inputs" id="variant-detail-' + index + '">' + detailRows + '</div><button type="button" class="btn-underline" onclick="addImageUrl(\'detail\',' + index + ')" style="margin-top:6px;font-size:8px;">+ Add Detail Image</button></div>' +
    '</div>';
  }

  function buildImageUrlRow(type, variantIndex, url) {
    var placeholder = 'data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2248%22 height=%2248%22><rect fill=%22%23f0ede8%22 width=%2248%22 height=%2248%22/></svg>';
    return '<div class="image-url-row">' +
      '<input name="variant-' + type + '-' + variantIndex + '[]" value="' + escapeHtml(url || '') + '" placeholder="https://..." oninput="this.nextElementSibling.src=this.value||\''+placeholder+'\'">' +
      '<img class="image-preview" src="' + (escapeHtml(url) || placeholder) + '" onerror="this.src=\'' + placeholder + '\'">' +
    '</div>';
  }

  window.addVariant = function () {
    var c = safeEl('variants-container');
    if (c) c.insertAdjacentHTML('beforeend', buildVariantBlock({}, c.children.length));
  };

  window.addImageUrl = function (type, vi) {
    var container = safeEl('variant-' + type + '-' + vi);
    if (container) container.insertAdjacentHTML('beforeend', buildImageUrlRow(type, vi, ''));
  };

  window.handleProductSubmit = function (e, existingId) {
    e.preventDefault();
    var form = e.target;
    var data = {
      id:               existingId || form.sku.value || ('prod-' + Date.now()),
      sku:              form.sku.value,
      name:             form.name.value,
      brand:            form.brand.value,
      category:         form.category.value,
      price:            parseFloat(form.price.value),
      salePrice:        form.salePrice.value ? parseFloat(form.salePrice.value) : null,
      badge:            form.badge.value || null,
      sizes:            form.sizes.value.split(',').map(function (s) { return s.trim(); }).filter(Boolean),
      stock:            parseInt(form.stock.value, 10),
      status:           form.status.value,
      featured:         form.featured.value === 'true',
      description:      form.description.value,
      productFeatures:  form.productFeatures.value,
      compositionCare:  form.compositionCare.value,
      shippingReturns:  form.shippingReturns.value,
      createdAt:        existingId
        ? ((allProducts.find(function (p) { return p.id === existingId; }) || {}).createdAt || new Date().toISOString())
        : new Date().toISOString(),
      updatedAt:        new Date().toISOString(),
      variants:         []
    };
    var vi = 0;
    while (form['variant-color-' + vi]) {
      var mI = form.querySelectorAll('[name="variant-model-' + vi + '[]"]');
      var gI = form.querySelectorAll('[name="variant-ghost-' + vi + '[]"]');
      var dI = form.querySelectorAll('[name="variant-detail-' + vi + '[]"]');
      data.variants.push({
        color: form['variant-color-' + vi].value,
        swatch: form['variant-swatch-' + vi].value,
        images: {
          model:  Array.from(mI).map(function (i) { return i.value; }).filter(Boolean),
          ghost:  Array.from(gI).map(function (i) { return i.value; }).filter(Boolean),
          detail: Array.from(dI).map(function (i) { return i.value; }).filter(Boolean)
        }
      });
      vi++;
    }
    saveProduct(data);
  };

  window.closeModal = function () {
    var mc = safeEl('modal-container');
    if (mc) mc.innerHTML = '';
  };

  // ── Tab switching ────────────────────────────────────────────────
  window.switchTab = function (tab) {
    currentTab = tab;
    if (tab !== 'messages') {
      activeChatSession = null;
      detachActiveChatListeners();
    }
    document.querySelectorAll('.sidebar-btn').forEach(function (b) { b.classList.remove('active'); });
    var activeBtn = document.querySelector('[onclick="switchTab(\'' + tab + '\')"]');
    if (activeBtn) activeBtn.classList.add('active');
    renderCurrentTab();
  };

  function renderCurrentTab() {
    var mc = safeEl('main-content');
    if (!mc) return;

    switch (currentTab) {
      case 'dashboard':
        Promise.all([productsRef.get(), reviewsRef.get(), newsletterRef.get(), ordersRef.get()])
          .then(function (results) {
            mc.innerHTML =
              '<div class="stats-grid">' +
                '<div class="stat-card"><div class="stat-number">' + results[0].size + '</div><div class="stat-label">Products</div></div>' +
                '<div class="stat-card"><div class="stat-number">' + results[1].size + '</div><div class="stat-label">Reviews</div></div>' +
                '<div class="stat-card"><div class="stat-number">' + results[2].size + '</div><div class="stat-label">Subscribers</div></div>' +
                '<div class="stat-card"><div class="stat-number">' + results[3].size + '</div><div class="stat-label">Orders</div></div>' +
              '</div>' +
              '<div class="card"><div class="card-title">Firebase Status</div><p style="margin-top:8px;color:var(--success);font-size:12px;">Connected — Firestore + Realtime DB</p></div>';
          }).catch(function (e) {
            mc.innerHTML = '<div class="card"><div class="card-title">Firebase Status</div><p style="margin-top:8px;color:var(--danger);font-size:12px;">Error: ' + escapeHtml(e.message) + '</p></div>';
          });
        break;

      case 'products':
        mc.innerHTML =
          '<div class="section-title">All Products (' + allProducts.length + ')</div>' +
          '<div class="product-list">' +
          allProducts.map(function (p) {
            return '<div class="product-row" onclick="openProductModal(' + escapeHtml(JSON.stringify(p)) + ')">' +
              '<div><div class="pi-name">' + escapeHtml(p.name) + '</div><div class="pi-meta">' + escapeHtml(p.brand) + ' · ' + escapeHtml(p.category) + ' · R' + escapeHtml(String(p.price)) + '</div></div>' +
              '<span class="badge badge-' + (p.status === 'active' ? 'active' : 'draft') + '">' + escapeHtml(p.status) + '</span>' +
            '</div>';
          }).join('') +
          '</div>';
        break;

      case 'messages':
        renderMessagesTab();
        break;

      case 'reviews':
        reviewsRef.orderBy('createdAt', 'desc').limit(50).get().then(function (revs) {
          mc.innerHTML =
            '<div class="section-title">Recent Reviews</div>' +
            (revs.empty
              ? '<p style="font-size:12px;color:var(--muted);">No reviews yet.</p>'
              : revs.docs.map(function (d) {
                  var data = d.data();
                  return '<div class="card"><div class="card-header"><span>' + '★'.repeat(data.rating || 0) + '</span><span style="font-size:var(--ui-font-size);color:var(--muted);">' + escapeHtml(data.name || 'Anonymous') + '</span></div><p style="font-size:12px;">' + escapeHtml(data.text || '') + '</p></div>';
                }).join(''));
        }).catch(function () {
          mc.innerHTML = '<div class="section-title">Recent Reviews</div><p style="font-size:12px;color:var(--muted);">No reviews yet.</p>';
        });
        break;

      case 'newsletter':
        newsletterRef.orderBy('subscribedAt', 'desc').limit(50).get().then(function (subs) {
          mc.innerHTML =
            '<div class="section-title">Newsletter (' + subs.size + ')</div>' +
            (subs.empty
              ? '<p style="font-size:12px;color:var(--muted);">No subscribers yet.</p>'
              : subs.docs.map(function (d) {
                  return '<div class="card"><span style="font-size:12px;">' + escapeHtml(d.data().email) + '</span></div>';
                }).join(''));
        }).catch(function () {
          mc.innerHTML = '<div class="section-title">Newsletter</div><p style="font-size:12px;color:var(--muted);">No subscribers yet.</p>';
        });
        break;

      case 'orders':
        ordersRef.orderBy('createdAt', 'desc').limit(50).get().then(function (ords) {
          mc.innerHTML =
            '<div class="section-title">Orders (' + ords.size + ')</div>' +
            (ords.empty
              ? '<p style="font-size:12px;color:var(--muted);">No orders yet.</p>'
              : ords.docs.map(function (d) {
                  var data = d.data();
                  return '<div class="card"><div class="card-header"><span style="font-size:var(--ui-font-size);">Order</span><span class="badge badge-active">' + escapeHtml(data.status || 'pending') + '</span></div><p style="font-size:12px;">' + escapeHtml(String(data.itemCount || 0)) + ' items · R' + escapeHtml(String(data.subtotal || 0)) + '</p></div>';
                }).join(''));
        }).catch(function () {
          mc.innerHTML = '<div class="section-title">Orders</div><p style="font-size:12px;color:var(--muted);">No orders yet.</p>';
        });
        break;
    }
  }

})(); // end IIFE
</script>
</body>
</html>
