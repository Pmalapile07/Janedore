<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="JANEDORE">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="manifest" href="/app-preview/manifest.webmanifest">
  <title>JANEDORE</title>
  <link id="logo-font-css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web" defer></script>
  <link rel="stylesheet" href="/app-preview/styles.css">
</head>
<body>
  <div class="app-shell">
    <header class="app-header" aria-label="JANEDORE">
      <div class="app-header-top">
        <span class="app-logo">JANEDORE</span>
        <button class="notification-button" type="button" aria-label="Notifications">
          <i class="ph ph-bell" aria-hidden="true"></i>
        </button>
      </div>
      <div class="app-search-row">
        <div class="app-search-field">
          <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
          <span>Search products or brands</span>
        </div>
      </div>
    </header>
    <nav class="bottom-nav" aria-label="Main navigation">
      <span class="nav-indicator" aria-hidden="true"></span>
      <button class="nav-item selected" data-tab="Home" aria-current="page" aria-label="Home">
        <svg class="home-mark" viewBox="0 0 2000 2000" role="img" aria-hidden="true">
          <path d="M1190 588 L930 1060 C860 1190 790 1258 710 1258 C640 1258 570 1220 523 1182"/>
          <circle cx="1156" cy="1230" r="140"/>
        </svg>
        <span class="nav-label">Home</span>
      </button>
      <button class="nav-item" data-tab="Discover" aria-label="Discover">
        <i class="ph ph-list" aria-hidden="true"></i>
        <span class="nav-label">Discover</span>
      </button>
      <button class="nav-item" data-tab="Wishlist" aria-label="Wishlist">
        <i class="ph ph-heart-straight" aria-hidden="true"></i>
        <span class="nav-label">Wishlist</span>
      </button>
      <button class="nav-item" data-tab="Cart" aria-label="Cart">
        <i class="ph ph-tote-simple" aria-hidden="true"></i>
        <span class="nav-label">Cart</span>
      </button>
      <button class="nav-item" data-tab="Account" aria-label="Account">
        <i class="ph ph-user" aria-hidden="true"></i>
        <span class="nav-label">Account</span>
      </button>
    </nav>
  </div>
  <script src="/app-preview/app.js"></script>
</body>
</html>
