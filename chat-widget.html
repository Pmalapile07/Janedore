<!-- CHAT WIDGET HTML/CSS - Add this to any page -->
<style>
  #live-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    width: 52px;
    height: 52px;
    border-radius: 0;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.25);
    transition: transform 0.3s, box-shadow 0.3s;
  }
  #live-chat-bubble:hover {
    transform: scale(1.08);
    box-shadow: 0 6px 28px rgba(0,0,0,0.35);
  }
  .chat-unread-dot {
    position: absolute;
    top: 4px;
    right: 4px;
    width: 12px;
    height: 12px;
    border-radius: 50%;
    background: #c00;
    display: none;
  }
  #chat-window {
    position: fixed;
    bottom: 90px;
    right: 24px;
    width: 360px;
    max-width: calc(100vw - 48px);
    height: 480px;
    max-height: calc(100vh - 130px);
    background: #fff;
    border: 1px solid #e5e5e5;
    box-shadow: 0 8px 40px rgba(0,0,0,0.15);
    z-index: 998;
    display: none;
    flex-direction: column;
  }
  #chat-window.open { display: flex; }
  .chat-header {
    background: #111;
    color: #fff;
    padding: 14px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    font-weight: 500;
  }
  .chat-header-close {
    background: none;
    border: none;
    color: #fff;
    cursor: pointer;
    font-size: 18px;
    padding: 0;
    line-height: 1;
    opacity: 0.7;
  }
  .chat-header-close:hover { opacity: 1; }
  .chat-options {
    display: flex;
    gap: 10px;
    padding: 16px;
    background: #fafaf9;
    flex-shrink: 0;
  }
  .chat-option-btn {
    flex: 1;
    background: #fff;
    color: #111;
    border: 1px solid #e5e5e5;
    padding: 12px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
  }
  .chat-option-btn:hover {
    background: #111;
    color: #fff;
    border-color: #111;
  }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: none;
    flex-direction: column;
    gap: 10px;
    background: #fafaf9;
  }
  .chat-msg {
    max-width: 80%;
    padding: 10px 14px;
    font-size: 12px;
    line-height: 1.5;
    animation: chatFadeIn 0.3s ease;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.customer {
    align-self: flex-end;
    background: #111;
    color: #fff;
  }
  .chat-msg.admin {
    align-self: flex-start;
    background: #fff;
    color: #111;
    border: 1px solid #e5e5e5;
  }
  .chat-msg-time {
    font-size: 8px;
    opacity: 0.5;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
  }
  .chat-input-wrap {
    display: none;
    border-top: 1px solid #e5e5e5;
    padding: 10px;
    gap: 8px;
    flex-shrink: 0;
  }
  .chat-input {
    flex: 1;
    border: 1px solid #e5e5e5;
    padding: 10px 14px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    outline: none;
  }
  .chat-input:focus { border-color: #111; }
  .chat-send-btn {
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 16px;
    cursor: pointer;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'Manrope', sans-serif;
    transition: background 0.2s;
  }
  .chat-send-btn:hover { background: #333; }
  .chat-welcome {
    text-align: center;
    padding: 20px;
    color: #888;
    font-size: 11px;
  }
  .chat-welcome strong {
    display: block;
    color: #111;
    font-size: 13px;
    margin-bottom: 6px;
  }
  .order-lookup {
    display: none;
    padding: 16px;
    background: #fafaf9;
    flex: 1;
    overflow-y: auto;
  }
  .order-lookup-title {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #111;
    margin-bottom: 16px;
    text-align: center;
    font-weight: 500;
  }
  .order-lookup-input {
    width: 100%;
    border: 1px solid #e5e5e5;
    padding: 10px 14px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    outline: none;
    margin-bottom: 12px;
  }
  .order-lookup-input:focus { border-color: #111; }
  .order-lookup-btn {
    width: 100%;
    background: #111;
    color: #fff;
    border: none;
    padding: 12px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    transition: background 0.2s;
  }
  .order-lookup-btn:hover { background: #333; }
  .order-result {
    margin-top: 16px;
    font-size: 12px;
    color: #555;
    text-align: center;
  }
  .back-to-chat-btn {
    background: none;
    border: 1px solid #e5e5e5;
    color: #111;
    padding: 10px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    cursor: pointer;
    width: 100%;
    margin-top: 12px;
    transition: all 0.2s;
  }
  .back-to-chat-btn:hover { background: #f5f5f5; }
  @media (max-width: 480px) {
    #chat-window {
      width: calc(100vw - 32px);
      right: 16px;
      left: 16px;
    }
    #live-chat-bubble {
      right: 16px;
      bottom: 16px;
    }
  }
</style>

<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph-thin ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <span class="chat-header-title">JANEDORE Support</span>
    <button class="chat-header-close" onclick="toggleChat()">✕</button>
  </div>
  <div class="chat-options" id="chat-options">
    <button class="chat-option-btn" onclick="startChat()">💬 Chat</button>
    <button class="chat-option-btn" onclick="showOrderLookup()">📦 Track Order</button>
  </div>
  <div class="chat-messages" id="chat-messages">
    <div class="chat-welcome"><strong>Welcome to JANEDORE</strong>Ask us anything — sizing, styling, shipping.</div>
  </div>
  <div class="order-lookup" id="order-lookup">
    <div class="order-lookup-title">Track Your Order</div>
    <input class="order-lookup-input" id="order-lookup-input" placeholder="Enter order number">
    <button class="order-lookup-btn" onclick="lookupOrder()">Track</button>
    <div class="order-result" id="order-result"></div>
    <button class="back-to-chat-btn" onclick="backToChatOptions()">← Back</button>
  </div>
  <div class="chat-input-wrap" id="chat-input-wrap">
    <input class="chat-input" id="chat-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendChatMessage()">
    <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>
</div>
