<style>
  #live-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    box-shadow: 0 2px 12px rgba(0,0,0,0.15);
  }
  #live-chat-bubble:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
  }
  .chat-unread-dot {
    position: absolute;
    top: 3px;
    right: 3px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: #c00;
    border: 2px solid #fff;
    display: none;
  }
  #chat-window {
    position: fixed;
    bottom: 88px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 520px;
    max-height: calc(100vh - 140px);
    background: #fff;
    border: none;
    border-radius: 16px;
    z-index: 998;
    display: none;
    flex-direction: column;
    box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    overflow: hidden;
  }
  #chat-window.open { display: flex; }
  .chat-header {
    background: #111;
    color: #fff;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.02em;
    font-weight: 600;
    text-transform: none;
    color: #fff;
  }
  .chat-header-close {
    background: none;
    border: none;
    color: rgba(255,255,255,0.6);
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }
  .chat-header-close:hover { color: #fff; }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }

  .chat-messages {
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    padding: 20px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    background: #fafaf9;
  }
  .chat-msg {
    max-width: 80%;
    padding: 12px 16px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 400;
    line-height: 1.6;
    letter-spacing: 0.01em;
    animation: chatFadeIn 0.3s ease;
    border-radius: 16px;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.customer { align-self: flex-end; background: #111; color: #fff; border-bottom-right-radius: 4px; }
  .chat-msg.admin { align-self: flex-start; background: #fff; color: #111; border: 1px solid #e0e0e0; border-bottom-left-radius: 4px; }
  .chat-msg-time {
    font-size: 9px;
    opacity: 0.5;
    margin-top: 6px;
    font-family: 'Manrope', sans-serif;
  }

  /* Soft-rounded pill button — used for Track Order, satisfaction
     replies, and any other in-chat action button. Matches the
     satisfaction-prompt buttons that already existed in chat.js. */
  .chat-pill-btn {
    background: none;
    border: 0.5px solid currentColor;
    padding: 8px 18px;
    border-radius: 20px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s;
  }
  .chat-pill-btn:hover { background: #111; color: #fff; }
  .chat-pill-btn.filled {
    background: #111;
    color: #fff;
    border: none;
  }
  .chat-pill-btn.filled:hover { background: #333; }

  .chat-welcome {
    text-align: center;
    padding: 32px 16px;
    color: #888;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 400;
  }
  .chat-welcome strong { display: block; color: #111; font-size: 16px; margin-bottom: 12px; font-weight: 600; }
  .chat-input-wrap {
    display: flex;
    border-top: 1px solid #e0e0e0;
    padding: 14px 16px;
    gap: 10px;
    flex-shrink: 0;
    background: #fff;
  }
  .chat-input {
    flex: 1;
    border: none;
    border-bottom: 1px solid #e0e0e0;
    padding: 10px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 400;
    outline: none;
    background: transparent;
    color: #111;
    transition: border-color 0.2s;
  }
  .chat-input::placeholder { color: #bbb; }
  .chat-input:focus { border-color: #111; }
  .chat-send-btn {
    background: #111;
    color: #fff;
    border: none;
    padding: 10px 20px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    transition: all 0.2s;
    border-radius: 20px;
  }
  .chat-send-btn:hover { background: #333; }

  .order-lookup {
    padding: 32px 28px;
    background: #fff;
    flex: 1;
    min-height: 0;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .order-lookup-title {
    font-family: 'Manrope', sans-serif;
    font-size: 20px;
    font-weight: 600;
    color: #111;
    margin-bottom: 12px;
  }
  .order-lookup-subtitle {
    font-size: 12px;
    font-weight: 400;
    color: #888;
    margin-bottom: 28px;
    text-align: center;
    font-family: 'Manrope', sans-serif;
  }
  .order-lookup-input {
    width: 100%;
    border: none;
    border-bottom: 1px solid #e0e0e0;
    padding: 12px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 400;
    outline: none;
    margin-bottom: 24px;
    color: #111;
    background: transparent;
    text-align: center;
    transition: border-color 0.2s;
  }
  .order-lookup-input::placeholder { color: #bbb; }
  .order-lookup-input:focus { border-color: #111; }
  .order-lookup-btn {
    background: #111;
    color: #fff;
    border: none;
    padding: 12px 32px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: all 0.2s;
    border-radius: 20px;
  }
  .order-lookup-btn:hover { background: #333; transform: translateY(-1px); }
  .order-result {
    margin-top: 24px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 400;
    color: #888;
    text-align: center;
    line-height: 1.6;
    width: 100%;
  }
  .back-to-chat-btn {
    background: none;
    border: none;
    border-bottom: 0.5px solid #ccc;
    color: #999;
    padding: 6px 2px;
    font-family: 'Manrope', sans-serif;
    font-size: 10px;
    font-weight: 500;
    cursor: pointer;
    width: auto;
    margin-top: 28px;
    transition: all 0.2s;
  }
  .back-to-chat-btn:hover { color: #111; border-color: #111; }

  .chat-customer-info {
    padding: 10px 20px;
    background: #fafaf9;
    border-bottom: 1px solid #e0e0e0;
    font-family: 'Manrope', sans-serif;
    font-size: 9px;
    color: #888;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .chat-customer-info-left {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }
  .chat-switch-inline {
    background: none;
    border: none;
    color: #ccc;
    font-family: 'Manrope', sans-serif;
    font-size: 8px;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .chat-switch-inline:hover { color: #888; }
  .chat-typing-indicator {
    padding: 6px 20px;
    font-family: 'Manrope', sans-serif;
    font-size: 10px;
    color: #888;
    font-style: italic;
    background: #fafaf9;
    display: none;
  }
  .chat-footer-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 0;
    background: #fff;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: -0.01em;
    font-weight: 700;
    color: #111;
    flex-shrink: 0;
  }
  .chat-footer-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: #111;
    animation: chat-footer-spin 4s ease-in-out infinite alternate;
  }
  @keyframes chat-footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chat-footer-mark { animation: none; }
  }
  @media (max-width: 480px) {
    #chat-window {
      width: calc(100vw - 32px);
      right: 16px;
      left: 16px;
      height: 480px;
      border-radius: 14px;
    }
    #live-chat-bubble { right: 16px; bottom: 16px; }
    .order-lookup { padding: 24px 20px; }
  }
</style>

<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph-thin ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <span class="chat-header-title">JANEDORE Support</span>
    <button class="chat-header-close" onclick="toggleChat()">✕</button>
  </div>

  <!-- Customer info bar (only shown once a name/email is known,
       e.g. after a human handoff asks for it — no longer a gate
       before chatting at all). -->
  <div class="chat-customer-info" id="chat-customer-info" style="display:none;">
    <div class="chat-customer-info-left">
      <span id="chat-customer-name"></span>
      <span id="chat-customer-email"></span>
    </div>
    <button class="chat-switch-inline" onclick="clearChatSession()" title="Switch account">Switch</button>
  </div>

  <!-- Typing indicator -->
  <div class="chat-typing-indicator" id="chat-typing-indicator">JANEDORE is typing...</div>

  <!-- Messages — this is now the default view on open. The AI
       greeting + Track Order button are injected here as the
       first message when there's no history yet (see chat.js). -->
  <div class="chat-messages" id="chat-messages"></div>

  <!-- Order lookup screen -->
  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track Your Order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <input class="order-lookup-input" id="order-lookup-input"
           placeholder="Order number (e.g. ORD-12345)"
           onkeypress="if(event.key==='Enter')lookupOrder()">
    <button class="order-lookup-btn" onclick="lookupOrder()">Track</button>
    <div class="order-result" id="order-result"></div>
    <button class="back-to-chat-btn" onclick="backToChat()">← Back to chat</button>
  </div>

  <!-- Message input — always visible once the chat window is open. -->
  <div class="chat-input-wrap" id="chat-input-wrap">
    <input class="chat-input" id="chat-input" placeholder="Type your message…"
           onkeypress="if(event.key==='Enter')sendChatMessage()"
           oninput="handleCustomerTyping()">
    <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>

  <!-- builtbypearl branding -->
  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span>builtbypearl
  </div>
</div>
