<!-- =========================================================
     JANEDORE CHAT WIDGET
     Full-screen + pill input + wider arrow Send button.
     Aesthetic only. JS hooks unchanged.
     ========================================================= -->
<style>
  /* ---------- CONTAINER SAFETY ---------- */
  #chat-container {
    position: static !important;
    transform: none !important;
    filter: none !important;
    perspective: none !important;
    contain: none !important;
    will-change: auto !important;
  }

  /* ---------- LAUNCHER BUBBLE ---------- */
  #live-chat-bubble {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    z-index: 9998 !important;
    width: 48px !important;
    height: 48px !important;
    border-radius: 24px !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
    perspective: 300px !important;
    /* JAI mascot colors: square fill vs eyes/mouth fill. Default state
       (button bg #111) needs a WHITE square so it reads against the dark
       button — the opposite of the literal Canva artwork (black square,
       white eyes). See .over-dark-footer below for where the artwork's
       actual black/white polarity shows up as designed. */
    --jai-bg: #fff;
    --jai-fg: #111;
  }
  #live-chat-bubble:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25) !important;
  }
  body.chat-is-open #live-chat-bubble { display: none !important; }

  /* Bubble is #111 on #111 — invisible once the black footer scrolls
     behind it. Toggled by the IntersectionObserver in chat.js while
     #main-footer is in view. This is also where the JAI mascot's colors
     flip to match the original Canva artwork exactly (black square,
     white eyes/mouth) — since the button itself is white here, that
     polarity is what actually reads correctly against it. */
  #live-chat-bubble.over-dark-footer {
    background: #fff !important;
    color: #111 !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35) !important;
    --jai-bg: #111;
    --jai-fg: #fff;
  }
  #live-chat-bubble.over-dark-footer:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.45) !important;
  }

  /* ---------- JAI MASCOT ----------
     Pure CSS. A flat square (not a rendered 6-face cube — perspective +
     rotateX/Y/Z on a flat plane reads as "3D tilt" without ever showing
     a blank side face, which a literal spinning cube would at 90°).
     JS only ever toggles which state class is present; every animation
     itself — float, tilt, blink, bounce — is defined here. */
  .jai-mascot {
    width: 16px !important;
    height: 16px !important;
    position: relative !important;
    transform-style: preserve-3d !important;
    animation: jai-idle-float 4.5s ease-in-out infinite !important;
  }
  .jai-face {
    position: absolute !important;
    inset: 0 !important;
    background: var(--jai-bg) !important;
    border-radius: 3px !important;
  }
  .jai-eye {
    position: absolute !important;
    top: 32% !important;
    width: 2.5px !important;
    height: 2.5px !important;
    border-radius: 50% !important;
    background: var(--jai-fg) !important;
    animation: jai-blink 5.5s ease-in-out infinite !important;
  }
  .jai-eye-left { left: 25% !important; }
  .jai-eye-right { right: 25% !important; }
  .jai-mouth {
    position: absolute !important;
    left: 25% !important;
    right: 25% !important;
    bottom: 24% !important;
    height: 1px !important;
    background: var(--jai-fg) !important;
    border-radius: 0 !important;
  }

  /* HAPPY — smile: the straight mouth bar curves into an arc instead.
     Toggled the same way as the other states (a class on the mascot/
     avatar container), so no direct reference to the mouth element is
     needed anywhere in JS. */
  .jai-mascot.jai-happy .jai-mouth,
  .jai-msg-avatar.jai-happy .jai-mouth {
    left: 22% !important;
    right: 22% !important;
    bottom: 20% !important;
    height: 3px !important;
    background: transparent !important;
    border-bottom: 1px solid var(--jai-fg) !important;
    border-radius: 0 0 50% 50% !important;
  }
  .jai-mascot.jai-happy {
    animation: jai-happy-bob 1.8s ease-in-out infinite !important;
  }
  @keyframes jai-happy-bob {
    0%, 100% { transform: translateY(0) rotateZ(0deg); }
    50%      { transform: translateY(-1.5px) rotateZ(2deg); }
  }

  /* Blinks on its own clock, independent of whatever idle/thinking/
     responding animation is running on the parent .jai-mascot — both
     eyes together (that's how real blinks read as natural, not
     unsettling), just decoupled from body movement. */
  @keyframes jai-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.1); }
  }

  /* IDLE (default) — slow float + tiny tilt. Deliberately never
     completes a full rotation, so the face never turns away. */
  @keyframes jai-idle-float {
    0%   { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
    25%  { transform: translateY(-1.5px) rotateX(6deg)  rotateY(-8deg) rotateZ(1deg); }
    50%  { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
    75%  { transform: translateY(1.5px)  rotateX(-6deg) rotateY(8deg)  rotateZ(-1deg); }
    100% { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
  }

  /* THINKING — rotation slows to a near-hold, gentle sideways sway,
     like it's turning its "attention" to one side. */
  .jai-mascot.jai-thinking {
    animation: jai-thinking-sway 2.8s ease-in-out infinite !important;
  }
  @keyframes jai-thinking-sway {
    0%, 100% { transform: rotateY(0deg) rotateZ(0deg); }
    50%      { transform: rotateY(14deg) rotateZ(2deg); }
  }

  /* RESPONDING — quick light bounce right when a reply lands. */
  .jai-mascot.jai-responding {
    animation: jai-responding-bounce 0.6s ease-in-out 2 !important;
  }
  @keyframes jai-responding-bounce {
    0%   { transform: translateY(0)    rotateX(0deg); }
    40%  { transform: translateY(-3px) rotateX(-10deg); }
    100% { transform: translateY(0)    rotateX(0deg); }
  }

  /* EXCITED — quick little rotation bounce, e.g. on a happy resolution. */
  .jai-mascot.jai-excited {
    animation: jai-excited-spin 0.5s ease-in-out 2 !important;
  }
  @keyframes jai-excited-spin {
    0%   { transform: rotateZ(0deg)  translateY(0); }
    50%  { transform: rotateZ(12deg) translateY(-2px); }
    100% { transform: rotateZ(0deg)  translateY(0); }
  }

  /* CONFUSED — a held, asymmetric tilt, e.g. on an AI failure/fallback. */
  .jai-mascot.jai-confused {
    animation: jai-confused-tilt 1.4s ease-in-out 1 !important;
  }
  @keyframes jai-confused-tilt {
    0%   { transform: rotateZ(0deg); }
    50%  { transform: rotateZ(-16deg); }
    100% { transform: rotateZ(0deg); }
  }

  .chat-unread-dot {
    position: absolute !important;
    top: 3px !important;
    right: 3px !important;
    width: 8px !important;
    height: 8px !important;
    border-radius: 50% !important;
    background: #2ecc71 !important;
    border: 2px solid #fff !important;
    display: none;
  }

  /* ---------- FULL SCREEN WINDOW ---------- */
  #chat-window {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    max-width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    max-height: 100vh !important;
    max-height: 100dvh !important;
    background: #fff !important;
    border: none !important;
    border-radius: 0 !important;
    z-index: 9999 !important;
    display: none;
    flex-direction: column !important;
    box-shadow: none !important;
    overflow: hidden !important;
    overscroll-behavior: none !important;
  }
  #chat-window.open { display: flex !important; }

  /* ---------- HEADER ---------- */
  #chat-window .chat-header {
    background: #111 !important;
    color: #fff !important;
    padding: 18px 20px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-header-close {
    background: none !important;
    border: none !important;
    color: rgba(255,255,255,0.6) !important;
    cursor: pointer !important;
    font-size: 16px !important;
    padding: 0 !important;
    line-height: 1 !important;
    transition: color 0.2s !important;
  }
  #chat-window .chat-header-close:hover { color: #fff !important; }

  /* ---------- MESSAGES ---------- */
  #chat-window .chat-body {
    flex: 1 !important;
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    overscroll-behavior: contain !important;
  }
  #chat-window .chat-messages {
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    padding: 20px !important;
    flex-direction: column !important;
    gap: 12px !important;
    background: #fafaf9 !important;
    overscroll-behavior: contain !important;
    -webkit-overflow-scrolling: touch !important;
  }
  #chat-window .chat-msg {
    max-width: 80% !important;
    padding: 12px 16px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 300 !important;
    line-height: 1.6 !important;
    letter-spacing: 0.02em !important;
    animation: chatFadeIn 0.3s ease !important;
    border-radius: 24px !important;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chat-window .chat-msg.customer {
    align-self: flex-end !important;
    background: #111 !important;
    color: #fff !important;
    border-bottom-right-radius: 4px !important;
  }
  #chat-window .chat-msg.admin {
    align-self: flex-start !important;
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #e0e0e0 !important;
    border-bottom-left-radius: 4px !important;
  }
  #chat-window .chat-msg-time {
    font-size: 10px !important;
    opacity: 0.5 !important;
    margin-top: 6px !important;
    font-family: 'Inter', sans-serif !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- JAI AVATAR IN CONVERSATION ----------
     WhatsApp-style: JAI's own replies show its face next to the bubble;
     a human admin's replies (and the "connecting you to our team"
     handoff message) never do, so customers can tell which one they're
     talking to at a glance. Reuses the same .jai-face/.jai-eye/.jai-mouth
     shapes as the launcher mascot, just with its own fixed colors — this
     context is always the light chat panel (#fafaf9), never the dark
     footer, so it doesn't need the launcher's color-flip logic. */
  #chat-window .jai-msg-row {
    display: flex !important;
    align-items: flex-end !important;
    gap: 8px !important;
    align-self: flex-start !important;
    max-width: 85% !important;
  }
  #chat-window .chat-msg.jai-msg {
    max-width: none !important;
    flex: 1 !important;
  }
  .jai-msg-avatar {
    width: 16px !important;
    height: 16px !important;
    flex-shrink: 0 !important;
    position: relative !important;
    margin-bottom: 4px !important;
    --jai-bg: #111;
    --jai-fg: #fff;
  }

  /* ---------- PILL BUTTONS ---------- */
  #chat-window .chat-pill-btn {
    background: none !important;
    border: 0.5px solid currentColor !important;
    padding: 8px 18px !important;
    border-radius: 24px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
  }
  #chat-window .chat-pill-btn:hover {
    background: #111 !important;
    color: #fff !important;
  }
  #chat-window .chat-pill-btn.filled {
    background: #111 !important;
    color: #fff !important;
    border: none !important;
  }
  #chat-window .chat-pill-btn.filled:hover { background: #333 !important; }

  /* Track Order button specifically — 2px taller (padding, since the
     shared .chat-pill-btn has no explicit height) and 2px less rounded
     than the shared pill style used elsewhere (e.g. the satisfaction
     Yes/No buttons), which is untouched. */
  #chat-window .chat-pill-btn.jai-track-order-btn {
    padding: 9px 18px !important;
    border-radius: 15px !important;
  }

  /* ---------- WELCOME ---------- */
  #chat-window .chat-welcome {
    text-align: center !important;
    padding: 32px 16px !important;
    color: #888 !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }
  #chat-window .chat-welcome strong {
    display: block !important;
    color: #111 !important;
    font-size: 16px !important;
    margin-bottom: 12px !important;
    font-weight: 400 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- INPUT PILL (border above removed) ---------- */
  #chat-window .chat-input-wrap {
    align-items: center !important;
    padding: 14px 16px !important;
    gap: 0 !important;
    flex-shrink: 0 !important;
    background: #fff !important;
    border-top: none !important;
  }
  #chat-window .chat-input-pill {
    display: flex !important;
    align-items: center !important;
    width: 100% !important;
    background: #f4f4f2 !important;
    border-radius: 24px !important;
    padding: 4px 4px 4px 18px !important;
    transition: background 0.2s !important;
  }
  #chat-window .chat-input-pill:focus-within {
    background: #eeeeec !important;
  }
  #chat-window .chat-input {
    flex: 1 !important;
    border: none !important;
    outline: none !important;
    background: transparent !important;
    padding: 10px 8px 10px 0 !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #111 !important;
    border-bottom: none !important;
  }
  #chat-window .chat-input::placeholder { color: #aaa !important; }

  /* Send button — wider, arrow icon, inside pill, far right */
  #chat-window .chat-send-btn {
    position: static !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;
    flex-shrink: 0 !important;
    width: 52px !important;
    height: 36px !important;
    min-width: 52px !important;
    min-height: 36px !important;
    border-radius: 24px !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    padding: 0 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    transition: background 0.2s, transform 0.2s !important;
  }
  #chat-window .chat-send-btn i {
    font-size: 16px !important;
    line-height: 1 !important;
  }
  #chat-window .chat-send-btn:hover { background: #333 !important; }
  #chat-window .chat-send-btn:active { transform: scale(0.96) !important; }
  #chat-window .chat-send-btn.wide {
    width: auto !important;
    min-width: auto !important;
    padding: 0 18px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- ORDER LOOKUP ---------- */
  #chat-window .order-lookup {
    padding: 32px 28px !important;
    background: #fff !important;
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #chat-window .order-lookup-title {
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    letter-spacing: 0.02em !important;
    color: #111 !important;
    margin-bottom: 12px !important;
  }
  #chat-window .order-lookup-subtitle {
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #888 !important;
    margin-bottom: 28px !important;
    text-align: center !important;
  }

  #chat-window .order-result {
    margin-top: 24px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 14px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #888 !important;
    text-align: center !important;
    line-height: 1.6 !important;
    width: 100% !important;
  }
  /* ---------- TYPING INDICATOR ----------
     Rendered as an actual bubble at the bottom of #chat-messages (built
     dynamically by showTypingIndicator() in chat.js), not a fixed bar
     under the header — so the dots appear exactly where the reply is
     about to land, same place any other message would. Reuses the
     .chat-msg.admin bubble look; .jai-msg gives it JAI's avatar via the
     shared jai-msg-row markup, but needs its width un-stretched since
     the shared .jai-msg rule sets flex:1 for full-length text bubbles —
     three dots shouldn't stretch to fill the row. */
  #chat-window .chat-msg.jai-msg.chat-typing-bubble {
    flex: 0 0 auto !important;
    max-width: none !important;
    padding: 10px 14px !important;
    display: inline-flex !important;
    align-items: center !important;
  }
  #chat-window .typing-dots {
    display: inline-flex !important;
    align-items: center !important;
    gap: 3px !important;
  }
  #chat-window .typing-dots span {
    width: 5px !important;
    height: 5px !important;
    border-radius: 50% !important;
    background: #888 !important;
    animation: jai-typing-bounce 1.2s infinite ease-in-out !important;
  }
  #chat-window .typing-dots span:nth-child(2) { animation-delay: 0.15s !important; }
  #chat-window .typing-dots span:nth-child(3) { animation-delay: 0.3s !important; }
  @keyframes jai-typing-bounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30%           { transform: translateY(-4px); opacity: 1; }
  }

  /* ---------- FOOTER BRAND ---------- */
  #chat-window .chat-footer-brand {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    padding: 10px 0 !important;
    background: #fff !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    letter-spacing: -0.01em !important;
    font-weight: 700 !important;
    color: #111 !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-footer-brand a {
    color: inherit !important;
    text-decoration: none !important;
  }
  #chat-window .chat-footer-mark {
    display: inline-block !important;
    width: 10px !important;
    height: 10px !important;
    border-radius: 3px !important;
    background: #111 !important;
    animation: chat-footer-spin 4s ease-in-out infinite alternate !important;
  }
  @keyframes chat-footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #chat-window .chat-footer-mark { animation: none !important; }
    .jai-mascot,
    .jai-mascot.jai-thinking,
    .jai-mascot.jai-responding,
    .jai-mascot.jai-excited,
    .jai-mascot.jai-confused,
    .jai-mascot.jai-happy,
    .jai-eye {
      animation: none !important;
    }
    #chat-window .typing-dots span { animation: none !important; opacity: 0.7 !important; }
  }
</style>

<!-- =========================================================
     WIDGET MARKUP
     ========================================================= -->

<!-- Track Order button lives here as real markup — JS clones this
     template wherever the button needs to appear (the initial JAI
     greeting, and again any time a customer types something like
     "track order"), instead of building it from an HTML string. -->
<template id="jai-track-order-template">
  <button class="chat-pill-btn filled jai-track-order-btn" onclick="showOrderLookup()">Track Order</button>
</template>

<button id="live-chat-bubble" onclick="toggleChat()">
  <div class="jai-mascot" id="jai-mascot" aria-hidden="true">
    <div class="jai-face">
      <div class="jai-eye jai-eye-left"></div>
      <div class="jai-eye jai-eye-right"></div>
      <div class="jai-mouth"></div>
    </div>
  </div>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <button class="chat-header-close" id="chat-header-btn" onclick="handleHeaderButtonClick()">
      <i class="ph-light ph-x" id="chat-header-icon"></i>
    </button>
  </div>

  <!-- Typing indicator is no longer static markup here — showTypingIndicator()
       in chat.js builds it dynamically inside #chat-messages, at the bottom
       of the conversation, right where the reply will actually appear. -->

  <div class="chat-messages" id="chat-messages"></div>

  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track your order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <div class="chat-input-pill">
      <input class="chat-input" id="order-lookup-input"
             placeholder="Order number (e.g. ORD-12345)"
             onkeypress="if(event.key==='Enter')lookupOrder()">
      <button class="chat-send-btn wide" id="order-track-btn" onclick="lookupOrder()">Track</button>
    </div>
    <div class="order-result" id="order-result"></div>
  </div>

  <div class="chat-input-wrap" id="chat-input-wrap" style="display:flex;">
    <div class="chat-input-pill">
      <input class="chat-input" id="chat-input" placeholder="Type your message…"
             onkeypress="if(event.key==='Enter')sendChatMessage()"
             oninput="handleCustomerTyping()">
      <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">
        <i class="ph-light ph-arrow-up"></i>
      </button>
    </div>
  </div>

  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span><a href="https://builtbypearl.netlify.app" target="_blank" rel="noopener">builtbypearl</a>
  </div>
</div>
