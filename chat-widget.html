<!-- =========================================================
     JANEDORE CHAT WIDGET
     Full-screen + pill input + wider arrow Send button.
     Aesthetic only. JS hooks unchanged.
     ========================================================= -->
<style>
  /* ---------- CONTAINER SAFETY ---------- */
  #chat-container {
    position: static !important;
    transform: none !important;
    filter: none !important;
    perspective: none !important;
    contain: none !important;
    will-change: auto !important;
  }

  /* ---------- LAUNCHER BUBBLE ---------- */
  #live-chat-bubble {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    z-index: 9998 !important;
    width: 48px !important;
    height: 48px !important;
    border-radius: 0 !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 22px !important;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
    perspective: 300px !important;
    /* JAI mascot colors: square fill vs eyes/mouth fill. Default state
       (button bg #111) needs a WHITE square so it reads against the dark
       button — the opposite of the literal Canva artwork (black square,
       white eyes). See .over-dark-footer below for where the artwork's
       actual black/white polarity shows up as designed. */
    --jai-bg: #fff;
    --jai-fg: #111;
  }
  #live-chat-bubble:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25) !important;
  }
  body.chat-is-open #live-chat-bubble { display: none !important; }
  /* Hidden on the product page (its sticky Add to bag bar sits at the
     bottom) and on the bag and checkout, where it would cover the totals
     and the pay button; shown on every other page. */
  body:has(#page-product-detail.active) #live-chat-bubble,
  body:has(#page-cart.active) #live-chat-bubble,
  body:has(#page-checkout.active) #live-chat-bubble,
  body:has(#collection-filter-options.open) #live-chat-bubble,
  body:has(#menu-drawer.open) #live-chat-bubble,
  body:has(.added-toast.show) #live-chat-bubble { display: none !important; }

  /* Bubble is #111 on #111 — invisible once the black footer scrolls
     behind it. Toggled by the IntersectionObserver in chat.js while
     #main-footer is in view. This is also where the JAI mascot's colors
     flip to match the original Canva artwork exactly (black square,
     white eyes/mouth) — since the button itself is white here, that
     polarity is what actually reads correctly against it. */
  #live-chat-bubble.over-dark-footer {
    background: #fff !important;
    color: #111 !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.35) !important;
    --jai-bg: #111;
    --jai-fg: #fff;
  }
  #live-chat-bubble.over-dark-footer:hover {
    box-shadow: 0 8px 24px rgba(0,0,0,0.45) !important;
  }

  /* ---------- JAI MASCOT ----------
     Pure CSS. A flat square (not a rendered 6-face cube — perspective +
     rotateX/Y/Z on a flat plane reads as "3D tilt" without ever showing
     a blank side face, which a literal spinning cube would at 90°).
     JS only ever toggles which state class is present; every animation
     itself — float, tilt, blink, bounce — is defined here. */
  .jai-mascot {
    width: 16px !important;
    height: 16px !important;
    position: relative !important;
    transform-style: preserve-3d !important;
    animation: jai-idle-float 4.5s ease-in-out infinite !important;
  }
  .jai-face {
    position: absolute !important;
    inset: 0 !important;
    background: var(--jai-bg) !important;
    border-radius: 3px !important;
  }
  .jai-eye {
    position: absolute !important;
    top: 32% !important;
    width: 2.5px !important;
    height: 2.5px !important;
    border-radius: 50% !important;
    background: var(--jai-fg) !important;
    animation: jai-blink 5.5s ease-in-out infinite !important;
  }
  .jai-eye-left { left: 25% !important; }
  .jai-eye-right { right: 25% !important; }
  .jai-mouth {
    position: absolute !important;
    left: 25% !important;
    right: 25% !important;
    bottom: 24% !important;
    height: 1px !important;
    background: var(--jai-fg) !important;
    border-radius: 0 !important;
  }

  /* HAPPY — smile: the straight mouth bar curves into an arc instead.
     Toggled the same way as the other states (a class on the mascot/
     avatar container), so no direct reference to the mouth element is
     needed anywhere in JS. */
  .jai-mascot.jai-happy .jai-mouth,
  .jai-msg-avatar.jai-happy .jai-mouth {
    left: 22% !important;
    right: 22% !important;
    bottom: 20% !important;
    height: 3px !important;
    background: transparent !important;
    border-bottom: 1px solid var(--jai-fg) !important;
    border-radius: 0 0 50% 50% !important;
  }
  .jai-mascot.jai-happy {
    animation: jai-happy-bob 1.8s ease-in-out infinite !important;
  }
  @keyframes jai-happy-bob {
    0%, 100% { transform: translateY(0) rotateZ(0deg); }
    50%      { transform: translateY(-1.5px) rotateZ(2deg); }
  }

  /* Blinks on its own clock, independent of whatever idle/thinking/
     responding animation is running on the parent .jai-mascot — both
     eyes together (that's how real blinks read as natural, not
     unsettling), just decoupled from body movement. */
  @keyframes jai-blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95%           { transform: scaleY(0.1); }
  }

  /* IDLE (default) — slow float + tiny tilt. Deliberately never
     completes a full rotation, so the face never turns away. */
  @keyframes jai-idle-float {
    0%   { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
    25%  { transform: translateY(-1.5px) rotateX(6deg)  rotateY(-8deg) rotateZ(1deg); }
    50%  { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
    75%  { transform: translateY(1.5px)  rotateX(-6deg) rotateY(8deg)  rotateZ(-1deg); }
    100% { transform: translateY(0)     rotateX(0deg)  rotateY(0deg)   rotateZ(0deg); }
  }

  /* THINKING — rotation slows to a near-hold, gentle sideways sway,
     like it's turning its "attention" to one side. */
  .jai-mascot.jai-thinking {
    animation: jai-thinking-sway 2.8s ease-in-out infinite !important;
  }
  @keyframes jai-thinking-sway {
    0%, 100% { transform: rotateY(0deg) rotateZ(0deg); }
    50%      { transform: rotateY(14deg) rotateZ(2deg); }
  }

  /* RESPONDING — quick light bounce right when a reply lands. */
  .jai-mascot.jai-responding {
    animation: jai-responding-bounce 0.6s ease-in-out 2 !important;
  }
  @keyframes jai-responding-bounce {
    0%   { transform: translateY(0)    rotateX(0deg); }
    40%  { transform: translateY(-3px) rotateX(-10deg); }
    100% { transform: translateY(0)    rotateX(0deg); }
  }

  /* EXCITED — quick little rotation bounce, e.g. on a happy resolution. */
  .jai-mascot.jai-excited {
    animation: jai-excited-spin 0.5s ease-in-out 2 !important;
  }
  @keyframes jai-excited-spin {
    0%   { transform: rotateZ(0deg)  translateY(0); }
    50%  { transform: rotateZ(12deg) translateY(-2px); }
    100% { transform: rotateZ(0deg)  translateY(0); }
  }

  /* CONFUSED — a held, asymmetric tilt, e.g. on an AI failure/fallback. */
  .jai-mascot.jai-confused {
    animation: jai-confused-tilt 1.4s ease-in-out 1 !important;
  }
  @keyframes jai-confused-tilt {
    0%   { transform: rotateZ(0deg); }
    50%  { transform: rotateZ(-16deg); }
    100% { transform: rotateZ(0deg); }
  }

  /* Unread count on the launcher (showUnreadBadgeIfClosed(), chat.js):
     white with black text like the header's bag count, with a black
     ring so it reads on white pages too; flips over the dark footer. */
  .chat-unread-dot {
    position: absolute !important;
    top: -7px !important;
    right: -7px !important;
    min-width: 18px !important;
    height: 18px !important;
    padding: 0 4px !important;
    box-sizing: border-box !important;
    border-radius: 9px !important;
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #111 !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 10px !important;
    font-weight: 600 !important;
    line-height: 1 !important;
    align-items: center !important;
    justify-content: center !important;
    display: none;
  }
  #live-chat-bubble.over-dark-footer .chat-unread-dot { background: #111 !important; color: #fff !important; border-color: #fff !important; }

  /* A new message while the chat is closed: the launcher hops and
     wiggles (a few times, ~6s apart, until it's opened). */
  #live-chat-bubble.chat-nudge { animation: chat-nudge 0.9s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important; }
  @keyframes chat-nudge {
    0%   { transform: translateY(0) rotate(0); }
    20%  { transform: translateY(-10px) rotate(0); }
    35%  { transform: translateY(0) rotate(0); }
    50%  { transform: translateY(0) rotate(-10deg); }
    65%  { transform: translateY(0) rotate(8deg); }
    80%  { transform: translateY(0) rotate(-4deg); }
    100% { transform: translateY(0) rotate(0); }
  }

  /* Message preview beside the launcher; tap it to open the chat. */
  #chat-preview {
    position: fixed !important;
    right: 24px !important;
    bottom: 84px !important;
    z-index: 9998 !important;
    width: min(280px, calc(100vw - 48px)) !important;
    box-sizing: border-box !important;
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #e5e5e5 !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.12) !important;
    padding: 12px 36px 12px 14px !important;
    font-family: 'Inter', sans-serif !important;
    text-align: left !important;
    cursor: pointer !important;
    opacity: 0 !important;
    transform: translateY(8px) !important;
    pointer-events: none !important;
    transition: opacity 0.25s ease, transform 0.25s ease !important;
  }
  #chat-preview.show { opacity: 1 !important; transform: translateY(0) !important; pointer-events: auto !important; }
  body.chat-is-open #chat-preview,
  body:has(#page-product-detail.active) #chat-preview,
  body:has(#page-cart.active) #chat-preview,
  body:has(#page-checkout.active) #chat-preview,
  body:has(#collection-filter-options.open) #chat-preview { display: none !important; }
  #chat-preview .chat-preview-name { display: block !important; font-size: 11px !important; font-weight: 600 !important; margin-bottom: 4px !important; }
  #chat-preview .chat-preview-text { display: block !important; font-size: 13px !important; line-height: 1.45 !important; color: #444 !important; }
  #chat-preview .chat-preview-close {
    position: absolute !important; top: 6px !important; right: 6px !important; background: none !important; border: none !important;
    padding: 4px !important; color: #111 !important; font-size: 14px !important; cursor: pointer !important; display: flex !important;
  }

  /* ---------- WINDOW (full screen; forceFullScreen() in chat.js sets
     the real inline-!important top/left/width/height on open/resize —
     this is just a sane CSS-only fallback, no rounded corners/shadow
     since the open panel is always edge-to-edge, never a floating
     card). ---------- */
  #chat-window {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100% !important;
    height: 100% !important;
    background: #fff !important;
    border: none !important;
    z-index: 9999 !important;
    display: none;
    flex-direction: column !important;
    overflow: hidden !important;
    overscroll-behavior: none !important;
  }
  #chat-window.open { display: flex !important; }

  /* ---------- HEADER ---------- */
  #chat-window .chat-header {
    background: #fff !important;
    color: #111 !important;
    padding: 16px 20px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: space-between !important;
    gap: 12px !important;
    border-bottom: none !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-header-identity {
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
    min-width: 0 !important;
  }
  #chat-window .chat-header-avatar {
    width: 44px !important;
    height: 44px !important;
    flex-shrink: 0 !important;
    border-radius: 50% !important;
    background: #111 !important;
    color: #fff !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.03em !important;
  }
  #chat-window .chat-header-name {
    font-family: 'Inter', sans-serif !important;
    font-size: 13px !important;
    font-weight: 600 !important;
    color: #111 !important;
    line-height: 1.3 !important;
  }
  #chat-window .chat-header-status {
    display: flex !important;
    align-items: center !important;
    gap: 5px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    color: #888 !important;
    line-height: 1.3 !important;
  }
  #chat-window .chat-header-status-dot {
    width: 7px !important;
    height: 7px !important;
    border-radius: 50% !important;
    background: #4caf50 !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-header-right {
    display: flex !important;
    align-items: center !important;
    gap: 10px !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-header-close {
    background: none !important;
    border: none !important;
    color: rgba(0,0,0,0.55) !important;
    cursor: pointer !important;
    font-size: 16px !important;
    padding: 0 !important;
    line-height: 1 !important;
    transition: color 0.2s !important;
    margin-left: auto !important;
  }
  #chat-window .chat-header-close:hover { color: #111 !important; }

  /* ---------- MESSAGES ---------- */
  #chat-window .chat-body {
    flex: 1 !important;
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    overscroll-behavior: contain !important;
  }
  #chat-window .chat-messages {
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    padding: 20px !important;
    flex-direction: column !important;
    gap: 12px !important;
    background: #fff !important;
    overscroll-behavior: contain !important;
    -webkit-overflow-scrolling: touch !important;
  }
  #chat-window .chat-msg {
    max-width: 80% !important;
    padding: 12px 16px !important;
    /* Same type as the header's Search products or brands text
       (.search-bar-trigger span, search.css) and the chat input. */
    font-family: 'Inter', sans-serif !important;
    font-size: 13px !important;
    font-weight: 400 !important;
    line-height: 1.6 !important;
    letter-spacing: normal !important;
    animation: chatFadeIn 0.3s ease !important;
    border-radius: 24px !important;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chat-window .chat-msg.customer {
    align-self: flex-end !important;
    background: #111 !important;
    color: #fff !important;
    border-bottom-right-radius: 4px !important;
  }
  #chat-window .chat-msg.admin {
    align-self: flex-start !important;
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #e0e0e0 !important;
    border-bottom-left-radius: 4px !important;
  }
  #chat-window .chat-msg-time {
    font-size: 9px !important;
    opacity: 0.5 !important;
    margin-top: 6px !important;
    font-family: 'Inter', sans-serif !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- JAI AVATAR IN CONVERSATION ----------
     WhatsApp-style: JAI's own replies show its face next to the bubble;
     a human admin's replies (and the "connecting you to our team"
     handoff message) never do, so customers can tell which one they're
     talking to at a glance. Reuses the same .jai-face/.jai-eye/.jai-mouth
     shapes as the launcher mascot, just with its own fixed colors — this
     context is always the light chat panel (#fafaf9), never the dark
     footer, so it doesn't need the launcher's color-flip logic. */
  #chat-window .jai-msg-row {
    display: flex !important;
    align-items: flex-end !important;
    gap: 8px !important;
    align-self: flex-start !important;
    max-width: 85% !important;
  }
  #chat-window .chat-msg.jai-msg {
    max-width: none !important;
    flex: 1 !important;
  }
  .jai-msg-avatar {
    width: 16px !important;
    height: 16px !important;
    flex-shrink: 0 !important;
    position: relative !important;
    margin-bottom: 4px !important;
    --jai-bg: #111;
    --jai-fg: #fff;
  }

  /* ---------- PILL BUTTONS ---------- */
  /* Every button in the chat is a 33px pill (the send button's height)
     with 12px regular Inter: these, the header's Track order button and
     the satisfaction Yes/No buttons. */
  #chat-window .chat-pill-btn {
    background: none !important;
    border: 1px solid #dcdcdc !important;
    height: 33px !important;
    padding: 0 18px !important;
    border-radius: 24px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    letter-spacing: normal !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
  }
  #chat-window .chat-pill-btn:hover {
    background: #111 !important;
    color: #fff !important;
  }
  #chat-window .chat-pill-btn.filled {
    background: #111 !important;
    color: #fff !important;
    border: none !important;
  }
  #chat-window .chat-pill-btn.filled:hover { background: #333 !important; }


  /* ---------- WELCOME SCREEN (greeting card + quick-action cards) ----------
     Built by renderAIGreeting() (chat.js). Separate from the old
     .chat-msg bubble styling below — explicitly NOT applied to regular
     conversation bubbles, which keep their existing 12px size. */
  #chat-window #jai-welcome-screen {
    display: flex !important;
    flex-direction: column !important;
    width: 100% !important;
    gap: 0 !important;
    padding-top: 6px !important;
  }
  /* Greeting: one soft grey bubble, no mascot, time underneath. */
  #chat-window .jai-welcome-bubble {
    align-self: flex-start !important;
    max-width: 82% !important;
    background: #f1f1f1 !important;
    border-radius: 18px !important;
    padding: 14px 18px !important;
    font-family: 'Inter', sans-serif !important;
  }
  #chat-window .jai-welcome-kicker {
    font-size: 11px !important;
    font-weight: 400 !important;
    color: #888 !important;
    margin-bottom: 4px !important;
  }
  #chat-window .jai-welcome-question {
    font-size: 14px !important;
    font-weight: 400 !important;
    color: #111 !important;
    line-height: 1.35 !important;
  }
  #chat-window .jai-welcome-time {
    font-family: 'Inter', sans-serif !important;
    font-size: 9px !important;
    font-weight: 400 !important;
    color: #aaa !important;
    margin: 6px 0 0 2px !important;
  }
  #chat-window .jai-quick-label {
    font-family: 'Inter', sans-serif !important;
    font-size: 8.5px !important;
    font-weight: 500 !important;
    letter-spacing: 0.22em !important;
    text-transform: uppercase !important;
    color: #777 !important;
    margin: 40px 0 6px 2px !important;
  }
  /* Quick help: plain rows (icon, title, chevron) split by hairlines. */
  #chat-window .jai-quick-actions {
    display: flex !important;
    flex-direction: column !important;
    gap: 0 !important;
    width: 100% !important;
  }
  #chat-window .jai-quick-card {
    display: flex !important;
    align-items: center !important;
    gap: 18px !important;
    width: 100% !important;
    background: none !important;
    border: none !important;
    border-bottom: 1px solid #e8e8e8 !important;
    border-radius: 0 !important;
    padding: 20px 4px !important;
    font-family: 'Inter', sans-serif !important;
    text-align: left !important;
    cursor: pointer !important;
    opacity: 1 !important;
    -webkit-appearance: none !important;
    appearance: none !important;
    -webkit-tap-highlight-color: transparent !important;
    transition: opacity 0.2s !important;
  }
  #chat-window .jai-quick-card:last-child { border-bottom: none !important; }
  #chat-window .jai-quick-card:active { opacity: 0.6 !important; }
  /* Disabled only for the brief window a card's own click is actually
     in flight (see disableQuickActionCards()/enableQuickActionCards()
     in chat.js) — never a permanent state once one card has been used. */
  #chat-window .jai-quick-card:disabled {
    opacity: 0.5 !important;
    cursor: default !important;
    pointer-events: none !important;
  }
  #chat-window .jai-card-icon {
    width: 24px !important;
    height: 24px !important;
    flex-shrink: 0 !important;
    background: none !important;
    color: #111 !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 20px !important;
  }
  #chat-window .jai-card-text {
    flex: 1 !important;
    min-width: 0 !important;
  }
  #chat-window .jai-card-title {
    font-size: 13px !important;
    font-weight: 400 !important;
    color: #111 !important;
    letter-spacing: 0.01em !important;
  }
  #chat-window .jai-card-chevron {
    flex-shrink: 0 !important;
    color: #111 !important;
    font-size: 14px !important;
  }

  /* ---------- AI-SUGGESTED PRODUCT CARDS ----------
     Reuses the real site .product-card component (collection.js's
     productCard()) verbatim — same markup, same click/wishlist/swatch
     behavior as the shop grid — just scaled down to a width that fits
     the chat panel instead of a grid cell. A single match renders one
     card; more than one renders a horizontally swipeable row. */
  #chat-window .jai-product-row {
    display: flex !important;
    gap: 10px !important;
    width: 100% !important;
    margin-top: 2px !important;
    align-self: flex-start !important;
  }
  #chat-window .jai-product-slider {
    overflow-x: auto !important;
    -webkit-overflow-scrolling: touch !important;
    padding-bottom: 4px !important;
    scrollbar-width: none !important;
  }
  #chat-window .jai-product-slider::-webkit-scrollbar { display: none !important; }
  #chat-window .jai-product-row .product-card {
    flex: 0 0 auto !important;
    width: 140px !important;
    cursor: pointer !important;
  }
  /* Suggested product names use the same typography as the search
     prompt, even inside the narrower chat product cards. Keep supporting
     brand/price metadata compact so the name remains the visual anchor. */
  #chat-window .jai-product-row .product-title {
    font-family: 'Inter', sans-serif !important;
    font-size: 13px !important;
    font-weight: 400 !important;
    letter-spacing: normal !important;
    line-height: normal !important;
    text-transform: none !important;
  }

<!-- Track order button lives here as real markup — JS clones this
     template wherever the button needs to appear (the initial JAI
     greeting, and again any time a customer types something like
     "track order"), instead of building it from an HTML string. -->
<template id="jai-track-order-template">
  <button class="chat-pill-btn filled jai-track-order-btn" onclick="showOrderLookup()">Track order</button>
</template>

<!-- The only copy of this markup — index.html used to also ship a
     static duplicate with this same id, directly in the page, as what
     looked like leftover scaffolding from before this file was split
     out. Two elements sharing an id meant document.getElementById
     (DOM.chatBubble, app.js) always resolved to that static one, not
     this real, fully-styled one, so updateChatVisibility() was
     silently toggling an invisible element every time — the
     wishlist/cart hide behavior never actually worked. Keep this the
     one and only #live-chat-bubble. -->
<button id="live-chat-bubble" onclick="toggleChat()" aria-label="Chat with us">
  <i class="ph ph-chat" aria-hidden="true"></i>
  <span class="chat-unread-dot" id="chat-unread-dot" aria-label="New messages"></span>
</button>
<div id="chat-preview" role="status" aria-live="polite" onclick="if(!chatOpen)toggleChat()">
  <span class="chat-preview-name"></span>
  <span class="chat-preview-text"></span>
  <button type="button" class="chat-preview-close" aria-label="Dismiss" onclick="event.stopPropagation();hideChatPreview()"><i class="ph ph-x"></i></button>
</div>

<div id="chat-window">
  <div class="chat-header">
    <div class="chat-header-identity">
      <div class="chat-header-avatar" aria-hidden="true">JAI</div>
      <div>
        <div class="chat-header-name">JAI</div>
        <div class="chat-header-status"><span class="chat-header-status-dot" aria-hidden="true"></span>Online</div>
      </div>
    </div>
    <div class="chat-header-right">
      <button class="chat-header-close" id="chat-header-btn" onclick="handleHeaderButtonClick()">
        <i class="ph ph-x" id="chat-header-icon"></i>
      </button>
    </div>
  </div>

  <!-- Typing indicator is no longer static markup here — showTypingIndicator()
       in chat.js builds it dynamically inside #chat-messages, at the bottom
       of the conversation, right where the reply will actually appear. -->

  <div class="chat-messages" id="chat-messages"></div>

  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track your order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <div class="chat-input-pill">
      <input class="chat-input" id="order-lookup-input"
             placeholder="Order number (e.g. JD-123456)"
             onkeypress="if(event.key==='Enter')lookupOrder()">
      <button class="chat-send-btn" id="order-track-btn" onclick="lookupOrder()" aria-label="Track order"><i class="ph ph-arrow-right"></i></button>
    </div>
    <div class="order-result" id="order-result"></div>
  </div>

  <div class="chat-input-wrap" id="chat-input-wrap" style="display:flex;">
    <div class="chat-input-pill">
      <button class="chat-attach-btn" id="chat-attach-btn" onclick="pickAndSendChatImage()" aria-label="Attach a photo">
        <i class="ph ph-paperclip-horizontal chat-attach-icon"></i>
      </button>
      <input class="chat-input" id="chat-input" placeholder="Type your message…"
             onkeypress="if(event.key==='Enter')sendChatMessage()"
             oninput="handleCustomerTyping()">
      <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">
        <i class="ph ph-arrow-up"></i>
      </button>
    </div>
  </div>

  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span><a href="https://builtbypearl.netlify.app" target="_blank" rel="noopener">builtbypearl</a>
  </div>
</div>
