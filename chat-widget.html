<style>

  #chat-window .chat-input {
    flex: 1 !important;
    border: none !important;
    outline: none !important;
    background: transparent !important;
    padding: 10px 8px 10px 0 !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 13px !important;
    font-weight: 400 !important;
    color: #111 !important;
    border-bottom: none !important;
  }
  #chat-window .chat-input::placeholder { color: #aaa !important; }

  #chat-window .chat-send-btn {
    flex-shrink: 0 !important;
    width: 36px !important;
    height: 36px !important;
    min-width: 36px !important;
    min-height: 36px !important;
    border-radius: 50% !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    padding: 0 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;

  }
  #chat-window .chat-send-btn:hover { background: #333 !important; }
  #chat-window .chat-send-btn:active { transform: scale(0.95) !important; }

  /* ---------- ORDER LOOKUP ---------- */
  #chat-window .order-lookup {
    padding: 32px 28px !important;
    background: #fff !important;
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #chat-window .order-lookup-title {
    font-family: 'Manrope', sans-serif !important;
    font-size: 20px !important;
    font-weight: 600 !important;
    color: #111 !important;
    margin-bottom: 12px !important;
  }
  #chat-window .order-lookup-subtitle {
    font-size: 12px !important;
    font-weight: 400 !important;
    color: #888 !important;
    margin-bottom: 28px !important;
    text-align: center !important;
    font-family: 'Manrope', sans-serif !important;
  }
  #chat-window .order-lookup-input {
    width: 100% !important;
    border: none !important;
    border-bottom: 1px solid #e0e0e0 !important;
    padding: 12px 0 !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    outline: none !important;
    margin-bottom: 24px !important;
    color: #111 !important;
    background: transparent !important;
    text-align: center !important;
    transition: border-color 0.2s !important;
  }
  #chat-window .order-lookup-input::placeholder { color: #bbb !important; }
  #chat-window .order-lookup-input:focus { border-color: #111 !important; }
  #chat-window .order-lookup-btn {
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    padding: 12px 32px !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 11px !important;
    font-weight: 600 !important;
    letter-spacing: 0.02em !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
    border-radius: 20px !important;
  }
  #chat-window .order-lookup-btn:hover {
    background: #333 !important;
    transform: translateY(-1px) !important;
  }
  #chat-window .order-result {
    margin-top: 24px !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    color: #888 !important;
    text-align: center !important;
    line-height: 1.6 !important;
    width: 100% !important;
  }
  #chat-window .back-to-chat-btn {
    background: none !important;
    border: none !important;
    border-bottom: 0.5px solid #ccc !important;

    font-family: 'Manrope', sans-serif !important;
    font-size: 10px !important;
    font-weight: 500 !important;
    cursor: pointer !important;
    width: auto !important;
    margin-top: 28px !important;
    transition: all 0.2s !important;
  }
  #chat-window .back-to-chat-btn:hover {
    color: #111 !important;
    border-color: #111 !important;
  }

  /* ---------- CUSTOMER INFO ---------- */
  #chat-window .chat-customer-info {
    padding: 10px 20px !important;
    background: #fafaf9 !important;
    border-bottom: 1px solid #e0e0e0 !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 9px !important;
    color: #888 !important;
    display: flex !important;
    justify-content: space-between !important;
    align-items: center !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-customer-info-left {
    display: flex !important;
    flex-direction: column !important;
    gap: 2px !important;
  }
  #chat-window .chat-switch-inline {
    background: none !important;
    border: none !important;
    color: #ccc !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 8px !important;
    cursor: pointer !important;
    padding: 0 !important;
    text-decoration: underline !important;
    text-underline-offset: 2px !important;
    transition: color 0.2s !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-switch-inline:hover { color: #888 !important; }

  /* ---------- TYPING INDICATOR ---------- */
  #chat-window .chat-typing-indicator {
    padding: 6px 20px !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 10px !important;
    color: #888 !important;
    font-style: italic !important;
    background: #fafaf9 !important;
    display: none;
  }

  /* ---------- FOOTER BRAND ---------- */
  #chat-window .chat-footer-brand {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    padding: 10px 0 !important;
    background: #fff !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 12px !important;
    letter-spacing: -0.01em !important;
    font-weight: 700 !important;
    color: #111 !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-footer-mark {
    display: inline-block !important;
    width: 10px !important;
    height: 10px !important;
    border-radius: 3px !important;
    background: #111 !important;
    animation: chat-footer-spin 4s ease-in-out infinite alternate !important;
  }
  @keyframes chat-footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #chat-window .chat-footer-mark { animation: none !important; }
  }

  /* ---------- MOBILE ---------- */
  @media (max-width: 480px) {
    #chat-window {
      width: 100vw !important;
      max-width: 100vw !important;
      height: 100vh !important;
      height: 100dvh !important;
      right: 0 !important;
      left: 0 !important;
      bottom: 0 !important;
      top: 0 !important;
      border-radius: 0 !important;
    }
    #live-chat-bubble { right: 16px !important; bottom: 16px !important; }
    #chat-window .order-lookup { padding: 24px 20px !important; }
  }
</style>

<!-- =========================================================
     WIDGET MARKUP
     ========================================================= -->
<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph-thin ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <span class="chat-header-title">JANEDORE Support</span>
    <button class="chat-header-close" onclick="toggleChat()">✕</button>
  </div>

  <div class="chat-customer-info" id="chat-customer-info" style="display:none;">
    <div class="chat-customer-info-left">
      <span id="chat-customer-name"></span>
      <span id="chat-customer-email"></span>
    </div>
    <button class="chat-switch-inline" onclick="clearChatSession()" title="Switch account">Switch</button>
  </div>

  <div class="chat-typing-indicator" id="chat-typing-indicator">JANEDORE is typing...</div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track Your Order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <input class="order-lookup-input" id="order-lookup-input"
           placeholder="Order number (e.g. ORD-12345)"
           onkeypress="if(event.key==='Enter')lookupOrder()">
    <button class="order-lookup-btn" onclick="lookupOrder()">Track</button>
    <div class="order-result" id="order-result"></div>
    <button class="back-to-chat-btn" onclick="backToChat()">← Back to chat</button>
  </div>

  <div class="chat-input-wrap" id="chat-input-wrap">
    <div class="chat-input-pill">
      <input class="chat-input" id="chat-input" placeholder="Type your message…"
             onkeypress="if(event.key==='Enter')sendChatMessage()"
             oninput="handleCustomerTyping()">
      <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">Send</button>
    </div>
  </div>

  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span>builtbypearl
  </div>
</div>
