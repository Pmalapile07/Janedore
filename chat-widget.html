<style>
  #live-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    width: 48px;
    height: 48px;
    border-radius: 0;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #live-chat-bubble:hover {
    transform: scale(1.05);
    box-shadow: 0 6px 24px rgba(0,0,0,0.25);
  }
  .chat-unread-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #c00;
    display: none;
  }
  #chat-window {
    position: fixed;
    bottom: 88px;
    right: 24px;
    width: 360px;
    max-width: calc(100vw - 32px);
    height: 460px;
    max-height: calc(100vh - 140px);
    background: #fff;
    border: 0.8px solid #e5e5e5;
    z-index: 998;
    display: none;
    flex-direction: column;
    box-shadow: 0 8px 40px rgba(0,0,0,0.08);
  }
  #chat-window.open { display: flex; }
  .chat-header {
    background: #fff;
    color: #111;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 0.5px solid #e5e5e5;
  }
  .chat-header-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
  }
  .chat-header-close {
    background: none;
    border: none;
    color: #888;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }
  .chat-header-close:hover { color: #111; }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .chat-email-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 32px 20px;
    flex: 1;
  }
  .chat-email-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #111;
    margin-bottom: 8px;
    text-align: center;
  }
  .chat-email-subtitle {
    font-size: 11px;
    font-weight: 300;
    color: #888;
    margin-bottom: 24px;
    text-align: center;
  }
  .chat-email-input {
    width: 100%;
    border: none;
    border-bottom: 0.5px solid #ccc;
    padding: 10px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 300;
    outline: none;
    margin-bottom: 20px;
    color: #111;
    background: transparent;
    text-align: center;
  }
  .chat-email-input:focus { border-color: #111; }
  .chat-email-input::placeholder { color: #aaa; }
  .chat-email-btn {
    background: none;
    border: none;
    border-bottom: 0.8px solid #111;
    padding: 8px 16px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    color: #111;
  }
  .chat-email-btn:hover { color: #555; border-color: #555; }
  .chat-email-error {
    color: #c00;
    font-size: 10px;
    margin-top: 12px;
    display: none;
  }
  .chat-options {
    display: flex;
    gap: 0;
    padding: 24px 18px;
    background: #fff;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
  }
  .chat-option-btn {
    background: none;
    color: #111;
    border: none;
    border-bottom: 0.8px solid #111;
    padding: 8px 4px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    margin-bottom: 20px;
  }
  .chat-option-btn:hover { color: #555; border-color: #555; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #fafaf9;
  }
  .chat-msg {
    max-width: 80%;
    padding: 10px 14px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    line-height: 1.5;
    letter-spacing: 0.03em;
    animation: chatFadeIn 0.3s ease;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.customer { align-self: flex-end; background: #111; color: #fff; }
  .chat-msg.admin { align-self: flex-start; background: #fff; color: #111; border: 0.8px solid #e5e5e5; }
  .chat-msg-time {
    font-size: 7px;
    opacity: 0.5;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'Manrope', sans-serif;
  }
  .chat-welcome {
    text-align: center;
    padding: 24px 12px;
    color: #888;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
  .chat-welcome strong { display: block; color: #111; font-size: 13px; margin-bottom: 8px; font-weight: 400; }
  .chat-input-wrap {
    display: flex;
    border-top: 0.5px solid #e5e5e5;
    padding: 12px 14px;
    gap: 8px;
    flex-shrink: 0;
    background: #fff;
  }
  .chat-input {
    flex: 1;
    border: none;
    border-bottom: 0.5px solid #ccc;
    padding: 8px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
    outline: none;
    background: transparent;
    color: #111;
  }
  .chat-input::placeholder { color: #aaa; }
  .chat-input:focus { border-color: #111; }
  .chat-send-btn {
    background: none;
    color: #111;
    border: none;
    border-bottom: 0.8px solid #111;
    padding: 8px 4px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .chat-send-btn:hover { color: #555; border-color: #555; }
  .order-lookup {
    padding: 24px 18px;
    background: #fff;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .order-lookup-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #111;
    margin-bottom: 8px;
  }
  .order-lookup-subtitle {
    font-size: 11px;
    font-weight: 300;
    color: #888;
    margin-bottom: 20px;
    text-align: center;
  }
  .order-lookup-input {
    width: 100%;
    border: none;
    border-bottom: 0.5px solid #ccc;
    padding: 10px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
    outline: none;
    margin-bottom: 20px;
    color: #111;
    background: transparent;
    text-align: center;
  }
  .order-lookup-input::placeholder { color: #aaa; }
  .order-lookup-input:focus { border-color: #111; }
  .order-lookup-btn {
    background: none;
    color: #111;
    border: none;
    border-bottom: 0.8px solid #111;
    padding: 8px 4px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .order-lookup-btn:hover { color: #555; border-color: #555; }
  .order-result {
    margin-top: 20px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: #888;
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.6;
    width: 100%;
  }
  .back-to-chat-btn {
    background: none;
    border: none;
    border-bottom: 0.5px solid #888;
    color: #888;
    padding: 6px 2px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    width: auto;
    margin-top: 24px;
    transition: all 0.2s;
  }
  .back-to-chat-btn:hover { color: #111; border-color: #111; }
  .chat-customer-info {
    padding: 8px 18px;
    background: #fafaf9;
    border-bottom: 0.5px solid #e5e5e5;
    font-family: 'Manrope', sans-serif;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
    display: flex;
    justify-content: space-between;
    flex-shrink: 0;
  }
  @media (max-width: 480px) {
    #chat-window { width: calc(100vw - 32px); right: 16px; left: 16px; }
    #live-chat-bubble { right: 16px; bottom: 16px; }
  }
</style>

<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph-thin ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <span class="chat-header-title">JANEDORE Support</span>
    <button class="chat-header-close" onclick="toggleChat()">✕</button>
  </div>
  
  <div class="chat-email-screen" id="chat-email-screen">
    <div class="chat-email-title">Welcome</div>
    <div class="chat-email-subtitle">Enter your email so we can assist you better</div>
    <input class="chat-email-input" id="chat-email-input" type="email" placeholder="your@email.com" onkeypress="if(event.key==='Enter')submitEmail()">
    <button class="chat-email-btn" onclick="submitEmail()">Continue</button>
    <div class="chat-email-error" id="chat-email-error">Please enter a valid email</div>
  </div>

  <div class="chat-options" id="chat-options" style="display:none;">
    <button class="chat-option-btn" onclick="startChat()">Chat</button>
    <button class="chat-option-btn" onclick="showOrderLookup()">Track Order</button>
  </div>

  <div class="chat-customer-info" id="chat-customer-info" style="display:none;">
    <span id="chat-customer-email"></span>
    <span id="chat-customer-stats"></span>
  </div>
  <div class="chat-messages" id="chat-messages" style="display:none;">
    <div class="chat-welcome"><strong>Welcome to JANEDORE</strong>Ask us anything — sizing, styling, shipping.</div>
  </div>

  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track Your Order</div>
    <div class="order-lookup-subtitle">Enter an order number or search by your email</div>
    <input class="order-lookup-input" id="order-lookup-input" placeholder="Order number (optional)" onkeypress="if(event.key==='Enter')lookupOrder()">
    <button class="order-lookup-btn" onclick="lookupOrder()">Track</button>
    <div class="order-result" id="order-result"></div>
    <button class="back-to-chat-btn" onclick="backToChatOptions()">← Back</button>
  </div>

  <div class="chat-input-wrap" id="chat-input-wrap" style="display:none;">
    <input class="chat-input" id="chat-input" placeholder="Type your message..." onkeypress="if(event.key==='Enter')sendChatMessage()">
    <button class="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>
</div>
