<!-- =========================================================
     JANEDORE CHAT WIDGET
     Full-screen + pill input + wider arrow Send button.
     Aesthetic only. JS hooks unchanged.
     ========================================================= -->
<style>
  /* ---------- CONTAINER SAFETY ---------- */
  #chat-container {
    position: static !important;
    transform: none !important;
    filter: none !important;
    perspective: none !important;
    contain: none !important;
    will-change: auto !important;
  }

  /* ---------- LAUNCHER BUBBLE ---------- */
  #live-chat-bubble {
    position: fixed !important;
    bottom: 24px !important;
    right: 24px !important;
    z-index: 9998 !important;
    width: 48px !important;
    height: 48px !important;
    border-radius: 0 !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    transition: all 0.3s cubic-bezier(0.25, 0.46, 0.45, 0.94) !important;
    box-shadow: 0 2px 12px rgba(0,0,0,0.15) !important;
  }
  #live-chat-bubble:hover {
    transform: translateY(-2px) !important;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25) !important;
  }
  body.chat-is-open #live-chat-bubble { display: none !important; }

  .chat-unread-dot {
    position: absolute !important;
    top: 3px !important;
    right: 3px !important;
    width: 8px !important;
    height: 8px !important;
    border-radius: 50% !important;
    background: #c00 !important;
    border: 2px solid #fff !important;
    display: none;
  }

  /* ---------- FULL SCREEN WINDOW ---------- */
  #chat-window {
    position: fixed !important;
    top: 0 !important;
    left: 0 !important;
    right: 0 !important;
    bottom: 0 !important;
    width: 100vw !important;
    max-width: 100vw !important;
    height: 100vh !important;
    height: 100dvh !important;
    max-height: 100vh !important;
    max-height: 100dvh !important;
    background: #fff !important;
    border: none !important;
    border-radius: 20px !important;
    z-index: 9999 !important;
    display: none;
    flex-direction: column !important;
    box-shadow: none !important;
    overflow: hidden !important;
  }
  #chat-window.open { display: flex !important; }

  /* ---------- HEADER ---------- */
  #chat-window .chat-header {
    background: #111 !important;
    color: #fff !important;
    padding: 18px 20px !important;
    display: flex !important;
    align-items: center !important;
    justify-content: flex-end !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-header-close {
    background: none !important;
    border: none !important;
    color: rgba(255,255,255,0.6) !important;
    cursor: pointer !important;
    font-size: 16px !important;
    padding: 0 !important;
    line-height: 1 !important;
    transition: color 0.2s !important;
  }
  #chat-window .chat-header-close:hover { color: #fff !important; }

  /* ---------- MESSAGES ---------- */
  #chat-window .chat-body {
    flex: 1 !important;
    overflow-y: auto !important;
    display: flex !important;
    flex-direction: column !important;
  }
  #chat-window .chat-messages {
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    padding: 20px !important;
    flex-direction: column !important;
    gap: 12px !important;
    background: #fafaf9 !important;
  }
  #chat-window .chat-msg {
    max-width: 80% !important;
    padding: 12px 16px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 300 !important;
    line-height: 1.6 !important;
    letter-spacing: 0.02em !important;
    animation: chatFadeIn 0.3s ease !important;
    border-radius: 16px !important;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  #chat-window .chat-msg.customer {
    align-self: flex-end !important;
    background: #111 !important;
    color: #fff !important;
    border-bottom-right-radius: 4px !important;
  }
  #chat-window .chat-msg.admin {
    align-self: flex-start !important;
    background: #fff !important;
    color: #111 !important;
    border: 1px solid #e0e0e0 !important;
    border-bottom-left-radius: 4px !important;
  }
  #chat-window .chat-msg-time {
    font-size: 10px !important;
    opacity: 0.5 !important;
    margin-top: 6px !important;
    font-family: 'Inter', sans-serif !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- PILL BUTTONS ---------- */
  #chat-window .chat-pill-btn {
    background: none !important;
    border: 0.5px solid currentColor !important;
    padding: 8px 18px !important;
    border-radius: 20px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    cursor: pointer !important;
    transition: all 0.2s !important;
  }
  #chat-window .chat-pill-btn:hover {
    background: #111 !important;
    color: #fff !important;
  }
  #chat-window .chat-pill-btn.filled {
    background: #111 !important;
    color: #fff !important;
    border: none !important;
  }
  #chat-window .chat-pill-btn.filled:hover { background: #333 !important; }

  /* ---------- WELCOME ---------- */
  #chat-window .chat-welcome {
    text-align: center !important;
    padding: 32px 16px !important;
    color: #888 !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }
  #chat-window .chat-welcome strong {
    display: block !important;
    color: #111 !important;
    font-size: 16px !important;
    margin-bottom: 12px !important;
    font-weight: 400 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- INPUT PILL (border above removed) ---------- */
  #chat-window .chat-input-wrap {
    align-items: center !important;
    padding: 14px 16px !important;
    gap: 0 !important;
    flex-shrink: 0 !important;
    background: #fff !important;
    border-top: none !important;
  }
  #chat-window .chat-input-pill {
    display: flex !important;
    align-items: center !important;
    width: 100% !important;
    background: #f4f4f2 !important;
    border-radius: 24px !important;
    padding: 4px 4px 4px 18px !important;
    transition: background 0.2s !important;
  }
  #chat-window .chat-input-pill:focus-within {
    background: #eeeeec !important;
  }
  #chat-window .chat-input {
    flex: 1 !important;
    border: none !important;
    outline: none !important;
    background: transparent !important;
    padding: 10px 8px 10px 0 !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #111 !important;
    border-bottom: none !important;
  }
  #chat-window .chat-input::placeholder { color: #aaa !important; }

  /* Send button — wider, arrow icon, inside pill, far right */
  #chat-window .chat-send-btn {
    position: static !important;
    top: auto !important;
    right: auto !important;
    bottom: auto !important;
    left: auto !important;
    flex-shrink: 0 !important;
    width: 52px !important;
    height: 36px !important;
    min-width: 52px !important;
    min-height: 36px !important;
    border-radius: 18px !important;
    background: #111 !important;
    color: #fff !important;
    border: none !important;
    padding: 0 !important;
    cursor: pointer !important;
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    font-size: 16px !important;
    transition: background 0.2s, transform 0.2s !important;
  }
  #chat-window .chat-send-btn i {
    font-size: 16px !important;
    line-height: 1 !important;
  }
  #chat-window .chat-send-btn:hover { background: #333 !important; }
  #chat-window .chat-send-btn:active { transform: scale(0.96) !important; }
  #chat-window .chat-send-btn.wide {
    width: auto !important;
    min-width: auto !important;
    padding: 0 18px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
  }

  /* ---------- ORDER LOOKUP ---------- */
  #chat-window .order-lookup {
    padding: 32px 28px !important;
    background: #fff !important;
    flex: 1 !important;
    min-height: 0 !important;
    overflow-y: auto !important;
    flex-direction: column !important;
    align-items: center !important;
    justify-content: center !important;
  }
  #chat-window .order-lookup-title {
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 400 !important;
    letter-spacing: 0.02em !important;
    color: #111 !important;
    margin-bottom: 12px !important;
  }
  #chat-window .order-lookup-subtitle {
    font-family: 'Inter', sans-serif !important;
    font-size: 11px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #888 !important;
    margin-bottom: 28px !important;
    text-align: center !important;
  }

  #chat-window .order-result {
    margin-top: 24px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 14px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #888 !important;
    text-align: center !important;
    line-height: 1.6 !important;
    width: 100% !important;
  }
  /* ---------- TYPING INDICATOR ---------- */
  #chat-window .chat-typing-indicator {
    padding: 6px 20px !important;
    font-family: 'Inter', sans-serif !important;
    font-size: 12px !important;
    font-weight: 300 !important;
    letter-spacing: 0.02em !important;
    color: #888 !important;
    font-style: italic !important;
    background: #fafaf9 !important;
    display: none;
  }

  /* ---------- FOOTER BRAND ---------- */
  #chat-window .chat-footer-brand {
    display: flex !important;
    align-items: center !important;
    justify-content: center !important;
    gap: 6px !important;
    padding: 10px 0 !important;
    background: #fff !important;
    font-family: 'Manrope', sans-serif !important;
    font-size: 12px !important;
    letter-spacing: -0.01em !important;
    font-weight: 700 !important;
    color: #111 !important;
    flex-shrink: 0 !important;
  }
  #chat-window .chat-footer-brand a {
    color: inherit !important;
    text-decoration: none !important;
  }
  #chat-window .chat-footer-mark {
    display: inline-block !important;
    width: 10px !important;
    height: 10px !important;
    border-radius: 3px !important;
    background: #111 !important;
    animation: chat-footer-spin 4s ease-in-out infinite alternate !important;
  }
  @keyframes chat-footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    #chat-window .chat-footer-mark { animation: none !important; }
  }
</style>

<!-- =========================================================
     WIDGET MARKUP
     ========================================================= -->
<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <button class="chat-header-close" id="chat-header-btn" onclick="handleHeaderButtonClick()">
      <i class="ph-light ph-x" id="chat-header-icon"></i>
    </button>
  </div>

  <div class="chat-typing-indicator" id="chat-typing-indicator">JANEDORE is typing...</div>

  <div class="chat-messages" id="chat-messages"></div>

  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track your order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <div class="chat-input-pill">
      <input class="chat-input" id="order-lookup-input"
             placeholder="Order number (e.g. ORD-12345)"
             onkeypress="if(event.key==='Enter')lookupOrder()">
      <button class="chat-send-btn wide" id="order-track-btn" onclick="lookupOrder()">Track</button>
    </div>
    <div class="order-result" id="order-result"></div>
  </div>

  <div class="chat-input-wrap" id="chat-input-wrap" style="display:flex;">
    <div class="chat-input-pill">
      <input class="chat-input" id="chat-input" placeholder="Type your message…"
             onkeypress="if(event.key==='Enter')sendChatMessage()"
             oninput="handleCustomerTyping()">
      <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">
        <i class="ph-light ph-arrow-up"></i>
      </button>
    </div>
  </div>

  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span><a href="https://builtbypearl.netlify.app" target="_blank" rel="noopener">builtbypearl</a>
  </div>
</div>
