<style>
  #live-chat-bubble {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 999;
    width: 50px;
    height: 50px;
    border-radius: 2px;
    background: #211d1a;
    color: #faf8f4;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    transition: transform 0.2s, box-shadow 0.2s;
  }
  #live-chat-bubble:hover {
    transform: scale(1.05);
    box-shadow: 0 8px 26px rgba(33,29,26,0.3);
  }
  .chat-unread-dot {
    position: absolute;
    top: 2px;
    right: 2px;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #b5714f;
    display: none;
  }
  #chat-window {
    position: fixed;
    bottom: 88px;
    right: 24px;
    width: 360px;
    max-width: calc(100vw - 32px);
    height: 460px;
    max-height: calc(100vh - 140px);
    background: #faf8f4;
    border: 0.8px solid rgba(33,29,26,0.14);
    z-index: 998;
    display: none;
    flex-direction: column;
    box-shadow: 0 10px 44px rgba(33,29,26,0.14);
  }
  #chat-window.open { display: flex; }
  .chat-header {
    background: #faf8f4;
    color: #211d1a;
    padding: 18px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-shrink: 0;
    border-bottom: 0.5px solid rgba(33,29,26,0.14);
  }
  .chat-header-title {
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    color: #211d1a;
  }
  .chat-header-close {
    background: none;
    border: none;
    color: #8a8378;
    cursor: pointer;
    font-size: 16px;
    padding: 0;
    line-height: 1;
    transition: color 0.2s;
  }
  .chat-header-close:hover { color: #b5714f; }
  .chat-body {
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  .chat-email-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 36px 22px;
    flex: 1;
  }
  .chat-email-title {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 24px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: #211d1a;
    margin-bottom: 10px;
    text-align: center;
  }
  .chat-email-subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.02em;
    color: #8a8378;
    margin-bottom: 28px;
    text-align: center;
  }
  .chat-email-input {
    width: 100%;
    border: none;
    border-bottom: 0.5px solid rgba(33,29,26,0.22);
    padding: 10px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    font-weight: 300;
    outline: none;
    margin-bottom: 16px;
    color: #211d1a;
    background: transparent;
    text-align: center;
  }
  .chat-email-input:focus { border-color: #b5714f; }
  .chat-email-input::placeholder { color: #b3ab9e; }
  .chat-email-btn {
    background: none;
    border: none;
    border-bottom: 0.8px solid #211d1a;
    padding: 8px 16px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    color: #211d1a;
  }
  .chat-email-btn:hover { color: #b5714f; border-color: #b5714f; }
  .chat-email-error {
    color: #b5714f;
    font-size: 10px;
    margin-top: 12px;
    display: none;
  }
  .chat-options {
    display: flex;
    gap: 0;
    padding: 24px 18px;
    background: #faf8f4;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    flex: 1;
  }
  .chat-option-btn {
    background: none;
    color: #211d1a;
    border: none;
    border-bottom: 0.8px solid #211d1a;
    padding: 8px 4px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
    text-align: center;
    margin-bottom: 20px;
  }
  .chat-option-btn:hover { color: #b5714f; border-color: #b5714f; }
  /* Switch account — inherits the back-btn styling */
  .chat-switch-btn {
    background: none;
    border: none;
    border-bottom: 0.5px solid rgba(33,29,26,0.3);
    color: #b3ab9e;
    padding: 5px 2px;
    font-family: 'Manrope', sans-serif;
    font-size: 8px;
    letter-spacing: 0.12em;
    font-weight: 400;
    text-transform: uppercase;
    cursor: pointer;
    margin-top: 8px;
    transition: all 0.2s;
  }
  .chat-switch-btn:hover { color: #8a8378; border-color: #8a8378; }
  .chat-messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px 18px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    background: #f4f1ea;
  }
  .chat-msg {
    max-width: 80%;
    padding: 10px 14px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    line-height: 1.5;
    letter-spacing: 0.03em;
    animation: chatFadeIn 0.3s ease;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.customer { align-self: flex-end; background: #211d1a; color: #faf8f4; }
  .chat-msg.admin { align-self: flex-start; background: #faf8f4; color: #211d1a; border: 0.8px solid rgba(33,29,26,0.14); }
  .chat-msg-time {
    font-size: 7px;
    opacity: 0.55;
    margin-top: 4px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    font-family: 'Manrope', sans-serif;
  }
  .chat-welcome {
    text-align: center;
    padding: 28px 14px;
    color: #8a8378;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
  }
  .chat-welcome strong {
    display: block;
    color: #211d1a;
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 18px;
    letter-spacing: -0.01em;
    margin-bottom: 10px;
  }
  .chat-input-wrap {
    display: flex;
    border-top: 0.5px solid rgba(33,29,26,0.14);
    padding: 12px 14px;
    gap: 8px;
    flex-shrink: 0;
    background: #faf8f4;
  }
  .chat-input {
    flex: 1;
    border: none;
    border-bottom: 0.5px solid rgba(33,29,26,0.22);
    padding: 8px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
    outline: none;
    background: transparent;
    color: #211d1a;
  }
  .chat-input::placeholder { color: #b3ab9e; }
  .chat-input:focus { border-color: #b5714f; }
  .chat-send-btn {
    background: none;
    color: #211d1a;
    border: none;
    border-bottom: 0.8px solid #211d1a;
    padding: 8px 4px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    transition: all 0.2s;
  }
  .chat-send-btn:hover { color: #b5714f; border-color: #b5714f; }
  .order-lookup {
    padding: 24px 18px;
    background: #faf8f4;
    flex: 1;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  .order-lookup-title {
    font-family: 'Fraunces', Georgia, serif;
    font-style: italic;
    font-weight: 500;
    font-size: 20px;
    letter-spacing: -0.01em;
    text-transform: none;
    color: #211d1a;
    margin-bottom: 8px;
  }
  .order-lookup-subtitle {
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: #8a8378;
    margin-bottom: 20px;
    text-align: center;
  }
  .order-lookup-input {
    width: 100%;
    border: none;
    border-bottom: 0.5px solid rgba(33,29,26,0.22);
    padding: 10px 0;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    letter-spacing: 0.03em;
    outline: none;
    margin-bottom: 20px;
    color: #211d1a;
    background: transparent;
    text-align: center;
  }
  .order-lookup-input::placeholder { color: #b3ab9e; }
  .order-lookup-input:focus { border-color: #b5714f; }
  .order-lookup-btn {
    background: none;
    color: #211d1a;
    border: none;
    border-bottom: 0.8px solid #211d1a;
    padding: 8px 4px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    transition: all 0.2s;
  }
  .order-lookup-btn:hover { color: #b5714f; border-color: #b5714f; }
  .order-result {
    margin-top: 20px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    font-weight: 300;
    color: #8a8378;
    text-align: center;
    letter-spacing: 0.03em;
    line-height: 1.6;
    width: 100%;
  }
  .back-to-chat-btn {
    background: none;
    border: none;
    border-bottom: 0.5px solid #8a8378;
    color: #8a8378;
    padding: 6px 2px;
    font-family: 'Manrope', sans-serif;
    font-size: var(--ui-font-size, 9px);
    letter-spacing: var(--ui-letter-spacing, 0.2em);
    font-weight: var(--ui-font-weight, 400);
    text-transform: uppercase;
    cursor: pointer;
    width: auto;
    margin-top: 24px;
    transition: all 0.2s;
  }
  .back-to-chat-btn:hover { color: #b5714f; border-color: #b5714f; }
  .chat-customer-info {
    padding: 8px 18px;
    background: #f4f1ea;
    border-bottom: 0.5px solid rgba(33,29,26,0.14);
    font-family: 'Manrope', sans-serif;
    font-size: 8px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #8a8378;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-shrink: 0;
  }
  .chat-customer-info-left {
    display: flex;
    flex-direction: column;
    gap: 1px;
  }
  /* Switch session link inside customer info bar */
  .chat-switch-inline {
    background: none;
    border: none;
    color: #c9c1b3;
    font-family: 'Manrope', sans-serif;
    font-size: 7px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
    padding: 0;
    text-decoration: underline;
    text-underline-offset: 2px;
    transition: color 0.2s;
    flex-shrink: 0;
  }
  .chat-switch-inline:hover { color: #b5714f; }
  .chat-typing-indicator {
    padding: 4px 18px;
    font-family: 'Manrope', sans-serif;
    font-size: 8px;
    color: #8a8378;
    font-style: italic;
    background: #f4f1ea;
    display: none;
  }
  /* Bottom-of-widget branding — always visible, sits under whichever screen is active */
  .chat-footer-brand {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 10px 0;
    border-top: 0.5px solid rgba(33,29,26,0.14);
    background: #faf8f4;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: -0.01em;
    font-weight: 700;
    text-transform: none;
    color: #211d1a;
    flex-shrink: 0;
  }
  .chat-footer-mark {
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 3px;
    background: #211d1a;
    animation: chat-footer-spin 4s ease-in-out infinite alternate;
  }
  @keyframes chat-footer-spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(180deg); }
  }
  @media (prefers-reduced-motion: reduce) {
    .chat-footer-mark { animation: none; }
  }
  @media (max-width: 480px) {
    #chat-window {
      width: calc(100vw - 32px);
      right: 16px;
      left: 16px;
      height: 420px;
    }
    #live-chat-bubble { right: 16px; bottom: 16px; }
    .chat-email-screen { padding: 24px 16px; }
    .chat-options { padding: 18px 16px; }
    .chat-option-btn { margin-bottom: 16px; }
    .order-lookup { padding: 18px 16px; }
  }
</style>

<button id="live-chat-bubble" onclick="toggleChat()">
  <i class="ph-thin ph-chat"></i>
  <span class="chat-unread-dot" id="chat-unread-dot"></span>
</button>

<div id="chat-window">
  <div class="chat-header">
    <span class="chat-header-title">JANEDORE Support</span>
    <button class="chat-header-close" onclick="toggleChat()">✕</button>
  </div>

  <!-- Email entry screen -->
  <div class="chat-email-screen" id="chat-email-screen">
    <div class="chat-email-title">Welcome</div>
    <div class="chat-email-subtitle">Enter your details so we can assist you better</div>
    <input class="chat-email-input" id="chat-name-input" type="text" placeholder="Your name"
           onkeypress="if(event.key==='Enter')document.getElementById('chat-email-input').focus()">
    <input class="chat-email-input" id="chat-email-input" type="email" placeholder="your@email.com"
           onkeypress="if(event.key==='Enter')submitEmail()">
    <button class="chat-email-btn" onclick="submitEmail()">Continue</button>
    <div class="chat-email-error" id="chat-email-error">Please enter a valid email</div>
  </div>

  <!-- Options screen -->
  <div class="chat-options" id="chat-options" style="display:none;">
    <button class="chat-option-btn" onclick="startChat()">Chat with Us</button>
    <button class="chat-option-btn" onclick="showOrderLookup()">Track Order</button>
    <button class="chat-switch-btn" onclick="clearChatSession()">Switch Account</button>
  </div>

  <!-- Customer info bar (shown during active chat) -->
  <div class="chat-customer-info" id="chat-customer-info" style="display:none;">
    <div class="chat-customer-info-left">
      <span id="chat-customer-name"></span>
      <span id="chat-customer-email"></span>
    </div>
    <button class="chat-switch-inline" onclick="clearChatSession()" title="Switch account">Switch</button>
  </div>

  <!-- Typing indicator -->
  <div class="chat-typing-indicator" id="chat-typing-indicator">JANEDORE is typing...</div>

  <!-- Messages -->
  <div class="chat-messages" id="chat-messages" style="display:none;">
    <div class="chat-welcome">
      <strong>Welcome to JANEDORE</strong>Ask us anything — sizing, styling, shipping.
    </div>
  </div>

  <!-- Order lookup screen -->
  <div class="order-lookup" id="order-lookup" style="display:none;">
    <div class="order-lookup-title">Track Your Order</div>
    <div class="order-lookup-subtitle">Enter your order number to check its status</div>
    <input class="order-lookup-input" id="order-lookup-input"
           placeholder="Order number (e.g. ORD-12345)"
           onkeypress="if(event.key==='Enter')lookupOrder()">
    <button class="order-lookup-btn" onclick="lookupOrder()">Track</button>
    <div class="order-result" id="order-result"></div>
    <button class="back-to-chat-btn" onclick="backToChatOptions()">← Back</button>
  </div>

  <!-- Message input -->
  <div class="chat-input-wrap" id="chat-input-wrap" style="display:none;">
    <input class="chat-input" id="chat-input" placeholder="Type your message…"
           onkeypress="if(event.key==='Enter')sendChatMessage()"
           oninput="handleCustomerTyping()">
    <button class="chat-send-btn" id="chat-send-btn" onclick="sendChatMessage()">Send</button>
  </div>

  <!-- builtbypearl branding -->
  <div class="chat-footer-brand">
    <span class="chat-footer-mark"></span>builtbypearl
  </div>
</div>
