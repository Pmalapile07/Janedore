<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JANEDORE Debugger</title>
  <link rel="stylesheet" href="styles.css">
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="firebase.js"></script>
  <script src="vendors.js"></script>
  <script src="cart.js"></script>
  <script src="wishlist.js"></script>
  <script src="navigation.js"></script>
  <script src="search.js"></script>
  <script src="modals.js"></script>
  <script src="product-detail.js"></script>
  <script src="sticky-bar.js"></script>
  <script src="collection.js"></script>
  <script src="sliders.js"></script>
  <script src="footer.js"></script>
  <script src="app.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #0a0a0a; color: #e0e0e0; padding: 16px; font-size: 13px; }
    h1 { font-size: 15px; letter-spacing: 0.2em; text-transform: uppercase; margin-bottom: 16px; color: #fff; text-align: center; }
    .section { background: #1a1a1a; border: 1px solid #2a2a2a; padding: 12px; margin-bottom: 10px; border-radius: 6px; }
    .section h2 { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: #888; margin-bottom: 8px; }
    .pass { color: #4ade80; }
    .fail { color: #f87171; }
    .warn { color: #fbbf24; }
    .info { color: #60a5fa; }
    .row { display: flex; justify-content: space-between; padding: 3px 0; font-size: 11px; border-bottom: 1px solid #1f1f1f; flex-wrap: wrap; gap: 4px; }
    .row:last-child { border-bottom: none; }
    button { background: #fff; color: #000; border: none; padding: 12px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; cursor: pointer; border-radius: 4px; width: 100%; margin-top: 6px; font-weight: 600; }
    button:active { background: #ccc; }
    .big-status { text-align: center; padding: 20px; font-size: 16px; font-weight: 700; }
    .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
    .badge-ok { background: #166534; color: #4ade80; }
    .badge-bad { background: #7f1d1d; color: #f87171; }
  </style>
</head>
<body>
  <h1>Janedore Debugger</h1>
  <div class="big-status" id="overall-status">Loading...</div>

  <div class="section">
    <h2>Global Variables</h2>
    <div id="globals"></div>
  </div>

  <div class="section">
    <h2>Products (PRODUCTS)</h2>
    <div id="products-info"></div>
  </div>

  <div class="section">
    <h2>DOM Elements</h2>
    <div id="dom-info"></div>
  </div>

  <div class="section">
    <h2>Critical Functions</h2>
    <div id="funcs-info"></div>
  </div>

  <div class="section">
    <h2>Page State</h2>
    <div id="page-info"></div>
  </div>

  <button onclick="location.reload()">Refresh Checks</button>
  <button onclick="window.location.href='index.html'" style="background:#333;color:#fff;">Go to Main Site</button>

  <script>
    setTimeout(() => {
      const results = { pass: 0, fail: 0, warn: 0 };
      
      // Globals
      const globalsEl = document.getElementById('globals');
      const checks = [
        ['DOM', typeof DOM],
        ['S', typeof S],
        ['PRODUCTS', typeof PRODUCTS],
        ['CURRENCIES', typeof CURRENCIES],
        ['PLACEHOLDER_IMAGE', typeof PLACEHOLDER_IMAGE],
        ['db', typeof db],
        ['firebase', typeof firebase]
      ];
      let ghtml = '';
      checks.forEach(([name, type]) => {
        const ok = type !== 'undefined';
        if (ok) results.pass++; else results.fail++;
        ghtml += `<div class="row"><span>${name}</span><span class="${ok ? 'pass' : 'fail'}">${ok ? '✅ Defined' : '❌ Undefined'}</span></div>`;
      });
      globalsEl.innerHTML = ghtml;

      // Products
      const prodEl = document.getElementById('products-info');
      if (typeof PRODUCTS !== 'undefined') {
        if (PRODUCTS.length === 0) {
          prodEl.innerHTML = '<span class="warn">⚠️ PRODUCTS array is empty. Firebase might have failed, or fetchProducts() returned nothing.</span>';
          results.warn++;
        } else {
          const activeCount = PRODUCTS.filter(p => p.status === 'active').length;
          prodEl.innerHTML = `<span class="pass">✅ ${PRODUCTS.length} total products (${activeCount} active)</span>`;
          PRODUCTS.slice(0, 5).forEach(p => {
            prodEl.innerHTML += `<div class="row"><span>${p.name || 'unnamed'}</span><span>${p.status} | ${p.category}</span></div>`;
          });
          if (PRODUCTS.length > 5) prodEl.innerHTML += `<div class="row"><span>...</span><span>+${PRODUCTS.length - 5} more</span></div>`;
          results.pass++;
        }
      } else {
        prodEl.innerHTML = '<span class="fail">❌ PRODUCTS is undefined</span>';
        results.fail++;
      }

      // DOM
      const domEl = document.getElementById('dom-info');
      const domIds = ['arrivalsGrid','allProductsGrid','productDetail','cartBody','cartFoot','mainNav','heroBg','homepageNewsletterSection','searchOverlay'];
      let dhtml = '';
      domIds.forEach(id => {
        const el = DOM && DOM[id];
        if (el) results.pass++; else results.fail++;
        dhtml += `<div class="row"><span>DOM.${id}</span><span class="${el ? 'pass' : 'fail'}">${el ? '✅ Found' : '❌ NULL'}</span></div>`;
      });
      domEl.innerHTML = dhtml;

      // Functions
      const funcsEl = document.getElementById('funcs-info');
      const funcs = ['buildArrivals','productCardHome','merchandiseProducts','renderAllProducts','buildFooter','buildCategoriesSlider','buildNewsletterSection','renderCartPage','renderWishlistPage','createStickyBar','toggleGrid','openCart','addToCart','navigateTo','goToProduct','selectVariant'];
      let fhtml = '';
      funcs.forEach(fn => {
        const exists = typeof window[fn] === 'function';
        if (exists) results.pass++; else results.fail++;
        fhtml += `<div class="row"><span>${fn}()</span><span class="${exists ? 'pass' : 'fail'}">${exists ? '✅' : '❌ MISSING'}</span></div>`;
      });
      funcsEl.innerHTML = fhtml;

      // Page state
      const pageEl = document.getElementById('page-info');
      if (typeof S !== 'undefined') {
        pageEl.innerHTML = `
          <div class="row"><span>currentPage</span><span class="info">${S.currentPage}</span></div>
          <div class="row"><span>cart items</span><span class="info">${S.cart.length}</span></div>
          <div class="row"><span>wishlist items</span><span class="info">${S.wishlist.length}</span></div>
          <div class="row"><span>URL hash</span><span class="info">${window.location.hash || '(none)'}</span></div>`;
      } else {
        pageEl.innerHTML = '<span class="fail">❌ S object is undefined</span>';
      }

      // Overall
      const total = results.pass + results.fail + results.warn;
      const statusEl = document.getElementById('overall-status');
      if (results.fail === 0 && results.warn === 0) {
        statusEl.innerHTML = '<span class="pass">✅ ALL CHECKS PASSED</span><br><small style="color:#888;">Site should be working. If products still dont show, the issue is timing (Firebase slow to respond).</small>';
      } else if (results.fail > 0) {
        statusEl.innerHTML = `<span class="fail">❌ ${results.fail} FAILURES</span> <span class="warn">${results.warn} warnings</span> <span class="pass">${results.pass} passed</span><br><small style="color:#888;">Scroll down to see what's broken.</small>`;
      } else {
        statusEl.innerHTML = `<span class="warn">⚠️ ${results.warn} WARNINGS</span> <span class="pass">${results.pass} passed</span><br><small style="color:#888;">Mostly working — warnings may be timing-related.</small>`;
      }
    }, 2000);
  </script>
</body>
</html>
