<!-- ================================================================
     JANEDORE — CHAT WIDGET (markup + styles only)
     Drop into chat-container via fetch(), as before.
     No launcher button here — index.html already provides
     #live-chat-bubble, so this file only owns #chat-window.
     ================================================================ -->
<style>
  #chat-window {
    position: fixed;
    bottom: 96px;
    right: 24px;
    width: 380px;
    max-width: calc(100vw - 32px);
    height: 600px;
    max-height: calc(100vh - 120px);
    background: #fff;
    border-radius: 14px;
    box-shadow: 0 12px 40px rgba(0,0,0,0.16);
    display: none;
    flex-direction: column;
    overflow: hidden;
    z-index: 9999;
    font-family: 'Manrope', sans-serif;
  }
  #chat-window.open { display: flex; }

  .chat-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 18px;
    border-bottom: 0.5px solid #eaeaea;
    flex-shrink: 0;
  }
  .chat-header-title {
    font-size: 13px;
    font-weight: 500;
    letter-spacing: 0.05em;
    color: #111;
  }
  .chat-header-sub {
    font-size: 10.5px;
    color: #888;
    margin-top: 2px;
    font-weight: 300;
  }
  .chat-header-close {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    padding: 4px;
    line-height: 1;
  }
  .chat-header-close:hover { color: #111; }

  /* Messages panel */
  #chat-messages {
    flex: 1;
    padding: 16px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    background: #fbfbfb;
  }
  .chat-msg {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 12.5px;
    line-height: 1.55;
    font-weight: 300;
    word-wrap: break-word;
    position: relative;
    animation: chatFadeIn 0.25s ease;
  }
  @keyframes chatFadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .chat-msg.customer {
    background: #111;
    color: #fff;
    align-self: flex-end;
    border-bottom-right-radius: 4px;
  }
  .chat-msg.admin {
    background: #f0f0f0;
    color: #111;
    align-self: flex-start;
    border-bottom-left-radius: 4px;
  }
  .chat-msg-time { font-size: 9px; opacity: 0.55; margin-top: 4px; }

  /* Quick action button (Track Order) — sits inline in the message flow */
  .chat-quick-action {
    align-self: flex-start;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 14px;
    background: #fafafa;
    border: 0.5px solid #e5e5e5;
    border-radius: 10px;
    cursor: pointer;
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    font-weight: 400;
    color: #111;
    transition: background 0.15s ease, border-color 0.15s ease;
  }
  .chat-quick-action:hover { background: #f0f0f0; border-color: #ccc; }
  .chat-quick-action i { font-size: 18px; color: #111; }

  /* Identify card — non-blocking, sits inline in the message flow */
  .chat-identify-card {
    align-self: stretch;
    background: #fafafa;
    border: 0.5px solid #e5e5e5;
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .chat-identify-label {
    font-size: 10.5px;
    color: #888;
    font-weight: 300;
    line-height: 1.5;
    margin-bottom: 2px;
  }
  .chat-identify-card input {
    padding: 10px 12px;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    background: #fff;
    outline: none;
  }
  .chat-identify-card input:focus { border-color: #111; }
  .chat-identify-actions {
    display: flex;
    gap: 8px;
    margin-top: 2px;
  }
  .chat-identify-share {
    flex: 1;
    padding: 9px 14px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 11px;
    letter-spacing: 0.04em;
    font-weight: 500;
    cursor: pointer;
    text-transform: uppercase;
  }
  .chat-identify-share:hover { background: #333; }
  .chat-identify-skip {
    background: none;
    border: none;
    color: #999;
    font-family: 'Manrope', sans-serif;
    font-size: 10.5px;
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    padding: 9px 4px;
  }
  .chat-identify-skip:hover { color: #111; }

  .chat-welcome {
    text-align: center;
    font-size: 12px;
    color: #666;
    line-height: 1.7;
    padding: 30px 12px;
    font-weight: 300;
  }
  .chat-welcome strong {
    display: block;
    font-size: 13px;
    font-weight: 500;
    color: #111;
    margin-bottom: 6px;
    letter-spacing: 0.03em;
  }

  /* Customer info bar */
  #chat-customer-info {
    padding: 8px 16px;
    border-top: 0.5px solid #eaeaea;
    background: #fafafa;
    display: flex;
    justify-content: space-between;
    font-size: 10px;
    color: #888;
    flex-shrink: 0;
  }

  /* Typing indicator */
  #chat-typing-indicator {
    padding: 6px 18px;
    font-size: 10.5px;
    color: #888;
    font-style: italic;
    flex-shrink: 0;
  }

  /* Input bar */
  #chat-input-wrap {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 14px;
    border-top: 0.5px solid #eaeaea;
    background: #fff;
    flex-shrink: 0;
  }
  #chat-input {
    flex: 1;
    padding: 10px 14px;
    border: 0.5px solid #ddd;
    border-radius: 20px;
    font-family: 'Manrope', sans-serif;
    font-size: 12.5px;
    background: #fafafa;
    outline: none;
  }
  #chat-input:focus { border-color: #111; background: #fff; }
  #chat-send-btn {
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: #111;
    color: #fff;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }
  #chat-send-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  #chat-send-btn i { font-size: 16px; }

  /* Order lookup screen */
  #order-lookup {
    display: none;
    flex-direction: column;
    height: 100%;
  }
  .chat-back-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-size: 18px;
    color: #666;
    padding: 4px;
    line-height: 1;
  }
  .chat-back-btn:hover { color: #111; }
  .chat-body {
    flex: 1;
    padding: 20px 18px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    overflow-y: auto;
  }
  .chat-field { display: flex; flex-direction: column; gap: 6px; }
  .chat-field label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: #888;
  }
  .chat-field input {
    padding: 12px 14px;
    border: 0.5px solid #ddd;
    border-radius: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 13px;
    background: #fafafa;
    outline: none;
  }
  .chat-field input:focus { border-color: #111; background: #fff; }
  .chat-primary-btn {
    padding: 13px 18px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 8px;
    font-family: 'Manrope', sans-serif;
    font-size: 12px;
    letter-spacing: 0.06em;
    font-weight: 500;
    cursor: pointer;
    text-transform: uppercase;
  }
  .chat-primary-btn:hover { background: #333; }
  #order-result { font-size: 12px; line-height: 1.6; }

  @media (max-width: 480px) {
    #chat-window {
      bottom: 0; right: 0; left: 0;
      width: 100%; max-width: 100%;
      height: 100%; max-height: 100%;
      border-radius: 0;
    }
  }
</style>

<div id="chat-window" role="dialog" aria-label="Chat with Janedore">

  <div class="chat-header">
    <div>
      <div class="chat-header-title">JANEDORE</div>
      <div class="chat-header-sub">We're here to help</div>
    </div>
    <button class="chat-header-close" onclick="toggleChat()" aria-label="Close">
      <i class="ph-light ph-x"></i>
    </button>
  </div>

  <div id="chat-customer-info" style="display:none;">
    <span id="chat-customer-name"></span>
    <span id="chat-customer-email"></span>
  </div>

  <div id="chat-messages"></div>
  <div id="chat-typing-indicator" style="display:none;">JANEDORE is typing...</div>

  <div id="chat-input-wrap">
    <input id="chat-input" type="text" placeholder="Type your message..." autocomplete="off"
           oninput="handleCustomerTyping()"
           onkeydown="if(event.key==='Enter'){event.preventDefault();sendChatMessage();}">
    <button id="chat-send-btn" onclick="sendChatMessage()" aria-label="Send">
      <i class="ph-light ph-paper-plane-tilt"></i>
    </button>
  </div>

  <!-- Order lookup screen -->
  <div id="order-lookup">
    <div class="chat-header">
      <button class="chat-back-btn" onclick="backToChat()" aria-label="Back">
        <i class="ph-light ph-arrow-left"></i>
      </button>
      <div>
        <div class="chat-header-title">Track your order</div>
        <div class="chat-header-sub">Enter your order number</div>
      </div>
      <button class="chat-header-close" onclick="toggleChat()" aria-label="Close">
        <i class="ph-light ph-x"></i>
      </button>
    </div>
    <div class="chat-body">
      <div class="chat-field">
        <input id="order-lookup-input" type="text" placeholder="e.g. JD-10234" autocomplete="off">
      </div>
      <button class="chat-primary-btn" onclick="lookupOrder()">Look up order</button>
      <div id="order-result"></div>
    </div>
  </div>

</div>
