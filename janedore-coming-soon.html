<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:     #FFFFFF;
    --ink:    #111111;
    --text:   #111111;
    --muted:  #6B6B6B;
    --border: #E5E5E5;
    --green:  #b8cc87;
  }

  html { font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; font-size: 16px; }
  body { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; background: var(--bg); color: var(--text); }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

  /* Header: the shop's black bar, wordmark left, preview password (•••) right. */
  .site-header { position: sticky; top: 0; z-index: 10; background: var(--ink); height: 60px; padding: 0 12px 0 20px; padding-top: env(safe-area-inset-top, 0px); display: flex; align-items: center; justify-content: space-between; }
  .header-logo-text { font-family: 'Unbounded', Helvetica, Arial, sans-serif; font-size: 17px; font-weight: 400; letter-spacing: 0.12em; color: #fff; }
  .header-more { width: 44px; height: 44px; display: inline-flex; align-items: center; justify-content: center; background: none; border: none; cursor: pointer; }
  .header-more svg { width: 22px; height: 22px; fill: #fff; }

  .preview-panel { background: #fff; border-bottom: 1px solid var(--border); }
  .preview-panel[hidden] { display: none; }
  .preview-inner { max-width: 440px; margin: 0 auto; padding: 20px; }
  .preview-label { display: block; font-size: 13px; font-weight: 500; margin-bottom: 10px; }

  .main-content { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 72px 20px 96px; }
  .headline { font-size: 34px; font-weight: 600; line-height: 1.15; letter-spacing: -0.02em; margin-bottom: 14px; }
  .subhead { font-size: 15px; font-weight: 400; line-height: 1.6; color: var(--muted); max-width: 380px; margin-bottom: 32px; }

  .signup-wrapper { width: 100%; max-width: 440px; }
  .signup-row { display: flex; width: 100%; }
  .signup-input { flex: 1; min-width: 0; height: 50px; padding: 0 16px; border: 1px solid #d4d4d4; border-right: none; border-radius: 0; font-family: inherit; font-size: 15px; color: var(--text); background: #fff; outline: none; -webkit-appearance: none; }
  .signup-input:focus { border-color: var(--ink); }
  .signup-input::placeholder { color: #9a9a9a; }
  .signup-submit { flex: 0 0 auto; min-width: 116px; height: 50px; padding: 0 20px; border: 1px solid var(--ink); background: var(--ink); color: #fff; font-family: inherit; font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; }
  .signup-submit:disabled { opacity: 0.6; cursor: default; }
  .signup-spinner { width: 14px; height: 14px; border: 2px solid rgba(255,255,255,0.35); border-top-color: #fff; border-radius: 50%; animation: spin 0.8s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .signup-msg { font-size: 13px; line-height: 1.5; margin-top: 10px; text-align: left; }
  .signup-msg:empty { display: none; }
  .signup-msg.error { color: #c0392b; }
  .signup-msg.success { color: var(--ink); }

  .site-footer { padding: 20px 16px; padding-bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; justify-content: center; }
  .footer-copy { font-size: 12px; color: var(--muted); cursor: default; user-select: none; }

  @media (min-width: 768px) {
    .site-header { padding: 0 20px 0 32px; }
    .headline { font-size: 48px; }
    .subhead { font-size: 16px; max-width: 420px; }
  }

  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.98);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .admin-overlay.open { opacity: 1; pointer-events: all; }

  .admin-box {
    width: 100%;
    max-width: 340px;
    padding: 0 32px;
    position: relative;
  }

  .admin-logo {
    font-family: 'Telegraf', 'Inter', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    color: var(--text);
    opacity: 0.4;
    display: block;
    text-align: center;
    margin: 0 auto 48px;
    text-decoration: none;
  }

  .admin-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text);
    text-align: center;
    margin-bottom: 40px;
  }

  .admin-field {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    margin-bottom: 24px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.3s;
  }
  .admin-field:focus { border-color: var(--text); }
  .admin-field::placeholder { color: var(--text); opacity: 0.5; }
  .admin-field:-webkit-autofill,
  .admin-field:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 30px rgba(255,255,255,0.98) inset !important;
    -webkit-text-fill-color: var(--text) !important;
  }

  .admin-submit {
    width: 100%;
    background: var(--text);
    border: none;
    padding: 16px;
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #ffffff;
    cursor: pointer;
    transition: opacity 0.2s;
    -webkit-appearance: none;
  }
  .admin-submit:hover { opacity: 0.8; }
  .admin-submit:disabled { opacity: 0.3; cursor: not-allowed; }

  .admin-error {
    font-size: 11px;
    font-weight: 300;
    color: #c0392b;
    margin-top: 16px;
    min-height: 18px;
    text-align: center;
    display: none;
  }
  .admin-error.show { display: block; }

  .admin-close {
    position: absolute;
    top: -40px; right: -8px;
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 20px;
    padding: 8px;
    transition: color 0.2s;
    line-height: 1;
  }

</style>

<script>
  // ── Early exit: already unlocked, or the gate is off entirely ──────
  // Runs before anything else so there's no flash of this page for
  // someone who shouldn't be seeing it anymore.
  (function() {
    // The passes are HttpOnly (server.js), so the server says whether
    // this browser already holds one.
    fetch('/api/online-store-status', { cache: 'no-store' }).then(function(r) { return r.json(); }).then(function(data) {
      if (data && (data.comingSoonEnabled === false || data.unlocked)) {
        window.location.replace('index.html');
      }
    }).catch(function() {});
  })();

  // Shared by both the newsletter signup and the visitor password flow
  // below — kept independent of Firebase (unlike everything in the next
  // script block) so neither breaks if Firebase's SDK has a hiccup.
  var RateLimiter = {
    attempts: {},
    check: function(key, limit, windowMs) {
      limit    = limit    || 5;
      windowMs = windowMs || 300000;
      var now  = Date.now();
      this.attempts[key] = (this.attempts[key] || []).filter(function(t) { return now - t < windowMs; });
      if (this.attempts[key].length >= limit) return false;
      this.attempts[key].push(now);
      return true;
    }
  };

  // ── Visitor password access ─────────────────────────────────
  // A lightweight, visible alternative to the hidden admin login below —
  // for showing the live site to someone (an investor, a friend) before
  // launch, without handing out real admin credentials. The password
  // itself is never sent to this page; it's checked server-side via
  // /api/verify-visitor-password (server.js), which never reveals it
  // back either way. Deliberately independent of Firebase — this only
  // ever talks to our own server, so it should keep working even if the
  // Firebase SDK below fails to load.
  (function() {
    var visitorLink    = document.getElementById('visitor-access-link');
    var visitorRow     = document.getElementById('visitor-access-row');
    var visitorInput   = document.getElementById('visitor-password-input');
    var visitorBtn     = document.getElementById('visitor-submit-btn');
    var visitorBtnText = document.getElementById('visitor-btn-text');
    var visitorSpinner = document.getElementById('visitor-btn-spinner');
    var visitorMsg     = document.getElementById('visitor-msg');

    function setVisitorLoading(v) {
      visitorBtn.disabled = v;
      visitorBtnText.style.display = v ? 'none' : 'inline';
      visitorSpinner.style.display = v ? 'inline-block' : 'none';
    }
    function showVisitorMsg(text, type) {
      visitorMsg.textContent = text;
      visitorMsg.className   = 'signup-msg ' + type;
    }

    // The ••• button in the header opens and closes the password panel.
    visitorLink.addEventListener('click', function() {
      var open = visitorRow.hidden;
      visitorRow.hidden = !open;
      visitorLink.setAttribute('aria-expanded', String(open));
      if (!open) return;
      visitorInput.focus();
    });

    function doVisitorLogin() {
      var password = visitorInput.value;
      if (!password) { showVisitorMsg('Please enter a password.', 'error'); return; }

      var cid = localStorage.getItem('jd_cid') || ('c_' + Math.random().toString(36).substr(2, 9));
      localStorage.setItem('jd_cid', cid);
      if (!RateLimiter.check(cid + '_v')) {
        showVisitorMsg('Too many attempts. Please wait a few minutes.', 'error'); return;
      }

      showVisitorMsg('', ''); setVisitorLoading(true);

      fetch('/api/verify-visitor-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: password })
      }).then(function(r) { return r.json(); }).then(function(data) {
        if (data && data.ok) {
          // The server set the signed jd_visitor pass with this response.
          window.location.href = 'index.html';
        } else {
          showVisitorMsg('Incorrect password.', 'error');
          setVisitorLoading(false);
        }
      }).catch(function() {
        showVisitorMsg('Something went wrong. Please try again.', 'error');
        setVisitorLoading(false);
      });
    }

    visitorBtn.addEventListener('click', doVisitorLogin);
    visitorInput.addEventListener('keydown', function(e) { if (e.key === 'Enter') doVisitorLogin(); });
  })();
</script>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyBjtD9j-jKHtjMVmI2ENxy0T3ts9uf2JNI",
    authDomain: "janedore-9f035.firebaseapp.com",
    projectId: "janedore-9f035",
    storageBucket: "janedore-9f035.firebasestorage.app",
    messagingSenderId: "571299748651",
    appId: "1:571299748651:web:01463a772d47b39cc4036e",
    measurementId: "G-Y9NMT0ZGKZ",
    databaseURL: "https://janedore-9f035-default-rtdb.firebaseio.com"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db   = firebase.firestore();

  // Signed jd_admin pass from the server (server.js /api/admin-gate-pass).
  function requestAdminPass(user) {
    return user.getIdToken().then(function(token) {
      return fetch('/api/admin-gate-pass', { method: 'POST', headers: { Authorization: 'Bearer ' + token } });
    }).then(function(r) {
      if (!r.ok) throw { friendly: 'Access denied.' };
    });
  }

  // Copyright
  document.getElementById('copyright').textContent =
    '\u00a9 ' + new Date().getFullYear() + ' Janedore';

  // Secret admin trigger: 5 rapid clicks on the copyright text
  var clickCount = 0;
  var clickTimer = null;
  document.getElementById('copyright').addEventListener('click', function() {
    clickCount++;
    clearTimeout(clickTimer);
    if (clickCount >= 5) {
      clickCount = 0;
      openAdminPanel();
    } else {
      clickTimer = setTimeout(function() { clickCount = 0; }, 2000);
    }
  });

  var emailEl   = document.getElementById('email-input');
  var signupBtn = document.getElementById('signup-btn');
  var btnText   = document.getElementById('btn-text');
  var spinner   = document.getElementById('btn-spinner');
  var msgEl     = document.getElementById('signup-msg');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className   = 'signup-msg ' + type;
  }
  function clearMsg() {
    msgEl.className = 'signup-msg';
    msgEl.textContent = '';
  }
  function setLoading(v) {
    signupBtn.disabled    = v;
    btnText.style.display = v ? 'none' : 'inline';
    spinner.style.display = v ? 'inline-block' : 'none';
  }
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  function handleSignup() {
    var email = emailEl.value.trim().toLowerCase();
    if (!email) { showMsg('Please enter your email address.', 'error'); return; }
    if (!isValidEmail(email)) { showMsg('Please enter a valid email address.', 'error'); return; }

    var cid = localStorage.getItem('jd_cid') || ('c_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('jd_cid', cid);
    if (!RateLimiter.check(cid + '_s')) {
      showMsg('Too many attempts. Please wait a few minutes.', 'error'); return;
    }

    clearMsg(); setLoading(true);

    var docId  = email.replace(/[@.]/g, '_');
    var docRef = db.collection('newsletter').doc(docId);

    docRef.get().then(function(snap) {
      if (snap.exists) {
        showMsg("You've already subscribed.", 'success');
        setLoading(false);
        return;
      }
      return docRef.set({
        email:        email,
        source:       'coming_soon_page',
        subscribedAt: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent:    navigator.userAgent,
        referrer:     document.referrer || 'direct'
      }).then(function() {
        showMsg("You're on the list. We'll be in touch.", 'success');
        emailEl.value = '';
        setLoading(false);
        fetch('/api/send-welcome-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        }).catch(function(e) {
          console.warn('[EMAIL] Welcome email failed:', e.message);
        });
      });
    }).catch(function(err) {
      console.error('Newsletter error:', err.code, err.message);
      if (err.code === 'unavailable') {
        showMsg('No connection. Check your internet and try again.', 'error');
      } else {
        showMsg('Something went wrong. Please try again.', 'error');
      }
      setLoading(false);
    });
  }

  signupBtn.addEventListener('click', handleSignup);
  emailEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleSignup(); });
  emailEl.addEventListener('input',   function()  { if (msgEl.classList.contains('error')) clearMsg(); });

  var overlay    = document.getElementById('admin-overlay');
  var closeBtn   = document.getElementById('admin-close-btn');
  var loginBtn   = document.getElementById('admin-login-btn');
  var adminEmail = document.getElementById('admin-email');
  var adminPw    = document.getElementById('admin-password');
  var adminErr   = document.getElementById('admin-error');

  adminEmail.setAttribute('disabled', 'true');
  adminPw.setAttribute('disabled', 'true');

  function openAdminPanel() {
    adminEmail.removeAttribute('disabled');
    adminPw.removeAttribute('disabled');
    overlay.classList.add('open');
    setTimeout(function() { adminEmail.focus(); }, 300);
  }
  function closeAdminPanel() {
    overlay.classList.remove('open');
    adminEmail.value     = '';
    adminPw.value        = '';
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';
    loginBtn.disabled    = false;
    loginBtn.textContent = 'Sign In';
  }

  closeBtn.addEventListener('click', closeAdminPanel);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeAdminPanel();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeAdminPanel();
  });

  adminEmail.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') adminPw.focus();
  });
  adminPw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doAdminLogin();
  });
  loginBtn.addEventListener('click', doAdminLogin);

  function doAdminLogin() {
    var email    = adminEmail.value.trim();
    var password = adminPw.value;
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';

    if (!email || !password) {
      adminErr.textContent = 'Please enter your email and password.';
      adminErr.className   = 'admin-error show';
      return;
    }

    loginBtn.disabled    = true;
    loginBtn.textContent = 'Signing in...';

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function() {
      return auth.signInWithEmailAndPassword(email, password);
    }).then(function(cred) {
      return db.collection('admins').doc(cred.user.uid).get().then(function(doc) {
        if (!doc.exists) {
          return auth.signOut().then(function() {
            throw { friendly: 'Access denied.' };
          });
        }
        var role = (doc.data().role || '').toUpperCase();
        if (role !== 'SUPER_ADMIN') {
          return auth.signOut().then(function() {
            throw { friendly: 'Access denied.' };
          });
        }
        return requestAdminPass(cred.user).then(function() {
          window.location.href = 'index.html';
        });
      });
    }).catch(function(err) {
      var msg = err.friendly || 'Invalid credentials.';
      if (err.code === 'auth/too-many-requests')      msg = 'Too many attempts. Wait and try again.';
      if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
      adminErr.textContent = msg;
      adminErr.className   = 'admin-error show';
      loginBtn.disabled    = false;
      loginBtn.textContent = 'Sign In';
    });
  }
</script>

<script>
  (function () {
    var emailField = document.getElementById('email-input');
    if (!emailField) return;
    function lockEnvelopeOpen() {
      document.body.classList.add('env-locked');
      emailField.removeEventListener('focus', lockEnvelopeOpen);
      emailField.removeEventListener('input', lockEnvelopeOpen);
    }
    emailField.addEventListener('focus', lockEnvelopeOpen);
    emailField.addEventListener('input', lockEnvelopeOpen);
  })();
</script>

</body>
</html>
