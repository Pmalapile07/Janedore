<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #F7F5F1;
    --paper:   #FFFFFF;
    --ink:     #121212;
    --text:    #141414;
    --muted:   #8C877E;
    --border:  #E4E0D8;
  }

  html {
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 16px;
  }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ── Header ───────────────────────────────────────────── */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 44px 60px;
    background: transparent;
  }

  .header-logo {
    display: block;
    line-height: 1;
    text-decoration: none;
    cursor: default;
    pointer-events: none;
  }

  .header-logo-text {
    font-family: 'Telegraf', 'Inter', sans-serif;
    font-size: 1.3rem;
    letter-spacing: 0.16em;
    text-transform: uppercase;
    color: var(--text);
    display: block;
  }

  /* ── Main ─────────────────────────────────────────────── */
  .main-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-self: stretch;
    padding: 40px 60px 60px;
    max-width: 760px;
  }

  .eyebrow {
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 24px;
  }

  .headline {
    font-family: 'The Seasons', 'Fraunces', serif;
    font-weight: 400;
    font-style: normal;
    font-size: clamp(28px, 5.2vw, 60px);
    line-height: 1.1;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 44px;
    text-align: center;
    white-space: nowrap;
  }

  .headline-line { display: block; }

  .subhead {
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--muted);
    max-width: 360px;
    margin: 0 auto 52px;
    text-align: center;
    letter-spacing: 0.01em;
    animation: subhead-shift 13s infinite backwards;
    animation-delay: 1.1s;
  }

  @keyframes subhead-shift {
    0%   { transform: translateY(26px); animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    7%   { transform: translateY(0); animation-timing-function: linear; }
    75%  { transform: translateY(0); animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    83%  { transform: translateY(26px); }
    100% { transform: translateY(26px); }
  }

  /* ── Envelope signup: wide black envelope, white paper inside ── */
  .signup-wrapper { width: 100%; max-width: 480px; }

  .envelope {
    position: relative;
    width: 100%;
    aspect-ratio: 480 / 400;
    filter: drop-shadow(0 22px 30px rgba(18,18,18,0.22));
    perspective: 1000px;
  }

  /* Layer 1: back panel — the envelope wall behind everything */
  .envelope-back {
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    bottom: 0;
    z-index: 1;
    background: var(--ink);
  }
  .envelope-back::before {
    content: '';
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 1px;
    background: rgba(255,255,255,0.14);
    opacity: 0;
    animation: hairline-cycle 13s infinite backwards;
    animation-delay: 1.1s;
  }

  @keyframes hairline-cycle {
    0%   { opacity: 0; }
    7%   { opacity: 0; }
    9%   { opacity: 1; }
    73%  { opacity: 1; }
    78%  { opacity: 0; }
    100% { opacity: 0; }
  }

  /* Layer 1b: the top opening flap — flat/hidden while closed, rises up as the lid opens */
  .envelope-flap-top {
    position: absolute;
    left: 0; right: 0;
    top: 0;
    height: 30%;
    z-index: 2;
    background: linear-gradient(165deg, #202020 0%, #101010 60%, #060606 100%);
    clip-path: polygon(0 100%, 50% 13%, 100% 100%);
    transform-origin: bottom center;
    transform: scaleY(0);
    opacity: 0;
    animation: flap-cycle 13s infinite backwards;
    animation-delay: 1.1s;
  }

  @keyframes flap-cycle {
    0%   { transform: scaleY(0); opacity: 0; animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    5%   { opacity: 1; }
    7%   { transform: scaleY(1); opacity: 1; animation-timing-function: linear; }
    73%  { transform: scaleY(1); opacity: 1; animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    76%  { opacity: 0.4; }
    78%  { transform: scaleY(0); opacity: 0; animation-timing-function: linear; }
    100% { transform: scaleY(0); opacity: 0; }
  }

  /* Layer 2: the paper, tucked between the back panel and the front pocket */
  .envelope-paper {
    position: absolute;
    left: 4%;
    right: 4%;
    top: 30%;
    bottom: 6%;
    z-index: 3;
    background: var(--paper);
    padding: 22px 22px 0;
    display: flex;
    align-items: flex-start;
    box-shadow: 0 10px 20px -14px rgba(18,18,18,0.4);
    animation: paper-cycle 13s infinite backwards;
    animation-delay: 1.5s;
  }
  .envelope-paper .signup-row { width: 100%; }

  /* Layer 3: left & right folded side panels — tucked in first, mostly hidden
     beneath the front pocket flap. They stop underneath it; they never meet each other.
     Sized to only cover the lower half of the paper, so the top half stays visible. */
  .envelope-fold-left {
    position: absolute;
    left: 0; right: 0;
    top: 58%;
    bottom: 0;
    z-index: 4;
    background: linear-gradient(100deg, #1c1c1c 0%, #101010 45%, #0a0a0a 100%);
    clip-path: polygon(0% 0%, 62% 0%, 24% 100%, 0% 100%);
  }
  .envelope-fold-right {
    position: absolute;
    left: 0; right: 0;
    top: 58%;
    bottom: 0;
    z-index: 4;
    background: linear-gradient(260deg, #1c1c1c 0%, #101010 45%, #0a0a0a 100%);
    clip-path: polygon(100% 0%, 38% 0%, 76% 100%, 100% 100%);
  }

  /* Layer 4 (same stacking group as the folds): the front pocket flap — sits above
     both folds, its point is what actually reads as "an envelope" on the closed front
     face. Same reduced height as the folds, so it only covers the paper's lower half. */
  .envelope-front-flap {
    position: absolute;
    left: 0; right: 0;
    top: 58%;
    bottom: 0;
    z-index: 4;
    background: linear-gradient(175deg, #1f1f1f 0%, #111111 55%, #060606 100%);
    clip-path: polygon(0% 100%, 50% 20%, 100% 100%);
  }

  /* Layer 5: closed top flap — folds down low, overlapping the front pocket flap's point.
     Same lid-open animation/timing as before; only the shape is a real folded-flap silhouette. */
  /* Locked-open state: once the person interacts with the email field, the envelope
     stays open and doesn't cycle closed again. Toggled by a small script below. */
  body.env-locked .envelope-lid       { animation: none; opacity: 0; pointer-events: none; }
  body.env-locked .envelope-flap-top  { animation: none; transform: scaleY(1); opacity: 1; }
  body.env-locked .envelope-paper     { animation: none; transform: translateY(-16px) scale(1); opacity: 1; }
  body.env-locked .envelope-back::before { animation: none; opacity: 1; }
  body.env-locked .subhead            { animation: none; transform: translateY(0); }

  .envelope-lid {
    position: absolute;
    left: 0; right: 0;
    top: 30%;
    bottom: 0;
    z-index: 10;
    background: linear-gradient(165deg, #202020 0%, #101010 55%, #060606 100%);
    clip-path: polygon(0% 0%, 100% 0%, 50% 60%);
    transform-origin: top center;
    pointer-events: none;
    animation: lid-cycle 13s infinite backwards;
    animation-delay: 1.1s;
  }

  @keyframes lid-cycle {
    0%   { transform: rotateX(0deg);    opacity: 1; animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    5%   { transform: rotateX(-112deg); opacity: 1; }
    7%   { transform: rotateX(-128deg); opacity: 0; animation-timing-function: linear; }
    75%  { transform: rotateX(-128deg); opacity: 0; animation-timing-function: cubic-bezier(.3,.9,.3,1); }
    78%  { transform: rotateX(-112deg); opacity: 1; }
    83%  { transform: rotateX(0deg);    opacity: 1; animation-timing-function: linear; }
    100% { transform: rotateX(0deg);    opacity: 1; }
  }

  @keyframes paper-cycle {
    0%   { transform: translateY(16px)  scale(0.94); opacity: 0; animation-timing-function: linear; }
    8%   { transform: translateY(16px)  scale(0.94); opacity: 0; animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
    11%  { transform: translateY(-22px) scale(1.03); opacity: 1; }
    14%  { transform: translateY(-16px) scale(1);    opacity: 1; animation-timing-function: linear; }
    72%  { transform: translateY(-16px) scale(1);    opacity: 1; animation-timing-function: ease-in; }
    75%  { transform: translateY(16px)  scale(0.94); opacity: 0; animation-timing-function: linear; }
    100% { transform: translateY(16px)  scale(0.94); opacity: 0; }
  }

  .signup-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    transition: border-color 0.3s;
  }
  .signup-row:focus-within { border-color: var(--text); }

  .signup-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    letter-spacing: 0.02em;
  }
  .signup-input::placeholder { color: var(--muted); }
  .signup-input:-webkit-autofill,
  .signup-input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 30px var(--paper) inset !important;
    -webkit-text-fill-color: var(--text) !important;
  }

  .signup-submit {
    background: transparent;
    border: none;
    padding: 8px 0 8px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--text);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .signup-submit:hover { color: var(--muted); }
  .signup-submit:disabled { opacity: 0.25; cursor: not-allowed; }

  .signup-spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 1px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .signup-msg {
    font-size: 11px;
    font-weight: 300;
    color: var(--text);
    margin-top: 16px;
    min-height: 18px;
    transition: color 0.2s;
    letter-spacing: 0.01em;
  }
  .signup-msg.success { color: #5a8a5a; }
  .signup-msg.error   { color: #c0392b; }

  @media (prefers-reduced-motion: reduce) {
    .envelope-paper { animation: none; transform: translateY(-16px) scale(1); opacity: 1; }
    .envelope-lid { display: none; }
    .envelope-flap-top { animation: none; transform: scaleY(1); opacity: 1; }
    .envelope-back::before { animation: none; opacity: 1; }
    .subhead { animation: none; transform: translateY(0); }
  }

  /* ── Footer ───────────────────────────────────────────── */
  .site-footer {
    padding: 40px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .footer-copy {
    font-size: 10px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.03em;
    cursor: default;
    user-select: none;
  }

  /* ── Admin overlay (kept functionally & visually consistent) ── */
  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(247,245,241,0.98);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .admin-overlay.open { opacity: 1; pointer-events: all; }

  .admin-box {
    width: 100%;
    max-width: 340px;
    padding: 0 32px;
    position: relative;
  }

  .admin-logo {
    font-family: 'Telegraf', 'Inter', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    color: var(--text);
    opacity: 0.4;
    display: block;
    text-align: center;
    margin: 0 auto 48px;
    text-decoration: none;
  }

  .admin-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text);
    text-align: center;
    margin-bottom: 40px;
  }

  .admin-field {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    margin-bottom: 24px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.3s;
  }
  .admin-field:focus { border-color: var(--text); }
  .admin-field::placeholder { color: var(--text); opacity: 0.5; }
  .admin-field:-webkit-autofill,
  .admin-field:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 30px rgba(247,245,241,0.98) inset !important;
    -webkit-text-fill-color: var(--text) !important;
  }

  .admin-submit {
    width: 100%;
    background: var(--text);
    border: none;
    padding: 16px;
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #ffffff;
    cursor: pointer;
    transition: opacity 0.2s;
    -webkit-appearance: none;
  }
  .admin-submit:hover { opacity: 0.8; }
  .admin-submit:disabled { opacity: 0.3; cursor: not-allowed; }

  .admin-error {
    font-size: 11px;
    font-weight: 300;
    color: #c0392b;
    margin-top: 16px;
    min-height: 18px;
    text-align: center;
    display: none;
  }
  .admin-error.show { display: block; }

  .admin-close {
    position: absolute;
    top: -40px; right: -8px;
    background: transparent;
    border: none;
    color: var(--text);
    cursor: pointer;
    font-size: 20px;
    padding: 8px;
    transition: color 0.2s;
    line-height: 1;
  }

  #chat-container {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 60;
  }

  @media (max-width: 768px) {
    .site-header { padding: 28px 24px; }
    .header-logo-text { font-size: 1.1rem; }
    .main-content { padding: 32px 24px 40px; }
    .headline { font-size: clamp(24px, 8vw, 56px); margin-bottom: 32px; white-space: normal; }
    .subhead { margin-bottom: 40px; }
    .envelope-paper { padding: 18px 18px 0; }
    .site-footer { padding: 24px 24px; }
    #chat-container { bottom: 20px; right: 16px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <a aria-label="Janedore" class="header-logo">
    <span class="header-logo-text">JANEDORE</span>
  </a>
</header>

<main id="main" class="main-content">
  <h1 class="headline">
    <span class="headline-line">You found us early.</span>
  </h1>
  <p class="subhead">
    We're taking our time. Good things usually do.<br>Sign up and you'll be first to know when we launch.
  </p>
  <div class="signup-wrapper">
    <div class="envelope">
      <div class="envelope-back" aria-hidden="true"></div>
      <div class="envelope-flap-top" aria-hidden="true"></div>
      <div class="envelope-paper">
        <div class="signup-row">
          <label for="email-input" class="sr-only">Email address</label>
          <input type="email"
                 class="signup-input"
                 id="email-input"
                 placeholder="Enter your email"
                 autocomplete="email"
                 aria-describedby="signup-msg"
                 required>
          <button type="button" class="signup-submit" id="signup-btn" aria-label="Subscribe">
            <span id="btn-text">Notify me</span>
            <span id="btn-spinner" class="signup-spinner" style="display:none;" aria-hidden="true"></span>
          </button>
        </div>
      </div>
      <div class="envelope-fold-left" aria-hidden="true"></div>
      <div class="envelope-fold-right" aria-hidden="true"></div>
      <div class="envelope-front-flap" aria-hidden="true"></div>
      <div class="envelope-lid" aria-hidden="true"></div>
    </div>
    <div class="signup-msg" id="signup-msg" role="status" aria-live="polite"></div>
  </div>
</main>

<footer class="site-footer">
  <p class="footer-copy" id="copyright"></p>
</footer>

<div class="admin-overlay" id="admin-overlay" role="dialog" aria-modal="true" aria-label="Admin login">
  <div class="admin-box">
    <button class="admin-close" id="admin-close-btn" aria-label="Close">
      <i class="ph ph-x"></i>
    </button>
    <span class="admin-logo">JANEDORE</span>
    <span class="admin-label">Admin Access</span>
    <input type="email" class="admin-field" id="admin-email"
           placeholder="Email"
           autocomplete="email"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">
    <input type="text" class="admin-field" id="admin-password"
           placeholder="Password"
           autocomplete="off"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false"
           readonly
           onfocus="this.removeAttribute('readonly');this.type='password';"
           style="-webkit-text-security:disc;">
    <button class="admin-submit" id="admin-login-btn">Sign In</button>
    <div class="admin-error" id="admin-error"></div>
  </div>
</div>

<div id="chat-container"></div>

<script>

    apiKey: "AIzaSyBjtD9j-jKHtjMVmI2ENxy0T3ts9uf2JNI",
    authDomain: "janedore-9f035.firebaseapp.com",
    projectId: "janedore-9f035",

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db   = firebase.firestore();

  // ── Cookie helpers ─────────────────────────────────────────
  function setAdminCookie() {
    // Expires in 7 days; SameSite=Strict keeps it on same domain only
    var expires = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000).toUTCString();
    document.cookie = 'jd_admin=1; path=/; expires=' + expires + '; SameSite=Strict';
  }
  function clearAdminCookie() {
    document.cookie = 'jd_admin=; path=/; expires=Thu, 01 Jan 1970 00:00:00 GMT; SameSite=Strict';
  }

  // Copyright
  document.getElementById('copyright').textContent =
    '\u00a9 ' + new Date().getFullYear() + ' Janedore';

  // Secret admin trigger: 5 rapid clicks on the copyright text
  var clickCount = 0;
  var clickTimer = null;
  document.getElementById('copyright').addEventListener('click', function() {
    clickCount++;
    clearTimeout(clickTimer);
    if (clickCount >= 5) {
      clickCount = 0;
      openAdminPanel();
    } else {
      clickTimer = setTimeout(function() { clickCount = 0; }, 2000);
    }
  });

  var emailEl   = document.getElementById('email-input');
  var signupBtn = document.getElementById('signup-btn');
  var btnText   = document.getElementById('btn-text');
  var spinner   = document.getElementById('btn-spinner');
  var msgEl     = document.getElementById('signup-msg');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className   = 'signup-msg ' + type;
  }
  function clearMsg() {
    msgEl.className = 'signup-msg';
    msgEl.textContent = '';
  }
  function setLoading(v) {
    signupBtn.disabled    = v;
    btnText.style.display = v ? 'none' : 'inline';
    spinner.style.display = v ? 'inline-block' : 'none';
  }
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  var RateLimiter = {
    attempts: {},
    check: function(key, limit, windowMs) {
      limit    = limit    || 5;
      windowMs = windowMs || 300000;
      var now  = Date.now();
      this.attempts[key] = (this.attempts[key] || []).filter(function(t) { return now - t < windowMs; });
      if (this.attempts[key].length >= limit) return false;
      this.attempts[key].push(now);
      return true;
    }
  };

  function handleSignup() {
    var email = emailEl.value.trim().toLowerCase();
    if (!email) { showMsg('Please enter your email address.', 'error'); return; }
    if (!isValidEmail(email)) { showMsg('Please enter a valid email address.', 'error'); return; }

    var cid = localStorage.getItem('jd_cid') || ('c_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('jd_cid', cid);
    if (!RateLimiter.check(cid + '_s')) {
      showMsg('Too many attempts. Please wait a few minutes.', 'error'); return;
    }

    clearMsg(); setLoading(true);

    var docId  = email.replace(/[@.]/g, '_');
    var docRef = db.collection('newsletter').doc(docId);

    docRef.get().then(function(snap) {
      if (snap.exists) {
        showMsg("You've already subscribed.", 'success');
        setLoading(false);
        return;
      }
      return docRef.set({
        email:        email,
        source:       'coming_soon_page',
        subscribedAt: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent:    navigator.userAgent,
        referrer:     document.referrer || 'direct'
      }).then(function() {
        showMsg("You're on the list. We'll be in touch.", 'success');
        emailEl.value = '';
        setLoading(false);
        fetch('/api/send-welcome-email', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email })
        }).catch(function(e) {
          console.warn('[EMAIL] Welcome email failed:', e.message);
        });
      });
    }).catch(function(err) {
      console.error('Newsletter error:', err.code, err.message);
      if (err.code === 'unavailable') {
        showMsg('No connection. Check your internet and try again.', 'error');
      } else {
        showMsg('Something went wrong. Please try again.', 'error');
      }
      setLoading(false);
    });
  }

  signupBtn.addEventListener('click', handleSignup);
  emailEl.addEventListener('keydown', function(e) { if (e.key === 'Enter') handleSignup(); });
  emailEl.addEventListener('input',   function()  { if (msgEl.classList.contains('error')) clearMsg(); });

  var overlay    = document.getElementById('admin-overlay');
  var closeBtn   = document.getElementById('admin-close-btn');
  var loginBtn   = document.getElementById('admin-login-btn');
  var adminEmail = document.getElementById('admin-email');
  var adminPw    = document.getElementById('admin-password');
  var adminErr   = document.getElementById('admin-error');

  adminEmail.setAttribute('disabled', 'true');
  adminPw.setAttribute('disabled', 'true');

  function openAdminPanel() {
    adminEmail.removeAttribute('disabled');
    adminPw.removeAttribute('disabled');
    overlay.classList.add('open');
    setTimeout(function() { adminEmail.focus(); }, 300);
  }
  function closeAdminPanel() {
    overlay.classList.remove('open');
    adminEmail.value     = '';
    adminPw.value        = '';
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';
    loginBtn.disabled    = false;
    loginBtn.textContent = 'Sign In';
  }

  closeBtn.addEventListener('click', closeAdminPanel);
  overlay.addEventListener('click', function(e) {
    if (e.target === overlay) closeAdminPanel();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeAdminPanel();
  });

  adminEmail.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') adminPw.focus();
  });
  adminPw.addEventListener('keydown', function(e) {
    if (e.key === 'Enter') doAdminLogin();
  });
  loginBtn.addEventListener('click', doAdminLogin);

  function doAdminLogin() {
    var email    = adminEmail.value.trim();
    var password = adminPw.value;
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';

    if (!email || !password) {
      adminErr.textContent = 'Please enter your email and password.';
      adminErr.className   = 'admin-error show';
      return;
    }

    loginBtn.disabled    = true;
    loginBtn.textContent = 'Signing in...';

    auth.setPersistence(firebase.auth.Auth.Persistence.LOCAL).then(function() {
      return auth.signInWithEmailAndPassword(email, password);
    }).then(function(cred) {
      return db.collection('admins').doc(cred.user.uid).get().then(function(doc) {
        if (!doc.exists) {
          return auth.signOut().then(function() {
            throw { friendly: 'Access denied.' };
          });
        }
        var role = (doc.data().role || '').toUpperCase();
        if (role !== 'SUPER_ADMIN') {
          return auth.signOut().then(function() {
            throw { friendly: 'Access denied.' };
          });
        }
        // Set cookie so index.html knows a session exists on refresh
        setAdminCookie();
        window.location.href = 'index.html';
      });
    }).catch(function(err) {
      var msg = err.friendly || 'Invalid credentials.';
      if (err.code === 'auth/too-many-requests')      msg = 'Too many attempts. Wait and try again.';
      if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
      adminErr.textContent = msg;
      adminErr.className   = 'admin-error show';
      loginBtn.disabled    = false;
      loginBtn.textContent = 'Sign In';
    });
  }

  fetch('chat-widget.html')
    .then(function(r) { return r.text(); })
    .then(function(html) {
      document.getElementById('chat-container').innerHTML = html;
      var script = document.createElement('script');
      script.src = 'chat.js';
      document.body.appendChild(script);
    })
    .catch(function(err) { console.error('Chat widget failed:', err); });
</script>

<script>
  // Independent of the signup/Firebase logic above: once the person engages with
  // the email field, stop the envelope's open/close loop and keep it open.
  (function () {
    var emailField = document.getElementById('email-input');
    if (!emailField) return;
    function lockEnvelopeOpen() {
      document.body.classList.add('env-locked');
      emailField.removeEventListener('focus', lockEnvelopeOpen);
      emailField.removeEventListener('input', lockEnvelopeOpen);
    }
    emailField.addEventListener('focus', lockEnvelopeOpen);
    emailField.addEventListener('input', lockEnvelopeOpen);
  })();
</script>

</body>
