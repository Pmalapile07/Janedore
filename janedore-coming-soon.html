<!DOCTYPE html>
<html lang="en">
<head>

<style>
  @font-face {
    font-family: 'Telegraf';
    src: url('https://raw.githubusercontent.com/Pmalapile07/Janedore/main/TelegrafRegular_272984568a25d8528fe2de8b20b29011.otf') format('opentype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
</style>

<script src="https://unpkg.com/phosphor-icons"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:      #ffffff;
    --text:    #1a1a1a;
    --muted:   #999999;
    --border:  #e0e0e0;
  }

  html {
    font-family: 'Inter', sans-serif;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    font-size: 16px;
  }

  body {
    min-height: 100dvh;
    background: var(--bg);
    color: var(--text);
    display: grid;
    grid-template-rows: auto 1fr auto;
  }

  .sr-only {
    position: absolute; width: 1px; height: 1px;
    padding: 0; margin: -1px; overflow: hidden;
    clip: rect(0,0,0,0); white-space: nowrap; border: 0;
  }

  /* ── Header ────────────────────────────────────────────────── */
  .site-header {
    display: flex;
    align-items: center;
    padding: 40px 60px;
    background: transparent;
  }

  .header-logo {
    display: block;
    line-height: 1;
    text-decoration: none;
    cursor: default;
    pointer-events: none;
  }

  .header-logo-img {
    width: 130px;
    height: auto;
    display: block;
  }

  /* ── Main ──────────────────────────────────────────────────── */
  .main-content {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-self: stretch;
    padding: 60px 60px;
    max-width: 720px;
  }

  /* ── Stacked headline ──────────────────────────────────────── */
  .headline {
    font-family: 'Fraunces', serif;
    font-weight: 400;
    font-style: italic;
    font-size: clamp(52px, 8vw, 96px);
    line-height: 1.0;
    letter-spacing: -0.02em;
    color: var(--text);
    margin-bottom: 48px;
    display: flex;
    flex-direction: column;
    gap: 0.04em;
  }

  .headline-line {
    display: block;
  }

  .headline-line:nth-child(2) {
    padding-left: 0.12em;
  }
  .headline-line:nth-child(3) {
    padding-left: 0.04em;
  }

  .subhead {
    font-size: 13px;
    font-weight: 300;
    line-height: 1.8;
    color: var(--muted);
    max-width: 340px;
    margin-bottom: 56px;
    letter-spacing: 0.01em;
  }

  /* ── Signup ────────────────────────────────────────────────── */
  .signup-wrapper {
    width: 100%;
    max-width: 380px;
  }

  .signup-row {
    display: flex;
    align-items: flex-end;
    gap: 16px;
    border-bottom: 1px solid var(--border);
    padding-bottom: 12px;
    transition: border-color 0.3s;
  }
  .signup-row:focus-within {
    border-color: var(--text);
  }

  .signup-input {
    flex: 1;
    background: transparent;
    border: none;
    padding: 8px 0;
    font-family: 'Inter', sans-serif;
    font-size: 13px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    letter-spacing: 0.02em;
  }
  .signup-input::placeholder { color: var(--muted); }
  .signup-input:-webkit-autofill,
  .signup-input:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 30px var(--bg) inset !important;
    -webkit-text-fill-color: var(--text) !important;
  }

  .signup-submit {
    background: transparent;
    border: none;
    padding: 8px 0 8px 8px;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--muted);
    cursor: pointer;
    white-space: nowrap;
    transition: color 0.2s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .signup-submit:hover { color: var(--text); }
  .signup-submit:disabled { opacity: 0.25; cursor: not-allowed; }
  .signup-submit i { font-size: 12px; }

  .signup-spinner {
    display: inline-block;
    width: 12px; height: 12px;
    border: 1px solid var(--border);
    border-top-color: var(--text);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .signup-msg {
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    margin-top: 14px;
    min-height: 18px;
    transition: color 0.2s;
    letter-spacing: 0.01em;
  }
  .signup-msg.success { color: #5a8a5a; }
  .signup-msg.error   { color: #c0392b; }

  /* ── Footer ────────────────────────────────────────────────── */
  .site-footer {
    padding: 40px 60px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
  }

  .footer-copy {
    font-size: 10px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 0.03em;
  }

  /* ── Admin overlay ─────────────────────────────────────────── */
  .admin-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.98);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }
  .admin-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .admin-box {
    width: 100%;
    max-width: 340px;
    padding: 0 32px;
    position: relative;
  }

  .admin-logo {
    font-family: 'Telegraf', 'Inter', sans-serif;
    font-size: 1.5rem;
    letter-spacing: 0.08em;
    color: var(--text);
    opacity: 0.4;
    display: block;
    text-align: center;
    margin: 0 auto 48px;
    text-decoration: none;
  }

  .admin-label {
    display: block;
    font-family: 'Inter', sans-serif;
    font-size: 10px;
    font-weight: 500;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--muted);
    text-align: center;
    margin-bottom: 40px;
  }

  .admin-field {
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border);
    padding: 14px 0;
    margin-bottom: 24px;
    font-family: 'Inter', sans-serif;
    font-size: 15px;
    font-weight: 300;
    color: var(--text);
    outline: none;
    -webkit-appearance: none;
    transition: border-color 0.3s;
  }
  .admin-field:focus { border-color: var(--text); }
  .admin-field::placeholder { color: var(--muted); opacity: 0.5; }
  .admin-field:-webkit-autofill,
  .admin-field:-webkit-autofill:focus {
    -webkit-box-shadow: 0 0 0 30px rgba(255,255,255,0.98) inset !important;
    -webkit-text-fill-color: var(--text) !important;
  }

  .admin-submit {
    width: 100%;
    background: var(--text);
    border: none;
    padding: 16px;
    margin-top: 16px;
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: #ffffff;
    cursor: pointer;
    transition: opacity 0.2s;
    -webkit-appearance: none;
  }
  .admin-submit:hover { opacity: 0.8; }
  .admin-submit:disabled { opacity: 0.3; cursor: not-allowed; }

  .admin-error {
    font-size: 11px;
    font-weight: 300;
    color: #c0392b;
    margin-top: 16px;
    min-height: 18px;
    text-align: center;
    display: none;
  }
  .admin-error.show { display: block; }

  .admin-close {
    position: absolute;
    top: -40px; right: -8px;
    background: transparent;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 20px;
    padding: 8px;
    transition: color 0.2s;
    line-height: 1;
  }
  .admin-close:hover { color: var(--text); }

  /* ── Chat container ────────────────────────────────────────── */
  #chat-container {
    position: fixed;
    bottom: 32px;
    right: 32px;
    z-index: 60;
  }

  /* ── Responsive ────────────────────────────────────────────── */
  @media (max-width: 768px) {
    .site-header {
      padding: 28px 28px;
    }

    .header-logo-img {
      width: 110px;
    }

    .main-content {
      padding: 40px 28px;
    }

    .headline {
      font-size: clamp(44px, 13vw, 72px);
      margin-bottom: 36px;
    }

    .subhead {
      margin-bottom: 44px;
    }

    .site-footer {
      padding: 28px 28px;
    }

    #chat-container {
      bottom: 20px;
      right: 16px;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>

<header class="site-header">
  <a aria-label="Janedore" class="header-logo">
    <img class="header-logo-img" 
         src="https://raw.githubusercontent.com/Pmalapile07/Janedore/main/Janedore.png" 
         alt="Janedore">
  </a>
</header>

<main id="main" class="main-content">

  <h1 class="headline">
    <span class="headline-line">You found</span>
    <span class="headline-line">us early.</span>
  </h1>

  <p class="subhead">
    A curated multi-brand fashion house. Refined pieces, considered edits. Be the first to know when we open.
  </p>

  <div class="signup-wrapper">
    <div class="signup-row">
      <label for="email-input" class="sr-only">Email address</label>
      <input type="email"
             class="signup-input"
             id="email-input"
             placeholder="Enter your email"
             autocomplete="email"
             aria-describedby="signup-msg"
             required>
      <button type="button" class="signup-submit" id="signup-btn" aria-label="Subscribe">
        <span id="btn-text">Notify me</span>
        <i class="ph ph-arrow-right" id="arrow-icon" aria-hidden="true"></i>
        <span id="btn-spinner" class="signup-spinner" style="display:none;" aria-hidden="true"></span>
      </button>
    </div>
    <div class="signup-msg" id="signup-msg" role="status" aria-live="polite"></div>
  </div>

</main>

<footer class="site-footer">
  <p class="footer-copy" id="copyright"></p>
</footer>

<div class="admin-overlay" id="admin-overlay" role="dialog" aria-modal="true" aria-label="Admin login">
  <div class="admin-box">
    <button class="admin-close" id="admin-close-btn" aria-label="Close">
      <i class="ph ph-x"></i>
    </button>
    <span class="admin-logo">JANEDORE</span>
    <span class="admin-label">Admin Access</span>
    <input type="email" class="admin-field" id="admin-email"
           placeholder="Email"
           autocomplete="email"
           autocorrect="off"
           autocapitalize="off"
           spellcheck="false">
    <input type="password" class="admin-field" id="admin-password"
           placeholder="Password"
           autocomplete="current-password">
    <button class="admin-submit" id="admin-login-btn">Sign In</button>
    <div class="admin-error" id="admin-error"></div>
  </div>
</div>

<div id="chat-container"></div>

<script>
  var firebaseConfig = {
    apiKey: "AIzaSyBjtD9j-jKHtjMVmI2ENxy0T3ts9uf2JNI",
    authDomain: "janedore-9f035.firebaseapp.com",
    projectId: "janedore-9f035",
    storageBucket: "janedore-9f035.firebasestorage.app",
    messagingSenderId: "571299748651",
    appId: "1:571299748651:web:01463a772d47b39cc4036e",
    measurementId: "G-Y9NMT0ZGKZ",
    databaseURL: "https://janedore-9f035-default-rtdb.firebaseio.com"
  };

  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  var auth = firebase.auth();
  var db   = firebase.firestore();

  document.getElementById('copyright').textContent =
    '\u00a9 ' + new Date().getFullYear() + ' Janedore. All rights reserved.';

  var emailEl   = document.getElementById('email-input');
  var signupBtn = document.getElementById('signup-btn');
  var btnText   = document.getElementById('btn-text');
  var arrowIcon = document.getElementById('arrow-icon');
  var spinner   = document.getElementById('btn-spinner');
  var msgEl     = document.getElementById('signup-msg');

  function showMsg(text, type) {
    msgEl.textContent = text;
    msgEl.className   = 'signup-msg ' + type;
  }
  function clearMsg() {
    msgEl.className = 'signup-msg';
    msgEl.textContent = '';
  }
  function setLoading(v) {
    signupBtn.disabled       = v;
    btnText.style.display    = v ? 'none' : 'inline';
    arrowIcon.style.display  = v ? 'none' : 'inline';
    spinner.style.display    = v ? 'inline-block' : 'none';
  }
  function isValidEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

  var RateLimiter = {
    attempts: {},
    check: function (key, limit, windowMs) {
      limit    = limit    || 5;
      windowMs = windowMs || 300000;
      var now  = Date.now();
      this.attempts[key] = (this.attempts[key] || []).filter(function (t) { return now - t < windowMs; });
      if (this.attempts[key].length >= limit) return false;
      this.attempts[key].push(now);
      return true;
    }
  };

  function handleSignup() {
    var email = emailEl.value.trim().toLowerCase();
    if (!email) { showMsg('Please enter your email address.', 'error'); return; }
    if (!isValidEmail(email)) { showMsg('Please enter a valid email address.', 'error'); return; }

    var cid = localStorage.getItem('jd_cid') || ('c_' + Math.random().toString(36).substr(2, 9));
    localStorage.setItem('jd_cid', cid);
    if (!RateLimiter.check(cid + '_s')) {
      showMsg('Too many attempts. Please wait a few minutes.', 'error'); return;
    }

    clearMsg(); setLoading(true);

    var docId  = email.replace(/[.#$[\]]/g, '_');
    var docRef = db.collection('newsletters').doc(docId);

    docRef.get().then(function (snap) {
      if (snap.exists) {
        showMsg("You're already on the list.", 'error');
        setLoading(false);
        return;
      }
      return docRef.set({
        email:        email,
        source:       'coming_soon_page',
        subscribedAt: firebase.firestore.FieldValue.serverTimestamp(),
        userAgent:    navigator.userAgent,
        referrer:     document.referrer || 'direct'
      }).then(function () {
        showMsg("You're on the list. We'll be in touch.", 'success');
        emailEl.value = '';
        setLoading(false);
      });
    }).catch(function (err) {
      console.error('Newsletter error:', err.code, err.message);
      var msg = 'Something went wrong. Please try again.';
      if (err.code === 'permission-denied') msg = 'Unable to subscribe — try again later.';
      if (err.code === 'unavailable')       msg = 'No connection. Check your internet and try again.';
      showMsg(msg, 'error');
      setLoading(false);
    });
  }

  signupBtn.addEventListener('click', handleSignup);
  emailEl.addEventListener('keydown', function (e) { if (e.key === 'Enter') handleSignup(); });
  emailEl.addEventListener('input',   function ()  { if (msgEl.classList.contains('error')) clearMsg(); });

  var overlay    = document.getElementById('admin-overlay');
  var closeBtn   = document.getElementById('admin-close-btn');
  var loginBtn   = document.getElementById('admin-login-btn');
  var adminEmail = document.getElementById('admin-email');
  var adminPw    = document.getElementById('admin-password');
  var adminErr   = document.getElementById('admin-error');

  function openAdminPanel() {
    overlay.classList.add('open');
    setTimeout(function () { adminEmail.focus(); }, 300);
  }
  function closeAdminPanel() {
    overlay.classList.remove('open');
    adminEmail.value     = '';
    adminPw.value        = '';
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';
    loginBtn.disabled    = false;
    loginBtn.textContent = 'Sign In';
  }

  closeBtn.addEventListener('click', closeAdminPanel);
  overlay.addEventListener('click', function (e) {
    if (e.target === overlay) closeAdminPanel();
  });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && overlay.classList.contains('open')) closeAdminPanel();
  });

  adminEmail.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') adminPw.focus();
  });
  adminPw.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') doAdminLogin();
  });
  loginBtn.addEventListener('click', doAdminLogin);

  function doAdminLogin() {
    var email    = adminEmail.value.trim();
    var password = adminPw.value;
    adminErr.className   = 'admin-error';
    adminErr.textContent = '';

    if (!email || !password) {
      adminErr.textContent = 'Please enter your email and password.';
      adminErr.className   = 'admin-error show';
      return;
    }

    loginBtn.disabled    = true;
    loginBtn.textContent = 'Signing in...';

    auth.signInWithEmailAndPassword(email, password).then(function (cred) {
      return db.collection('admins').doc(cred.user.uid).get().then(function (doc) {
        if (!doc.exists) {
          return auth.signOut().then(function () {
            throw { friendly: 'Access denied.' };
          });
        }
        var role = (doc.data().role || '').toUpperCase();
        if (role !== 'SUPER_ADMIN') {
          return auth.signOut().then(function () {
            throw { friendly: 'Access denied.' };
          });
        }
        window.location.href = 'index.html';
      });
    }).catch(function (err) {
      var msg = err.friendly || 'Invalid credentials.';
      if (err.code === 'auth/too-many-requests')      msg = 'Too many attempts. Wait and try again.';
      if (err.code === 'auth/network-request-failed') msg = 'Network error. Check your connection.';
      adminErr.textContent = msg;
      adminErr.className   = 'admin-error show';
      loginBtn.disabled    = false;
      loginBtn.textContent = 'Sign In';
    });
  }

  fetch('chat-widget.html')
    .then(function (r) { return r.text(); })
    .then(function (html) {
      document.getElementById('chat-container').innerHTML = html;
      var script = document.createElement('script');
      script.src = 'chat.js';
      document.body.appendChild(script);
    })
    .catch(function (err) { console.error('Chat widget failed:', err); });
</script>

</body>
</html>
