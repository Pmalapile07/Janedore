<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>JANEDORE | Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

  <link rel="stylesheet" href="variables.css">
  <link rel="stylesheet" href="utilities.css">
  <link rel="stylesheet" href="footer.css">
  <link rel="stylesheet" href="buttons.css">
  
  <!-- Chat Widget CSS -->
  <link rel="stylesheet" href="chat-widget.css">

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    
    body {
      font-family: 'Manrope', sans-serif;
      background: #fafaf9;
      color: #1a1a1a;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    .coming-soon-logo {
      width: 120px;
      height: auto;
      margin-bottom: 48px;
      opacity: 0.9;
    }

    .coming-soon-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(36px, 8vw, 64px);
      font-weight: 300;
      letter-spacing: 0.04em;
      color: #1a1a1a;
      margin-bottom: 16px;
      line-height: 1.1;
    }

    .coming-soon-subtitle {
      font-size: 12px;
      font-weight: 400;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: #888;
      margin-bottom: 40px;
    }

    .coming-soon-description {
      max-width: 420px;
      font-size: 14px;
      font-weight: 300;
      line-height: 1.8;
      color: #666;
      margin-bottom: 48px;
    }

    .coming-soon-email-form {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      justify-content: center;
      max-width: 400px;
      width: 100%;
      margin-bottom: 48px;
    }

    .coming-soon-input {
      flex: 1 1 240px;
      padding: 14px 18px;
      border: 0.5px solid #d5d5d5;
      border-radius: 4px;
      font-family: 'Manrope', sans-serif;
      font-size: 13px;
      font-weight: 300;
      letter-spacing: 0.02em;
      background: #fff;
      outline: none;
      transition: border-color 0.2s;
    }

    .coming-soon-input:focus {
      border-color: #1a1a1a;
    }

    .coming-soon-btn {
      flex: 0 0 auto;
      padding: 14px 28px;
      background: #1a1a1a;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-family: 'Manrope', sans-serif;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.2s;
      white-space: nowrap;
    }

    .coming-soon-btn:hover {
      background: #333;
    }

    .coming-soon-social {
      display: flex;
      gap: 24px;
      margin-bottom: 32px;
    }

    .coming-soon-social a {
      color: #888;
      text-decoration: none;
      font-size: 20px;
      transition: color 0.2s;
    }

    .coming-soon-social a:hover {
      color: #1a1a1a;
    }

    .coming-soon-footer-text {
      font-size: 10px;
      font-weight: 300;
      letter-spacing: 0.05em;
      color: #aaa;
    }

    .coming-soon-success {
      display: none;
      font-size: 13px;
      font-weight: 400;
      color: #2d7d46;
      margin-top: 16px;
    }

    /* Chat widget */
    #chat-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <img 
    class="coming-soon-logo" 
    src="https://cdn.shopify.com/s/files/1/0705/5615/6145/files/janedore_logo.png?v=1777797571" 
    alt="JANEDORE"
  >

  <h1 class="coming-soon-title">Coming Soon</h1>
  <p class="coming-soon-subtitle">Something curated is on the way</p>
  
  <p class="coming-soon-description">
    We're carefully selecting pieces that embody understated boldness. 
    Join the waitlist to be the first to know when we launch.
  </p>

  <form class="coming-soon-email-form" onsubmit="submitWaitlist(event)">
    <input 
      class="coming-soon-input" 
      type="email" 
      id="waitlist-email" 
      placeholder="Your email address" 
      required
    >
    <button class="coming-soon-btn" type="submit">Notify Me</button>
  </form>
  <div class="coming-soon-success" id="waitlist-success">✓ You're on the list. We'll be in touch.</div>

  <div class="coming-soon-social">
    <a href="https://instagram.com/janedore" target="_blank" title="Instagram">
      <i class="ph-thin ph-instagram-logo"></i>
    </a>
    <a href="https://tiktok.com/@janedore" target="_blank" title="TikTok">
      <i class="ph-thin ph-tiktok-logo"></i>
    </a>
    <a href="mailto:hello@janedore.co.za" title="Email">
      <i class="ph-thin ph-envelope"></i>
    </a>
  </div>

  <p class="coming-soon-footer-text">JANEDORE STUDIO &copy; 2026</p>

  <!-- Chat Widget Container -->
  <div id="chat-container"></div>

  <!-- Firebase Config -->
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBjtD9j-jKHtjMVmI2ENxy0T3ts9uf2JNI",
      authDomain: "janedore-9f035.firebaseapp.com",
      projectId: "janedore-9f035",
      storageBucket: "janedore-9f035.firebasestorage.app",
      messagingSenderId: "571299748651",
      appId: "1:571299748651:web:01463a772d47b39cc4036e",
      measurementId: "G-Y9NMT0ZGKZ",
      databaseURL: "https://janedore-9f035-default-rtdb.firebaseio.com"
    };
    if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  </script>

  <!-- Load Chat Widget -->
  <script>
    fetch('chat-widget.html')
      .then(r => r.text())
      .then(html => {
        document.getElementById('chat-container').innerHTML = html;
        // Load chat.js after widget HTML is injected
        var script = document.createElement('script');
        script.src = 'chat.js';
        document.body.appendChild(script);
      })
      .catch(err => console.error('Chat widget failed:', err));
  </script>

  <!-- Waitlist Form Handler -->
  <script>
    function submitWaitlist(e) {
      e.preventDefault();
      var email = document.getElementById('waitlist-email').value.trim();
      if (!email) return;
      
      var db = firebase.firestore();
      db.collection('newsletter').add({
        email: email,
        source: 'coming-soon',
        createdAt: firebase.firestore.FieldValue.serverTimestamp()
      }).then(function() {
        document.getElementById('waitlist-success').style.display = 'block';
        document.getElementById('waitlist-email').value = '';
      }).catch(function(err) {
        console.error('Waitlist signup failed:', err);
        alert('Something went wrong. Please try again.');
      });
    }
  </script>

</body>
</html>
